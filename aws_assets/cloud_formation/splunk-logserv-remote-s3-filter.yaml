AWSTemplateFormatVersion: '2010-09-09'
Description: 'Lambda function for cross-account S3 event filtering with local SQS notification queue. Filters S3 event notifications based on time and path patterns before forwarding to Splunk.'

Parameters:
  NewIAMUserName:
    Type: String
    Description: "Name for the new IAM user for Splunk LogServ"
    Default: "splunk_logserv_user"
    AllowedPattern: '^[a-zA-Z0-9+=,.@_-]+$'
    MinLength: 3
    MaxLength: 64
    ConstraintDescription: 'Must be a valid IAM user name (3-64 characters)'

  CrossAccountSQSQueueArn:
    Type: String
    Description: "ARN of the SQS queue in the SAP ECS AWS account"
    Default: "arn:aws:sqs:us-east-1:123456789012:splunk-logserv-remote-sqs-queue"
    AllowedPattern: '^arn:aws:sqs:[a-z0-9-]+:[0-9]{12}:[a-zA-Z0-9_-]{1,80}$'
    ConstraintDescription: 'Must be a valid SQS ARN format (arn:aws:sqs:region:account-id:queue-name)'
    MinLength: 20
    MaxLength: 1024

  CrossAccountS3Bucket:
    Type: String
    Description: "Name of the source S3 bucket in the SAP ECS AWS account"
    Default: "splunk-logserv-remote-bucket"
    AllowedPattern: '^[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$'
    ConstraintDescription: 'Must be a valid S3 bucket name (3-63 characters, lowercase letters, numbers, hyphens, and periods only)'
    MinLength: 3
    MaxLength: 63

  LocalSQSQueueName:
    Type: String
    Description: "Name for the local SQS queue that receives filtered S3 event notifications"
    Default: "splunk-logserv-local-target-queue"
    AllowedPattern: '^[a-zA-Z0-9_-]{1,80}$'
    ConstraintDescription: 'Queue name must be 3-80 characters long and contain only alphanumeric characters, hyphens, and underscores'
    MinLength: 3
    MaxLength: 80

  LambdaCodeBucket:
    Type: String
    Description: "S3 bucket name containing the Lambda function code"
    Default: "splunk-logserv-lambda-binary"
    AllowedPattern: '^[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$'
    ConstraintDescription: 'Must be a valid S3 bucket name (3-63 characters, lowercase letters, numbers, hyphens, and periods only)'
    MinLength: 3
    MaxLength: 63

  LambdaFunctionName:
    Type: String
    Description: "Name of choice for the Lambda function"
    Default: "splunk-logserv-lambda-filter"
    AllowedPattern: '^[a-zA-Z0-9_-]{1,64}$'
    ConstraintDescription: 'Function name must be 3-64 characters long and contain only letters, numbers, hyphens, and underscores'
    MinLength: 3
    MaxLength: 64

  DaysInThePast:
    Type: Number
    Description: "Number of days in the past to filter messages on. Messages older than this will be discarded."
    Default: 7
    MinValue: 1
    MaxValue: 365
    ConstraintDescription: 'Must be a number between 1 and 365'

  IncludeFilters:
    Type: String
    Description: "Comma-separated patterns for paths to include (e.g., 'hana/hanaaudit,linux/*,webdispatcher/accesslogs'). Format: <clz_dir>/<clz_subdir>. Use '*/*' to include all paths."
    Default: "*/*"
    MaxLength: 2048

  ExcludeFilters:
    Type: String
    Description: "Comma-separated patterns for paths to exclude (e.g., 'linux/cron,*/messages'). Format: <clz_dir>/<clz_subdir>. Leave empty to exclude nothing."
    Default: ""
    MaxLength: 2048

Resources:
  # IAM User for Splunk LogServ (created first to break circular dependency)
  SplunkLogServUser:
    Type: AWS::IAM::User
    Properties:
      UserName: !Ref NewIAMUserName

  # Dead Letter Queue for local notifications (created first)
  LocalNotificationDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "${LocalSQSQueueName}-dlq"
      MessageRetentionPeriod: 1209600  # 14 days

  # Local SQS Queue for filtered S3 event notifications
  LocalNotificationQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Ref LocalSQSQueueName
      VisibilityTimeout: 600  # 10 minutes
      MessageRetentionPeriod: 1209600  # 14 days
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt LocalNotificationDLQ.Arn
        maxReceiveCount: 3
    DependsOn:
      - LocalNotificationDLQ

  # SQS Queue Policy to allow Lambda to send messages
  LocalNotificationQueuePolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues:
        - !Ref LocalNotificationQueue
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              AWS: !GetAtt SplunkLogServRole.Arn
            Action:
              - sqs:SendMessage
            Resource: !GetAtt LocalNotificationQueue.Arn
    DependsOn:
      - LocalNotificationQueue
      - SplunkLogServRole

  # Splunk LogServ TA Role
  SplunkLogServRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: splunk-logserv-ta-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              AWS: !GetAtt SplunkLogServUser.Arn
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: splunk-logserv-ta-policy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              # CloudWatch Logs permissions (explicit)
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/*"

              # SQS permissions for cross-account queue (source)
              - Effect: Allow
                Action:
                  - sqs:ReceiveMessage
                  - sqs:DeleteMessage
                  - sqs:GetQueueAttributes
                  - sqs:GetQueueUrl
                  - sqs:ChangeMessageVisibility
                  - sqs:SendMessage
                Resource: !Ref CrossAccountSQSQueueArn
              
              # S3 permissions for cross-account source bucket (read objects for filtering)
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:GetObjectVersion
                  - s3:GetObjectAttributes
                  - s3:ListBucket
                Resource: 
                  - !Sub "arn:aws:s3:::${CrossAccountS3Bucket}"
                  - !Sub "arn:aws:s3:::${CrossAccountS3Bucket}/*"

              # SQS permissions for local queue (target - send filtered messages)
              - Effect: Allow
                Action:
                  - sqs:ReceiveMessage
                  - sqs:DeleteMessage
                  - sqs:GetQueueAttributes
                  - sqs:GetQueueUrl
                  - sqs:ChangeMessageVisibility
                  - sqs:SendMessage
                Resource: !GetAtt LocalNotificationQueue.Arn

              # KMS Decrypt permissions (for encrypted S3 objects)
              - Effect: Allow
                Action:
                  - kms:Decrypt
                Resource: "*"
              
              # SQS List Queues
              - Effect: Allow
                Action:
                  - sqs:ListQueues
                Resource: "*"     

    DependsOn:
      - SplunkLogServUser
      - LocalNotificationQueue

  # CloudWatch Log Group for Lambda
  LambdaLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${LambdaFunctionName}"
      RetentionInDays: 14

  # Lambda Function for S3 Event Filtering
  LogServFilterLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Ref LambdaFunctionName
      Runtime: python3.12
      Handler: log-filterer-lambda.lambda_handler
      Code:
        S3Bucket: !Ref LambdaCodeBucket
        S3Key: splunk-logserv-filter-lambda.zip
      Timeout: 300
      MemorySize: 512
      Role: !GetAtt SplunkLogServRole.Arn
      Environment:
        Variables:
          DAYS_IN_THE_PAST: !Ref DaysInThePast
          INCLUDE_FILTERS: !Ref IncludeFilters
          EXCLUDE_FILTERS: !Ref ExcludeFilters
          TARGET_SQS_ARN: !GetAtt LocalNotificationQueue.Arn
    DependsOn:
      - SplunkLogServRole
      - LambdaLogGroup
      - LocalNotificationQueue

  # Inline Policy for IAM User to assume the role
  UserAssumeRolePolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: splunk-logserv-sqs-based-input-assume-role-policy
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: 'AllowAssumeRole'
            Effect: Allow
            Action: 'sts:AssumeRole'
            Resource: !GetAtt SplunkLogServRole.Arn
      Users:
        - !Ref SplunkLogServUser
    DependsOn:
      - SplunkLogServUser
      - SplunkLogServRole

Outputs:
  LambdaFunctionArn:
    Description: ARN of the Lambda filter function
    Value: !GetAtt LogServFilterLambda.Arn
  
  SplunkLogServRoleArn:
    Description: ARN of the Splunk LogServ TA role
    Value: !GetAtt SplunkLogServRole.Arn
  
  LocalNotificationQueueArn:
    Description: ARN of the local notification SQS queue (filtered messages)
    Value: !GetAtt LocalNotificationQueue.Arn
  
  LocalNotificationQueueUrl:
    Description: URL of the local notification SQS queue (use this in AWS Add-on SQS-Based S3 input)
    Value: !Ref LocalNotificationQueue

  SplunkLogServUserArn:
    Description: ARN of the created Splunk LogServ IAM User
    Value: !GetAtt SplunkLogServUser.Arn
    Export:
      Name: !Sub '${AWS::StackName}-SplunkLogServUserArn'
        
  YourAccountId:
    Description: Your AWS Account ID
    Value: !Ref AWS::AccountId

  FilterConfiguration:
    Description: Current filter configuration summary
    Value: !Sub "DaysInPast=${DaysInThePast}, IncludeFilters=${IncludeFilters}, ExcludeFilters=${ExcludeFilters}"


  # Event Source Mapping for cross-account SQS (source bucket events)
  # NOTE: This is commented out because SAP LogServ Support must first grant
  # cross-account permissions to your IAM role before the Lambda can poll
  # the SQS queue in the SAP ECS account. After SAP grants permissions,
  # you can either:
  #   1. Uncomment this section and update the stack, or
  #   2. Manually create the event source mapping in the AWS Console
  #
  # CrossAccountSQSEventSourceMapping:
  #   Type: AWS::Lambda::EventSourceMapping
  #   Properties:
  #     EventSourceArn: !Ref CrossAccountSQSQueueArn
  #     FunctionName: !Ref LogServFilterLambda
  #     BatchSize: 10
  #     MaximumBatchingWindowInSeconds: 5
  #     Enabled: true
  #     ScalingConfig:
  #       MaximumConcurrency: 10
  #     FunctionResponseTypes:
  #       - ReportBatchItemFailures
  #   DependsOn:
  #     - SplunkLogServRole
  #     - LogServFilterLambda
