AWSTemplateFormatVersion: '2010-09-09'
Description: 'Lambda function for cross-account S3 object copying with local notification queue without an SNS Topic'

Parameters:
  CrossAccountSQSArn:
    Type: String
    Description: "ARN of the SQS queue in the SAP RISE AWS account"
    #Default: "arn:aws:sqs:us-east-1:OTHER-ACCOUNT-ID:s3-event-queue"
    Default: "arn:aws:sqs:ap-south-1:442223965655:sap-hec-clz-442223965655-ap-south-1-hec53-xsd-logserv"
  
  CrossAccountSourceBucket:
    Type: String
    Description: "Name of the source S3 bucket in the SAP RISE AWS account"
    #Default: "rise-account-source-bucket-name"
    Default: "sap-hec-clz-442223965655-ap-south-1-hec53-xsd"
  
  LocalS3BucketName:
    Type: String
    Description: "Name of the local target S3 bucket in this account"
    #Default: "saprise-ls-local-target-bucket-name"
    Default: "sap-rise-ls-local-target-bucket"
  
  LocalSQSQueueName:
    Type: String
    Description: "Name for the local SQS queue that receives the local target bucket events"
    #Default: "saprise-ls-local-target-queue-name"
    Default: "sap-rise-ls-local-target-queue"

  LambdaCodeBucket:
    Type: String
    Description: "S3 bucket name containing the Lambda function code"
    Default: "sap-rise-ls-lambda-binary"

  LambdaFunctionName:
    Type: String
    Description: "Name of choice for the Lambda function"
    Default: "sap-rise-ls-lambda-s3-forwarder"

Resources:
  # Target bucket in your account
  TargetS3Bucket:
    Type: AWS::S3::Bucket
    DependsOn: LocalNotificationQueuePolicy
    Properties:
      BucketName: !Ref LocalS3BucketName
      #PublicAccessBlockConfiguration:
        #BlockPublicAcls: true
        #BlockPublicPolicy: true
        #IgnorePublicAcls: true
        #RestrictPublicBuckets: true
      NotificationConfiguration:
        QueueConfigurations:
          - Event: "s3:ObjectCreated:*"
            Queue: !GetAtt LocalNotificationQueue.Arn

  # Local SQS Queue for target bucket notifications
  LocalNotificationQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Ref LocalSQSQueueName
      VisibilityTimeout: 300  # 5 minutes
      MessageRetentionPeriod: 1209600  # 14 days
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt LocalNotificationDLQ.Arn
        maxReceiveCount: 3

  # Dead Letter Queue for local notifications
  LocalNotificationDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "${LocalSQSQueueName}-dlq"
      MessageRetentionPeriod: 1209600  # 14 days

  # SQS Queue Policy to allow S3 to send messages
  LocalNotificationQueuePolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues:
        - !Ref LocalNotificationQueue
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: s3.amazonaws.com
            Action:
              - sqs:SendMessage
            Resource: !GetAtt LocalNotificationQueue.Arn
            Condition:
              ArnEquals:
                aws:SourceArn: !Sub "arn:aws:s3:::${LocalS3BucketName}"

  # Lambda Execution Role (simplified - no cross-account role assumption needed)
  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "saprise-ls-lambda-role-${AWS::Region}"
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: CrossAccountS3CopyPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              # CloudWatch Logs permissions (explicit)
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/*"

              # SQS permissions for cross-account queue
              - Effect: Allow
                Action:
                  - sqs:ReceiveMessage
                  - sqs:DeleteMessage
                  - sqs:GetQueueAttributes
                  - sqs:GetQueueUrl
                  - sqs:DeleteMessage
                  - sqs:ChangeMessageVisibility
                  - sqs:ListQueues
                Resource: !Ref CrossAccountSQSArn
              
              # S3 permissions for cross-account source bucket
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:GetObjectVersion
                  - s3:ListBucket
                Resource: 
                  - !Sub "arn:aws:s3:::${CrossAccountSourceBucket}"
                  - !Sub "arn:aws:s3:::${CrossAccountSourceBucket}/*"
              
              # S3 permissions for target bucket in your account
              - Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:PutObjectAcl
                  - s3:PutObjectTagging
                  - s3:GetObject
                  - s3:ListBucket
                Resource: 
                  - !Sub "arn:aws:s3:::${LocalS3BucketName}"
                  - !Sub "arn:aws:s3:::${LocalS3BucketName}/*"
              
              # SQS permissions for local queue
              - Effect: Allow
                Action:
                  - sqs:ReceiveMessage
                  - sqs:DeleteMessage
                  - sqs:GetQueueAttributes
                  - sqs:GetQueueUrl
                  - sqs:DeleteMessage
                  - sqs:ChangeMessageVisibility
                  - sqs:ListQueues
                Resource: !Ref LocalNotificationQueue

  # CloudWatch Log Group for Lambda
  LambdaLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${S3CopyLambda}"
      RetentionInDays: 14  # Adjust as needed (1, 3, 5, 7, 14, 30, 60, 90, etc.)

  # Lambda Function (simplified)
  S3CopyLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Ref LambdaFunctionName
      Runtime: java17
      Handler: com.splunk.logserv.LogForwarder::handleRequest
      Code:
        S3Bucket: !Ref LambdaCodeBucket
        S3Key: saprise-ls-logforwarder-lambda.jar
      Timeout: 300
      MemorySize: 1024
      Role: !GetAtt LambdaExecutionRole.Arn
      Environment:
        Variables:
          TARGET_BUCKET_NAME: !Ref LocalS3BucketName

  # Event Source Mapping for cross-account SQS (source bucket events)
  CrossAccountSQSEventSourceMapping:
    Type: AWS::Lambda::EventSourceMapping
    Properties:
      EventSourceArn: !Ref CrossAccountSQSArn
      FunctionName: !Ref S3CopyLambda
      BatchSize: 10
      MaximumBatchingWindowInSeconds: 5
      Enabled: true

  # Note: Local SQS queue is created and linked to S3 bucket but NOT connected to Lambda
  # This allows for separate processing or monitoring of target bucket events

Outputs:
  LambdaFunctionArn:
    Description: ARN of the Lambda function
    Value: !GetAtt S3CopyLambda.Arn
  
  LambdaExecutionRoleArn:
    Description: ARN of the Lambda execution role
    Value: !GetAtt LambdaExecutionRole.Arn
  
  TargetBucketArn:
    Description: ARN of the target S3 bucket
    Value: !GetAtt TargetS3Bucket.Arn
  
  LocalNotificationQueueArn:
    Description: ARN of the local notification SQS queue
    Value: !GetAtt LocalNotificationQueue.Arn
  
  LocalNotificationQueueUrl:
    Description: URL of the local notification SQS queue
    Value: !Ref LocalNotificationQueue
  
  YourAccountId:
    Description: Your AWS Account ID
    Value: !Ref AWS::AccountId