description = SAP ABAP Enqueue Server (lock management) Logs
EXTRACT-sap_sid = /usr/sap/(?<sap_sid>[A-Z0-9]{3})/ in source
EXTRACT-sap_instance = /usr/sap/[^/]+/(?<sap_instance>[A-Z]+\d+)/ in source
EXTRACT-enq_timestamp = ^\[(?<enq_timestamp>\d{4}-\d{2}-\d{2}-\d{2}:\d{2}:\d{2},\d+)\]
EXTRACT-thread_id = \[Thr\s+(?<thread_id>[0-9a-f]+)\]
EXTRACT-enq_function = \]\s+(?<enq_function>[A-Za-z]\w+):


# SAP ABAP System Event Log
[sap:abap:event]
category = Application
description = SAP ABAP System Event Logs (uptime metrics)
EXTRACT-sap_sid = /usr/sap/(?<sap_sid>[A-Z0-9]{3})/ in source
EXTRACT-sap_instance = /usr/sap/[^/]+/(?<sap_instance>[A-Z]+\d+)/ in source
EXTRACT-uptime_days = up time = (?<uptime_days>\d+)
EXTRACT-uptime_total_secs = \((?<uptime_total_secs>\d+) secs\)
EVAL-uptime_hours = floor(uptime_total_secs / 3600)


# SAP ABAP Gateway/Router Log
[sap:abap:gateway]
category = Network
description = SAP ABAP Gateway/Router Logs
EXTRACT-sap_sid = /usr/sap/(?<sap_sid>[A-Z0-9]{3})/ in source
EXTRACT-sap_instance = /usr/sap/[^/]+/(?<sap_instance>[A-Z]+\d+)/ in source
EXTRACT-gw_function = ^(?:\*{3}LOG\s+\w+=>\s+)?(?<gw_function>Gw\w+):
EXTRACT-gw_remote_host = host\s+(?<gw_remote_host>[a-zA-Z0-9._-]+)
EXTRACT-gw_service = service\s+(?<gw_service>\w+)
EXTRACT-gw_error_detail = \*\s+ERROR\s+(?<gw_error_detail>.+)


# SAP ABAP Internet Communication Manager Log
[sap:abap:icm]
category = Network
description = SAP ABAP ICM (Internet Communication Manager) Logs
EXTRACT-sap_sid = /usr/sap/(?<sap_sid>[A-Z0-9]{3})/ in source
EXTRACT-sap_instance = /usr/sap/[^/]+/(?<sap_instance>[A-Z]+\d+)/ in source
EXTRACT-thread_id = \[Thr\s+(?<thread_id>[0-9a-f]+)\]
EXTRACT-icm_request_type = (?<icm_request_type>ASYNC_RFC|HTTP_NORMAL|INTERNAL)
EXTRACT-icm_transaction_id = (?:ASYNC_RFC|HTTP_NORMAL|INTERNAL)\s+(?<icm_transaction_id>T\d+_U\d+_M\d+)
EXTRACT-icm_status_code = T\d+_U\d+_M\d+,\s*(?<icm_status_code>\d{3})
EXTRACT-icm_program = program=(?<icm_program>\w+)
EXTRACT-icm_time = time=(?<icm_time>\d{2}:\d{2}:\d{2})
EXTRACT-icm_protocol = protocol:\s*(?<icm_protocol>\w+)
EXTRACT-icm_local_ip = local:\s*(?<icm_local_ip>\d+\.\d+\.\d+\.\d+)
EXTRACT-icm_peer_ip = peer:\s*(?<icm_peer_ip>\d+\.\d+\.\d+\.\d+)
EXTRACT-icm_memory = memory=(?<icm_memory>\d+)
EXTRACT-icm_tasks = tasks=(?<icm_tasks>\d+)
EVAL-icm_is_error = if(like(icm_status_code, "5%") OR like(icm_status_code, "4%"), "true", "false")
FIELDALIAS-src = icm_local_ip AS src
FIELDALIAS-dest = icm_peer_ip AS dest


# SAP ABAP Message Server Log
[sap:abap:messageserver]
category = Application
description = SAP ABAP Message Server Logs
EXTRACT-sap_sid = /usr/sap/(?<sap_sid>[A-Z0-9]{3})/ in source
EXTRACT-sap_instance = /usr/sap/[^/]+/(?<sap_instance>[A-Z]+\d+)/ in source
EXTRACT-thread_id = \[Thr\s+(?<thread_id>[0-9a-f]+)\]


# SAP ABAP Start Service Log
[sap:abap:sapstartsrv]
category = Application
description = SAP ABAP Start Service (sapstartsrv) Logs
EXTRACT-sap_sid = /usr/sap/(?<sap_sid>[A-Z0-9]{3})/ in source
EXTRACT-sap_instance = /usr/sap/[^/]+/(?<sap_instance>[A-Z]+\d+)/ in source
EXTRACT-sapstartsrv_port = port\s+(?<sapstartsrv_port>\d+)


# SAP ABAP Work Process Log
[sap:abap:workprocess]
category = Application
description = SAP ABAP Work Process (dev_w*) Logs
EXTRACT-sap_sid = /usr/sap/(?<sap_sid>[A-Z0-9]{3})/ in source
EXTRACT-sap_instance = /usr/sap/[^/]+/(?<sap_instance>[A-Z]+\d+)/ in source
EXTRACT-wp_category = ^(?<wp_category>[A-Z])\s{2}
EXTRACT-wp_function = ^[A-Z]\s{2}(?<wp_function>[A-Za-z]\w+)
EXTRACT-wp_sub_function = \[(?<wp_sub_function>[a-z_]+)\]
EVAL-wp_category_name = case(wp_category=="A", "A = ABAP Processor", wp_category=="B", "B = Database Interface", wp_category=="C", "C = Communication", wp_category=="D", "D = Dispatcher", wp_category=="M", "M = Memory Management", wp_category=="N", "N = Network (NI)", wp_category=="O", "O = Enqueue / Lock", wp_category=="Q", "Q = RFC Queue", wp_category=="R", "R = Roll Area", wp_category=="S", "S = SQL / Statistics", wp_category=="T", "T = Task Handler", wp_category=="X", "X = RFC / CPIC", wp_category=="Y", "Y = Dynpro / Screen", 1=1, wp_category . " = Other")


# =============================================================================
# SAP HANA Trace Log Sourcetype
# =============================================================================

# SAP HANA Database Trace Logs (composite: daemon, nameserver, indexserver, backup, dpserver, alert traces)
[sap:hana:tracelogs]
category = Database
description = SAP HANA Database Trace Logs
EXTRACT-sap_sid = /usr/sap/(?<sap_sid>[A-Z0-9]{3})/ in source
EXTRACT-hana_instance = /usr/sap/[^/]+/(?<hana_instance>HDB\d+)/ in source
EXTRACT-hana_trace_pid = ^\[(?<hana_trace_pid>\d+)\]
EXTRACT-hana_trace_level = \d{2}:\d{2}:\d{2}\.\d+\s+(?<hana_trace_level>[iewfd])
EXTRACT-hana_trace_component = [iewfd]\s+(?<hana_trace_component>\S+)
EXTRACT-hana_trace_source_file = (?<hana_trace_source_file>\w+\.\w+)\((?<hana_trace_source_line>\d+)\)
EVAL-hana_trace_severity = case(hana_trace_level=="e", "ERROR", hana_trace_level=="w", "WARNING", hana_trace_level=="f", "FATAL", hana_trace_level=="i", "INFO", hana_trace_level=="d", "DEBUG", 1=1, "UNKNOWN")
FIELDALIAS-severity = hana_trace_severity AS severity
FIELDALIAS-component = hana_trace_component AS component


# =============================================================================
# SAP Cloud Connector (SCC) Sourcetypes
# =============================================================================

# SAP Cloud Connector Audit Log
[sap:scc:audit]
category = Security
description = SAP Cloud Connector Audit Logs (CSV format)
EXTRACT-scc_audit_timestamp = ^(?<scc_audit_timestamp>\d{4}-\d{2}-\d{2}\s+\d{2}:\d{2}:\d{2},\d+\s+[+-]\d{4})
EXTRACT-scc_audit_type = ,(?<scc_audit_type>SERVICE_STOPPED|SERVICE_STARTED|UNSPECIFIED|CONNECTION_OPENED|CONNECTION_CLOSED|CONFIGURATION_CHANGED|ACCESS_DENIED|[A-Z_]+),
EXTRACT-scc_account_id = account:///(?<scc_account_id>[0-9a-f-]+)


# SAP Cloud Connector HTTP Access Log
[sap:scc:http_access]
category = Web
description = SAP Cloud Connector HTTP Access Logs
EXTRACT-clientip = ^(?<clientip>\d+\.\d+\.\d+\.\d+)
EXTRACT-scc_thread = ^\S+\s+(?<scc_thread>\S+)
EXTRACT-scc_user = ^\S+\s+\S+\s+(?<scc_user>\S+)\s+\[
EXTRACT-method = "(?<method>[A-Z]+)\s+
EXTRACT-uri = "[A-Z]+\s+(?<uri>\S+)\s+HTTP
EXTRACT-http_version = (?<http_version>HTTP/[\d.]+)"
EXTRACT-status = "\s+(?<status>\d{3})
EXTRACT-bytes = "\s+\d{3}\s+(?<bytes>\S+)
EXTRACT-response_time_ms = "\s+\d{3}\s+\S+\s+(?<response_time_ms>\d+)$
EVAL-is_error = if(status>=400, "true", "false")
EVAL-status_category = case(status>=500, "5xx_server_error", status>=400, "4xx_client_error", status>=300, "3xx_redirect", status>=200, "2xx_success", 1=1, "unknown")
EVAL-is_authenticated = if(scc_user=="-", "false", "true")
FIELDALIAS-src = clientip AS src
FIELDALIAS-src_ip = clientip AS src_ip
FIELDALIAS-http_method = method AS http_method
FIELDALIAS-url = uri AS url
FIELDALIAS-http_status = status AS http_status
FIELDALIAS-user = scc_user AS user


# ---------------------------------------------------------------------------
# SAP Service Logs (sap/*)
# ---------------------------------------------------------------------------

# SAP Start Service (Host Control Agent)
[sap:sapstartsrv]
category = Authentication
description = SAP Start Service Logs (Host Control)

# Common fields
EXTRACT-thread_id = \[Thr\s+(?<thread_id>\d+)\]
EXTRACT-severity = \*{3}\s+(?<severity>ERROR|WARNING)\s+=>\s+
EXTRACT-error_message = (?:ERROR|WARNING)\s+=>\s+(?<error_message>[^[\n]+)
EXTRACT-source_location = \[(?<source_location>\w+\s+\d+)\]\s*$

# Authentication fields
EXTRACT-auth_user = user\((?<auth_user>[^)]+)\)
EXTRACT-remote_address = Remote Address\s+\((?<remote_address>[^)]+)\)
EXTRACT-remote_ip = Remote Address\s+\((?<remote_ip>\d+\.\d+\.\d+\.\d+):
EXTRACT-remote_port = Remote Address\s+\(\d+\.\d+\.\d+\.\d+:(?<remote_port>\d+)\)
EXTRACT-webmethod = Webmethod\s+(?<webmethod>\w+)\s+failed

# SSL/TLS fields
EXTRACT-ssl_local = local=(?<ssl_local_ip>\d+\.\d+\.\d+\.\d+):(?<ssl_local_port>\d+)
EXTRACT-ssl_peer = peer=(?<ssl_peer_ip>\d+\.\d+\.\d+\.\d+):(?<ssl_peer_port>\d+)
EXTRACT-ssl_error_code = ==(?<ssl_error_code>SSSLERR_\w+)
EXTRACT-ssl_state = SSL_get_state\(\)==(?<ssl_state>0x[0-9a-f]+)
EXTRACT-tls_version = ClientHello\.client_version\s+(?<tls_client_version>\S+)

EVAL-auth_result = if(like(_raw, "%Authentication failed%"), "failure", "success")
EVAL-is_auth_event = if(like(_raw, "%Authentication%") OR like(_raw, "%Unauthorized%"), "true", "false")
EVAL-is_ssl_event = if(like(_raw, "%SSL%") OR like(_raw, "%TLS%"), "true", "false")

FIELDALIAS-src = remote_ip AS src
FIELDALIAS-src_ssl = ssl_peer_ip AS src
FIELDALIAS-user = auth_user AS user


# SAP Host Agent Execution Logs
[sap:saphostexec]
category = System
description = SAP Host Agent Execution Logs

EXTRACT-thread_id = \[Thr\s+(?<thread_id>\d+)\]
EXTRACT-severity = \*{3}\s+(?<severity>ERROR|WARNING)\s+=>\s+
EXTRACT-function_name = (?:ERROR|WARNING)\s+=>\s+(?<function_name>\w+):
EXTRACT-error_message = (?:ERROR|WARNING)\s+=>\s+(?<error_message>[^[\n]+)
EXTRACT-source_file = \[(?<source_file>\w+\.\w+)\s+
EXTRACT-source_line = \[\w+\.\w+\s+(?<source_line>\d+)\]\s*$
EXTRACT-file_path = stat\(\s*(?<file_path>[^\s)]+)\s*\)

EVAL-is_upgrade_check = if(like(_raw, "%IsUpgradeNecessary%"), "true", "false")


# SAP Router Connection and Trace Logs
[sap:saprouter]
category = Network
description = SAP Router Connection and Trace Logs

# Connection log extractions
EXTRACT-action = \d{4}\s+(?<action>CONNECT FROM|DISCONNECT|INVAL DATA)\s+
EXTRACT-connection_id = (?:CONNECT FROM|DISCONNECT|INVAL DATA)\s+(?<connection_id>C\d+/[\w-]+)
EXTRACT-src_ip = host\s+(?<src_ip>\d+\.\d+\.\d+\.\d+)
EXTRACT-src_port = host\s+\d+\.\d+\.\d+\.\d+/(?<src_port>\d+)

# Trace error extractions
EXTRACT-severity_trc = \*{3}\s+(?<severity>ERROR|LOG\s+\w+)\s+=>\s+
EXTRACT-error_function = (?:ERROR|LOG\s+\w+)\s+=>\s+(?<error_function>\w+):
EXTRACT-peer_address = peer=(?<peer_address>\d+\.\d+\.\d+\.\d+:\d+)
EXTRACT-peer_ip = peer=(?<peer_ip>\d+\.\d+\.\d+\.\d+):
EXTRACT-peer_port = peer=\d+\.\d+\.\d+\.\d+:(?<peer_port>\d+)
EXTRACT-local_address = local=(?<local_address>[\d.:]+)
EXTRACT-return_code = rc=(?<return_code>-?\d+)
EXTRACT-source_file_trc = \[(?<source_file>\w+\.\w+)\s+\d+\]\s*$
EXTRACT-source_line_trc = \[\w+\.\w+\s+(?<source_line>\d+)\]\s*$
EXTRACT-error_detail = \((?<error_detail>[^)]+)\)\s+\[\w+\.\w+

EVAL-is_connection_event = if(match(action, "^(CONNECT|DISCONNECT|INVAL)"), "true", "false")
EVAL-is_error = if(like(_raw, "%ERROR%"), "true", "false")

FIELDALIAS-src = src_ip AS src
FIELDALIAS-dest = peer_ip AS dest
