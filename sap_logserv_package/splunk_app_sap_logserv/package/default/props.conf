# SAP ABAP Security Audit Log
[sap:abap:audit]
category = Security
description = SAP ABAP Security Audit Log (binary/hex format)
EXTRACT-sap_sid = /usr/sap/(?<sap_sid>[A-Z0-9]{3})/ in source
EXTRACT-sap_instance = /usr/sap/[^/]+/(?<sap_instance>[A-Z]+\d+)/ in source
EXTRACT-audit_marker = (?<audit_marker>AU[A-Z])


# SAP ABAP Dispatcher Log
[sap:abap:dispatcher]
category = Application
description = SAP ABAP Dispatcher (disp+work) Logs
EXTRACT-sap_sid = /usr/sap/(?<sap_sid>[A-Z0-9]{3})/ in source
EXTRACT-sap_instance = /usr/sap/[^/]+/(?<sap_instance>[A-Z]+\d+)/ in source
EXTRACT-dp_function = ^(?:\*{3}\s+\w+\s+=>\s+)?(?<dp_function>[A-Za-z]\w+):
EXTRACT-dp_severity = ^\*{3}\s+(?<dp_severity>WARNING|ERROR)
EXTRACT-wp_id = WP[:\s-]+(?<wp_id>\d+)
EXTRACT-dp_reason = reason=(?<dp_reason>[A-Z_]+)


# SAP ABAP Enqueue Server Log
[sap:abap:enqueueserver]
