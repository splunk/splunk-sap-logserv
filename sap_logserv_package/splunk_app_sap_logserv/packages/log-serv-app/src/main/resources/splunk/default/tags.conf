# Tags for CIM data-model routing — Splunk for SAP LogServ
#
# Each [eventtype=<name>] stanza below activates one or more CIM tags on every
# event matching that eventtype's search expression (defined in eventtypes.conf).
# CIM data models gate inclusion of events on these tag values:
#   - Authentication.Authentication accepts events with `tag=authentication`
#   - Change.All_Changes accepts events with `tag=change`
#   - Web.Web accepts events with `tag=web`
#   - Network_Sessions.* accepts events with `tag=network` AND `tag=session`
#
# Authored in session 033 / B.2 as part of the v0.1.1 ES-integration work.


# =============================================================================
# Authentication model routing
# =============================================================================

[eventtype=sap_hana_authentication]
authentication = enabled

[eventtype=sap_sapstartsrv_authentication]
authentication = enabled

[eventtype=sap_scc_authentication]
authentication = enabled

[eventtype=linux_sudolog_authentication]
authentication = enabled
privileged = enabled


# =============================================================================
# Change model routing
# =============================================================================

[eventtype=sap_hana_change]
change = enabled

[eventtype=sap_scc_change]
change = enabled


# =============================================================================
# Web model routing
# =============================================================================

[eventtype=sap_webdispatcher_access]
web = enabled

[eventtype=sap_scc_http_access]
web = enabled

[eventtype=sap_abap_icm_request]
web = enabled


# =============================================================================
# Network_Sessions model routing (requires BOTH `network` AND `session` tags)
# =============================================================================

[eventtype=sap_abap_gateway_session]
network = enabled
session = enabled

[eventtype=sap_saprouter_session]
network = enabled
session = enabled


# ===========================================================================
# Absorbed from:
#   - Splunk Add-on for ISC BIND v2.0.0   (SPDX: LicenseRef-Splunk-1-2020)
#   - Splunk Add-on for Squid Proxy v2.1.0 (SPDX: LicenseRef-Splunk-8-2021)
#
# Adopted into the LogServ App in v0.0.5.0 build 184 (session 040, 2026-05-12)
# and ported to v0.1.x in session 041. Splunk merges same-eventtype tags
# across multiple installed apps' tags.conf files at runtime, so these layer
# cleanly with the LogServ App's own session-033 ES-integration tagging.
# ===========================================================================

# --- ISC BIND ---

[eventtype=isc_bind_query]
network = enabled
resolution = enabled
dns = enabled

[eventtype=isc_bind_queryerror]
network = enabled
resolution = enabled
dns = enabled

# --- Squid Proxy ---

[eventtype=squid_access]
web = enabled
proxy = enabled
