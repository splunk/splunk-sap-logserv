# =============================================================================
# fields.conf - index-time field declarations for the Splunk for SAP LogServ
#               UI App (splunk_app_sap_logserv)
# =============================================================================
#
# WHAT THIS DOES
# --------------
# The four fields below are written to each event's _meta blob at INDEX TIME by
# the Data TA's WRITE_META transforms (splunk_ta_sap_logserv/default/transforms.conf):
#   [extract_clz]                  -> clz_dir, clz_subdir   (FORMAT = $1::$2)
#   [logserv_set_splunk_solution]  -> splunk_solution       (always stamped)
#   [logserv_set_cloud_provider]   -> cloud_provider         (aws | azure; opt-in)
# referenced from the [sap_logserv_logs] props.conf TRANSFORMS-50/51 lines.
#
# Writing a value to _meta makes it a real INDEXED field on disk, but Splunk
# does NOT expose an indexed field to `| tstats` (or to indexed-field WHERE
# filters) until a fields.conf stanza declares INDEXED = true for it. This file
# is that declaration. It performs ZERO index-time work of its own - the bytes
# are already on disk; this only flips the search-time switch that lets tstats
# read them from the tsidx.
#
# SCOPE NOTE
# ----------
# The Data Pipeline Overview dashboard does NOT require this file: every DPO
# tstats query groups only on DEFAULT-INDEXED fields (host / sourcetype /
# source / _time), which tstats can already read with zero schema change. This
# fields.conf is needed only by the Multi-Cloud Overview dashboard, which
# groups by cloud_provider, and is bundled here for completeness.
#
# RETROACTIVITY (important)
# -------------------------
# Index-time stamping is FORWARD-ONLY. tstats will see these fields only on
# events whose INGEST already stamped them:
#   * clz_dir / clz_subdir   - long-standing; present on virtually all data
#   * splunk_solution        - stamped since session 046 (2026-05-29)
#   * cloud_provider         - stamped since session 046 (2026-05-29), and only
#                              when an admin has selected AWS/Azure in the Data
#                              TA Configuration -> Cloud Provider tab
# This file does NOT retroactively populate older buckets. Events ingested
# before a field's stamping began won't carry it; tstats grouping on that field
# returns those events under a missing/blank group, not an error. (The App's
# sap_logserv_cloud_provider_default_macro applies an "aws" default at SEARCH
# time for un-stamped events, but that is a search-time eval and is NOT visible
# to tstats - tstats sees only the on-disk indexed value.)
#
# WHY IT'S SAFE
# -------------
#   * No reingest, no reindex, no index-time config change.
#   * Reversible - delete this file (and reload/restart) to revert.
#   * Search-time props.conf EXTRACT/EVAL/FIELDALIAS directives are unaffected.
# =============================================================================

[clz_dir]
INDEXED = true

[clz_subdir]
INDEXED = true

[splunk_solution]
INDEXED = true

[cloud_provider]
INDEXED = true
