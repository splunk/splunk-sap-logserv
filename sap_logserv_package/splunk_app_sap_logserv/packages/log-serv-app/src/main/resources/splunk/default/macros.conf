[sap_logserv_idx_macro]
definition = index="sap_logserv_logs"
iseval = 0

[sap_logserv_audit_idx_macro]
definition = index="logserv_ai_assistant_audit"
iseval = 0

# Normalizes cloud_provider field across AWS and Azure event sources.
# Azure-sourced events carry an indexed `cloud_provider=azure` field via
# the Splunk Add-on for Microsoft Cloud Services input stanza's
# `_meta = cloud_provider::azure` setting. AWS-sourced events typically
# don't carry the field (legacy Splunk_TA_aws S3 inputs), so we default
# missing values to "aws". Customers who deploy multi-cloud with parallel
# AWS-side `_meta = cloud_provider::aws` on their S3 inputs can use this
# macro for consistent cross-provider attribution either way.
[sap_logserv_cloud_provider_default_macro]
definition = eval cloud_provider=coalesce(cloud_provider, "aws")
iseval = 0
