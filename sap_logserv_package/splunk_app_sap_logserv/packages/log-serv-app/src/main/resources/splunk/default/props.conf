# ===========================================================================
# --- Absorbed from Splunk Add-on for Squid Proxy v2.1.0 (SPDX: LicenseRef-Splunk-8-2021) ---
# Original add-on archived by Splunk. Parsing absorbed into the LogServ App
# in v0.0.5.0 build 184 (session 040, 2026-05-12). The [squid:access:recommended]
# stanza from the original is NOT absorbed (our pipeline only emits native
