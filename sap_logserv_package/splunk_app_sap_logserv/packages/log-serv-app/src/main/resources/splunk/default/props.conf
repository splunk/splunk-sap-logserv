# SAP ABAP System Event Log
[sap:abap:event]
category = Application
description = SAP ABAP System Event Logs (uptime metrics)
EXTRACT-sap_sid = /usr/sap/(?<sap_sid>[A-Z0-9]{3})/ in source
EXTRACT-sap_instance = /usr/sap/[^/]+/(?<sap_instance>[A-Z]+\d+)/ in source
EXTRACT-uptime_days = up time = (?<uptime_days>\d+)
EXTRACT-uptime_total_secs = \((?<uptime_total_secs>\d+) secs\)
EVAL-uptime_hours = floor(uptime_total_secs / 3600)
EVAL-vendor_product = "SAP NetWeaver ABAP"
EVAL-app = "sap_abap_event"


# SAP ABAP Gateway/Router Log
[sap:abap:gateway]
category = Network
description = SAP ABAP Gateway/Router Logs
EXTRACT-sap_sid = /usr/sap/(?<sap_sid>[A-Z0-9]{3})/ in source
EXTRACT-sap_instance = /usr/sap/[^/]+/(?<sap_instance>[A-Z]+\d+)/ in source
EXTRACT-gw_function = ^(?:\*{3}LOG\s+\w+=>\s+)?(?<gw_function>Gw\w+):
EXTRACT-gw_remote_host = host\s+(?<gw_remote_host>[a-zA-Z0-9._-]+)
EXTRACT-gw_service = service\s+(?<gw_service>\w+)
EXTRACT-gw_error_detail = \*\s+ERROR\s+(?<gw_error_detail>.+)
# RFC peer/local IP extraction — feeds the Environment Topology view.
# SAP NI logs format these as `P=<peer_ip>.<sub>:<port>; L=<local_ip>:<port>`.
# About 9-12% of gateway events are network-connection lines that match.
# `local_ip` is canonical: it always equals an IP owned by THIS host's SID,
# so it's the basis for the self-derived IP→SID inventory used by the
# topology view. (See SESSION-MEMORY-023.md Path A Phase 2.)
EXTRACT-rfc_peer_ip = P=(?<peer_ip>\d+\.\d+\.\d+\.\d+)
EXTRACT-rfc_local_ip = L=(?<local_ip>\d+\.\d+\.\d+\.\d+)

# CIM Network_Sessions data model compliance (session 033 / B.2)
# - src = remote peer (the entity initiating/terminating the session)
# - dest = local SAP gateway (this host)
# - action: gateway functions like GwIInitConn map to "added", GwIDecrConn to "removed", etc.
# - signature = the gateway function name (canonical event identifier)
# - dvc = host (the SAP host running the gateway)
FIELDALIAS-src = peer_ip AS src
FIELDALIAS-src_ip = peer_ip AS src_ip
FIELDALIAS-dest = local_ip AS dest
FIELDALIAS-dest_ip = local_ip AS dest_ip
EVAL-action = case(match(gw_function,"(?i)connect|init|open"), "added", match(gw_function,"(?i)disconnect|decr|close"), "removed", match(gw_function,"(?i)error"), "blocked", 1=1, "")
EVAL-signature = gw_function
EVAL-dvc = host
EVAL-app = "sap_abap_gateway"
EVAL-vendor_product = "SAP NetWeaver ABAP"


# SAP ABAP Internet Communication Manager Log
[sap:abap:icm]
category = Network
description = SAP ABAP ICM (Internet Communication Manager) Logs
EXTRACT-sap_sid = /usr/sap/(?<sap_sid>[A-Z0-9]{3})/ in source
EXTRACT-sap_instance = /usr/sap/[^/]+/(?<sap_instance>[A-Z]+\d+)/ in source
EXTRACT-thread_id = \[Thr\s+(?<thread_id>[0-9a-f]+)\]
EXTRACT-icm_request_type = (?<icm_request_type>ASYNC_RFC|HTTP_NORMAL|INTERNAL)
EXTRACT-icm_transaction_id = (?:ASYNC_RFC|HTTP_NORMAL|INTERNAL)\s+(?<icm_transaction_id>T\d+_U\d+_M\d+)
EXTRACT-icm_status_code = T\d+_U\d+_M\d+,\s*(?<icm_status_code>\d{3})
EXTRACT-icm_program = program=(?<icm_program>\w+)
EXTRACT-icm_time = time=(?<icm_time>\d{2}:\d{2}:\d{2})
EXTRACT-icm_protocol = protocol:\s*(?<icm_protocol>\w+)
EXTRACT-icm_local_ip = local:\s*(?<icm_local_ip>\d+\.\d+\.\d+\.\d+)
EXTRACT-icm_peer_ip = peer:\s*(?<icm_peer_ip>\d+\.\d+\.\d+\.\d+)
EXTRACT-icm_memory = memory=(?<icm_memory>\d+)
EXTRACT-icm_tasks = tasks=(?<icm_tasks>\d+)
EVAL-icm_is_error = if(like(icm_status_code, "5%") OR like(icm_status_code, "4%"), "true", "false")

# CIM Web data model compliance (session 033 / B.2)
# F2 fix: previously `src = icm_local_ip` and `dest = icm_peer_ip` — semantically inverted
# vs CIM Web convention (src = request origin = client; dest = server processing the request).
# For ICM (incoming HTTP requests to the SAP server): peer_ip IS the request origin (client),
# local_ip IS the SAP server. Swapping aliases now to be CIM-correct.
# Note: dashboards + saved searches use icm_local_ip / icm_peer_ip natively, so no breakage.
FIELDALIAS-src = icm_peer_ip AS src
FIELDALIAS-dest = icm_local_ip AS dest
FIELDALIAS-status = icm_status_code AS status
EVAL-action = case(icm_status_code<400, "allowed", icm_status_code>=400, "blocked", 1=1, "unknown")
EVAL-app = "sap_abap_icm"
EVAL-vendor_product = "SAP NetWeaver ABAP"


# SAP ABAP Message Server Log
[sap:abap:messageserver]
category = Application
description = SAP ABAP Message Server Logs
EXTRACT-sap_sid = /usr/sap/(?<sap_sid>[A-Z0-9]{3})/ in source
EXTRACT-sap_instance = /usr/sap/[^/]+/(?<sap_instance>[A-Z]+\d+)/ in source
EXTRACT-thread_id = \[Thr\s+(?<thread_id>[0-9a-f]+)\]
EVAL-vendor_product = "SAP NetWeaver ABAP"
EVAL-app = "sap_abap_messageserver"


