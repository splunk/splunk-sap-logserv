EVAL-vendor_product = "SAP NetWeaver ABAP"
EVAL-app = "sap_abap_sapstartsrv"


# SAP ABAP Work Process Log
[sap:abap:workprocess]
category = Application
description = SAP ABAP Work Process (dev_w*) Logs
EXTRACT-sap_sid = /usr/sap/(?<sap_sid>[A-Z0-9]{3})/ in source
EXTRACT-sap_instance = /usr/sap/[^/]+/(?<sap_instance>[A-Z]+\d+)/ in source
EXTRACT-wp_category = ^(?<wp_category>[A-Z])\s{2}
EXTRACT-wp_function = ^[A-Z]\s{2}(?<wp_function>[A-Za-z]\w+)
EXTRACT-wp_sub_function = \[(?<wp_sub_function>[a-z_]+)\]
EVAL-wp_category_name = case(wp_category=="A", "A = ABAP Processor", wp_category=="B", "B = Database Interface", wp_category=="C", "C = Communication", wp_category=="D", "D = Dispatcher", wp_category=="M", "M = Memory Management", wp_category=="N", "N = Network (NI)", wp_category=="O", "O = Enqueue / Lock", wp_category=="Q", "Q = RFC Queue", wp_category=="R", "R = Roll Area", wp_category=="S", "S = SQL / Statistics", wp_category=="T", "T = Task Handler", wp_category=="X", "X = RFC / CPIC", wp_category=="Y", "Y = Dynpro / Screen", 1=1, wp_category . " = Other")
EVAL-vendor_product = "SAP NetWeaver ABAP"
EVAL-app = "sap_abap_workprocess"


# =============================================================================
# SAP HANA Trace Log Sourcetype
# =============================================================================

# SAP HANA Database Trace Logs (composite: daemon, nameserver, indexserver, backup, dpserver, alert traces)
[sap:hana:tracelogs]
category = Database
description = SAP HANA Database Trace Logs
EXTRACT-sap_sid = /usr/sap/(?<sap_sid>[A-Z0-9]{3})/ in source
EXTRACT-hana_instance = /usr/sap/[^/]+/(?<hana_instance>HDB\d+)/ in source
EXTRACT-hana_trace_pid = ^\[(?<hana_trace_pid>\d+)\]
EXTRACT-hana_trace_level = \d{2}:\d{2}:\d{2}\.\d+\s+(?<hana_trace_level>[iewfd])
EXTRACT-hana_trace_component = [iewfd]\s+(?<hana_trace_component>\S+)
EXTRACT-hana_trace_source_file = (?<hana_trace_source_file>\w+\.\w+)\((?<hana_trace_source_line>\d+)\)
# HANA server hostname extracted from the source path's third segment
# (e.g., `/usr/sap/XHQ/HDB04/vhxsdxhqdb01/trace/...` -> `vhxsdxhqdb01`).
# Feeds the topology view's hostname inventory: combined with sap_sid this
# proves "vhxsdxhqdb01 belongs to XHQ", giving us inventory entries that
# the gateway L= field alone wouldn't surface for HANA-side hosts.
EXTRACT-hana_host = /usr/sap/[A-Z0-9]{3}/HDB\d+/(?<hana_host>[a-zA-Z0-9_-]+)/ in source
# Tenant database SID for multi-tenant HANA deployments. Source path pattern
# `/trace/DB_<TENANT_SID>/` indicates the tenant. e.g., a HANA system with
# SID=XHQ that hosts tenant XCQ produces paths like `.../trace/DB_XCQ/...`.
# Surfaces the cross-stack relationship in the topology view.
EXTRACT-hana_tenant_sid = /trace/DB_(?<hana_tenant_sid>[A-Z0-9]{3})/ in source
# SQL operation duration on profiler/statreg/etc. trace events.
# Pattern: "<float> msec" (~14.6% of events on the live dataset). Feeds the
# HANA Trace dashboard's Slowest SQL Operations + p95 duration trend panels.
EXTRACT-hana_op_duration_ms = (?<hana_op_duration_ms>\d+\.\d+)\s+msec
EVAL-hana_trace_severity = case(hana_trace_level=="e", "ERROR", hana_trace_level=="w", "WARNING", hana_trace_level=="f", "FATAL", hana_trace_level=="i", "INFO", hana_trace_level=="d", "DEBUG", 1=1, "UNKNOWN")
FIELDALIAS-severity = hana_trace_severity AS severity
FIELDALIAS-component = hana_trace_component AS component
# No clean CIM model fit for database engine traces; cross-cutting vendor_product literal.
EVAL-vendor_product = "SAP HANA"
EVAL-app = "sap_hana_tracelog"


# =============================================================================
# SAP Cloud Connector (SCC) Sourcetypes
# =============================================================================

# SAP Cloud Connector Audit Log
[sap:scc:audit]
category = Security
description = SAP Cloud Connector Audit Logs (CSV format)
EXTRACT-scc_audit_timestamp = ^(?<scc_audit_timestamp>\d{4}-\d{2}-\d{2}\s+\d{2}:\d{2}:\d{2},\d+\s+[+-]\d{4})
EXTRACT-scc_audit_type = ,(?<scc_audit_type>SERVICE_STOPPED|SERVICE_STARTED|UNSPECIFIED|CONNECTION_OPENED|CONNECTION_CLOSED|CONFIGURATION_CHANGED|ACCESS_DENIED|[A-Z_]+),
EXTRACT-scc_account_id = account:///(?<scc_account_id>[0-9a-f-]+)
# Backend host:port appears in CONNECTION_OPENED/CLOSED descriptions:
# `Connection to backend [vhxsdxcqci.sin.hec.xsd-vlab.com:44301] closed for account:///<uuid>`
EXTRACT-scc_backend = backend\s+\[(?<scc_backend_host>[^:\]]+):(?<scc_backend_port>\d+)\]
# Configuration property name appears in CONFIGURATION_CHANGED descriptions:
# `Configuration property [subaccountCertificate] changed by administrator for account:///<uuid>`
EXTRACT-scc_config_property = property\s+\[(?<scc_config_property>[^\]]+)\]
# Application/service tunnel name appears in SERVICE_STARTED/SERVICE_STOPPED:
# `Application tunnel [<tunnel-name>|connectivity!b7|null] started for account:///<uuid>`
EXTRACT-scc_tunnel = tunnel\s+\[(?<scc_tunnel>[^|\]]+)

# CIM Authentication + Change data model compliance (session 033 / B.2)
# - SCC audit CSV does NOT carry user identity directly. For CONFIGURATION_CHANGED events
#   the description literally says "by administrator", so we hardcode user="scc_administrator".
#   For other events, user="scc_system".
# - dest = scc_backend_host when present (CONNECTION events) else host
# - action: success/failure for connection events; created/modified/deleted for config events
EVAL-app = "sap_cloud_connector"
EVAL-vendor_product = "SAP Cloud Connector"
EVAL-user = case(scc_audit_type=="CONFIGURATION_CHANGED", "scc_administrator", scc_audit_type=="ACCESS_DENIED", "unknown", 1=1, "scc_system")
EVAL-dest = coalesce(scc_backend_host, host)
EVAL-action = case(scc_audit_type=="ACCESS_DENIED", "failure", scc_audit_type IN ("CONNECTION_OPENED","SERVICE_STARTED"), "success", scc_audit_type=="CONFIGURATION_CHANGED", "modified", scc_audit_type IN ("CONNECTION_CLOSED","SERVICE_STOPPED"), "removed", 1=1, "")
EVAL-change_type = case(scc_audit_type=="CONFIGURATION_CHANGED", "configuration", scc_audit_type IN ("SERVICE_STARTED","SERVICE_STOPPED"), "system", 1=1, "")
EVAL-object = case(scc_audit_type=="CONFIGURATION_CHANGED", scc_config_property, scc_audit_type IN ("SERVICE_STARTED","SERVICE_STOPPED"), scc_tunnel, scc_audit_type IN ("CONNECTION_OPENED","CONNECTION_CLOSED"), scc_backend_host, 1=1, "")
EVAL-object_category = case(scc_audit_type=="CONFIGURATION_CHANGED", "configuration", scc_audit_type IN ("SERVICE_STARTED","SERVICE_STOPPED"), "service", scc_audit_type IN ("CONNECTION_OPENED","CONNECTION_CLOSED"), "network connection", 1=1, "other")
EVAL-result = if(scc_audit_type=="ACCESS_DENIED", "failure", "success")
EVAL-signature = scc_audit_type


# SAP Cloud Connector HTTP Access Log
[sap:scc:http_access]
category = Web
description = SAP Cloud Connector HTTP Access Logs
EXTRACT-clientip = ^(?<clientip>\d+\.\d+\.\d+\.\d+)
EXTRACT-scc_thread = ^\S+\s+(?<scc_thread>\S+)
EXTRACT-scc_user = ^\S+\s+\S+\s+(?<scc_user>\S+)\s+\[
EXTRACT-method = "(?<method>[A-Z]+)\s+
EXTRACT-uri = "[A-Z]+\s+(?<uri>\S+)\s+HTTP
EXTRACT-http_version = (?<http_version>HTTP/[\d.]+)"
EXTRACT-status = "\s+(?<status>\d{3})
EXTRACT-bytes = "\s+\d{3}\s+(?<bytes>\S+)
EXTRACT-response_time_ms = "\s+\d{3}\s+\S+\s+(?<response_time_ms>\d+)$
EVAL-is_error = if(status>=400, "true", "false")
EVAL-status_category = case(status>=500, "5xx_server_error", status>=400, "4xx_client_error", status>=300, "3xx_redirect", status>=200, "2xx_success", 1=1, "unknown")
EVAL-is_authenticated = if(scc_user=="-", "false", "true")
FIELDALIAS-src = clientip AS src
FIELDALIAS-src_ip = clientip AS src_ip
FIELDALIAS-http_method = method AS http_method
FIELDALIAS-url = uri AS url
FIELDALIAS-http_status = status AS http_status
FIELDALIAS-user = scc_user AS user

# CIM Web data model compliance (session 033 / B.2)
# - dest = host (the SCC backend hostname processing the HTTP request)
# - action = allowed/blocked per status
# - bytes_in/bytes_out: SCC HTTP access carries response body size only (bytes_in = 0)
EVAL-dest = host
EVAL-action = case(status<400, "allowed", status>=400, "blocked", 1=1, "unknown")
EVAL-bytes_out = bytes
EVAL-bytes_in = 0
EVAL-app = "sap_cloud_connector"
EVAL-vendor_product = "SAP Cloud Connector"


# ---------------------------------------------------------------------------
# SAP Service Logs (sap/*)
# ---------------------------------------------------------------------------

# SAP Start Service (Host Control Agent)
[sap:sapstartsrv]
category = Authentication
description = SAP Start Service Logs (Host Control)

# Common fields
EXTRACT-thread_id = \[Thr\s+(?<thread_id>\d+)\]
EXTRACT-severity = \*{3}\s+(?<severity>ERROR|WARNING)\s+=>\s+
EXTRACT-error_message = (?:ERROR|WARNING)\s+=>\s+(?<error_message>[^[\n]+)
EXTRACT-source_location = \[(?<source_location>\w+\s+\d+)\]\s*$

# Authentication fields
EXTRACT-auth_user = user\((?<auth_user>[^)]+)\)
EXTRACT-remote_address = Remote Address\s+\((?<remote_address>[^)]+)\)
EXTRACT-remote_ip = Remote Address\s+\((?<remote_ip>\d+\.\d+\.\d+\.\d+):
EXTRACT-remote_port = Remote Address\s+\(\d+\.\d+\.\d+\.\d+:(?<remote_port>\d+)\)
EXTRACT-webmethod = Webmethod\s+(?<webmethod>\w+)\s+failed

# SSL/TLS fields
EXTRACT-ssl_local = local=(?<ssl_local_ip>\d+\.\d+\.\d+\.\d+):(?<ssl_local_port>\d+)
EXTRACT-ssl_peer = peer=(?<ssl_peer_ip>\d+\.\d+\.\d+\.\d+):(?<ssl_peer_port>\d+)
EXTRACT-ssl_error_code = ==(?<ssl_error_code>SSSLERR_\w+)
EXTRACT-ssl_state = SSL_get_state\(\)==(?<ssl_state>0x[0-9a-f]+)
EXTRACT-tls_version = ClientHello\.client_version\s+(?<tls_client_version>\S+)

EVAL-auth_result = if(like(_raw, "%Authentication failed%"), "failure", "success")
EVAL-is_auth_event = if(like(_raw, "%Authentication%") OR like(_raw, "%Unauthorized%"), "true", "false")
EVAL-is_ssl_event = if(like(_raw, "%SSL%") OR like(_raw, "%TLS%"), "true", "false")

FIELDALIAS-src = remote_ip AS src
FIELDALIAS-src_ssl = ssl_peer_ip AS src
FIELDALIAS-user = auth_user AS user

# CIM Authentication data model compliance (session 033 / B.2)
# - action: inline the same logic as auth_result (Splunk's EVAL chain in props.conf
#   doesn't reliably reference other EVAL'd fields within the same stanza, so we don't
#   write `EVAL-action = auth_result` — it would resolve to NULL).
# - dest = host (the EC2 instance running the SAP host control agent)
# - app + vendor_product literals
EVAL-action = if(like(_raw, "%Authentication failed%"), "failure", "success")
EVAL-dest = host
EVAL-app = "sap_host_control"
EVAL-vendor_product = "SAP Start Service"


# SAP Host Agent Execution Logs
[sap:saphostexec]
category = System
description = SAP Host Agent Execution Logs

EXTRACT-thread_id = \[Thr\s+(?<thread_id>\d+)\]
EXTRACT-severity = \*{3}\s+(?<severity>ERROR|WARNING)\s+=>\s+
EXTRACT-function_name = (?:ERROR|WARNING)\s+=>\s+(?<function_name>\w+):
EXTRACT-error_message = (?:ERROR|WARNING)\s+=>\s+(?<error_message>[^[\n]+)
EXTRACT-source_file = \[(?<source_file>\w+\.\w+)\s+
EXTRACT-source_line = \[\w+\.\w+\s+(?<source_line>\d+)\]\s*$
EXTRACT-file_path = stat\(\s*(?<file_path>[^\s)]+)\s*\)

EVAL-is_upgrade_check = if(like(_raw, "%IsUpgradeNecessary%"), "true", "false")
# Heterogeneous events (auth/SSL/filesystem/process/upgrade); CIM Endpoint tagging deferred.
EVAL-vendor_product = "SAP Host Agent"
EVAL-app = "sap_host_exec"


# SAP Router Connection and Trace Logs
[sap:saprouter]
category = Network
description = SAP Router Connection and Trace Logs

# Connection log extractions
EXTRACT-action = \d{4}\s+(?<action>CONNECT FROM|DISCONNECT|INVAL DATA|CONNECT TO|ESTABLISHED)\s+
EXTRACT-connection_id = (?:CONNECT FROM|DISCONNECT|INVAL DATA|CONNECT TO)\s+(?<connection_id>[CS]\d+/[\w-]+)
EXTRACT-src_ip = host\s+(?<src_ip>\d+\.\d+\.\d+\.\d+)
EXTRACT-src_port = host\s+\d+\.\d+\.\d+\.\d+/(?<src_port>\d+)
# Resolved peer hostname captured from the parens after the IP — the
# log line typically looks like `host <ip>/<service> (<resolved.host>)`.
# Starts with [a-zA-Z] to avoid matching IP-only parens like the
# loopback example.
# Feeds the topology view's IP-to-hostname inventory enrichment.
EXTRACT-peer_hostname = \((?<peer_hostname>[a-zA-Z][a-zA-Z0-9._-]+)\)

# Trace error extractions
EXTRACT-severity_trc = \*{3}\s+(?<severity>ERROR|LOG\s+\w+)\s+=>\s+
EXTRACT-error_function = (?:ERROR|LOG\s+\w+)\s+=>\s+(?<error_function>\w+):
EXTRACT-peer_address = peer=(?<peer_address>\d+\.\d+\.\d+\.\d+:\d+)
EXTRACT-peer_ip = peer=(?<peer_ip>\d+\.\d+\.\d+\.\d+):
EXTRACT-peer_port = peer=\d+\.\d+\.\d+\.\d+:(?<peer_port>\d+)
EXTRACT-local_address = local=(?<local_address>[\d.:]+)
EXTRACT-return_code = rc=(?<return_code>-?\d+)
EXTRACT-source_file_trc = \[(?<source_file>\w+\.\w+)\s+\d+\]\s*$
EXTRACT-source_line_trc = \[\w+\.\w+\s+(?<source_line>\d+)\]\s*$
EXTRACT-error_detail = \((?<error_detail>[^)]+)\)\s+\[\w+\.\w+

EVAL-is_connection_event = if(match(action, "^(CONNECT|DISCONNECT|INVAL)"), "true", "false")
EVAL-is_error = if(like(_raw, "%ERROR%"), "true", "false")

FIELDALIAS-src = src_ip AS src
FIELDALIAS-dest = peer_ip AS dest

# CIM Network_Sessions data model compliance (session 033 / B.2)
# - cim_action: separate field that maps existing `action` ("CONNECT FROM", "DISCONNECT", etc.)
#   to CIM Network_Sessions vocabulary (added / removed / blocked). Existing dashboards continue
#   to use the original `action` field; CIM searches will see `cim_action` via the
#   eventtype/tag pair that re-routes action → cim_action for the model.
# - dest_ip = peer_ip (CIM canonical), dvc = host
# - signature = the original action (CONNECT FROM, etc.) — useful identifier
EVAL-cim_action = case(action="CONNECT FROM" OR action="ESTABLISHED", "added", action="DISCONNECT" OR action="CONNECT TO", "removed", action="INVAL DATA", "blocked", 1=1, "")
FIELDALIAS-dest_ip = peer_ip AS dest_ip
FIELDALIAS-src_ip_router = src_ip AS src_ip
EVAL-dvc = host
EVAL-signature = action
EVAL-app = "sap_router"
EVAL-vendor_product = "SAP Router"


