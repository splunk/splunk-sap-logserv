# SAP ABAP Security Audit Log
[sap:abap:audit]
category = Security
description = SAP ABAP Security Audit Log (binary/hex format)
EXTRACT-sap_sid = /usr/sap/(?<sap_sid>[A-Z0-9]{3})/ in source
EXTRACT-sap_instance = /usr/sap/[^/]+/(?<sap_instance>[A-Z]+\d+)/ in source
EXTRACT-audit_marker = (?<audit_marker>AU[A-Z])
# Cross-cutting metadata for ES (B.2). Rich field extraction deferred — binary/hex format
# requires a richer source (SM20/SM19 export). Eventtype + tag scaffolding stays minimal.
EVAL-vendor_product = "SAP NetWeaver ABAP"
EVAL-app = "sap_abap_audit"


# SAP ABAP Dispatcher Log
[sap:abap:dispatcher]
category = Application
description = SAP ABAP Dispatcher (disp+work) Logs
EXTRACT-sap_sid = /usr/sap/(?<sap_sid>[A-Z0-9]{3})/ in source
EXTRACT-sap_instance = /usr/sap/[^/]+/(?<sap_instance>[A-Z]+\d+)/ in source
EXTRACT-dp_function = ^(?:\*{3}\s+\w+\s+=>\s+)?(?<dp_function>[A-Za-z]\w+):
EXTRACT-dp_severity = ^\*{3}\s+(?<dp_severity>WARNING|ERROR)
EXTRACT-wp_id = WP[:\s-]+(?<wp_id>\d+)
EXTRACT-dp_reason = reason=(?<dp_reason>[A-Z_]+)
# No clean CIM model fit; cross-cutting vendor_product for consistency.
EVAL-vendor_product = "SAP NetWeaver ABAP"
EVAL-app = "sap_abap_dispatcher"


# SAP ABAP Enqueue Server Log
[sap:abap:enqueueserver]
category = Application
description = SAP ABAP Enqueue Server (lock management) Logs
EXTRACT-sap_sid = /usr/sap/(?<sap_sid>[A-Z0-9]{3})/ in source
EXTRACT-sap_instance = /usr/sap/[^/]+/(?<sap_instance>[A-Z]+\d+)/ in source
EXTRACT-enq_timestamp = ^\[(?<enq_timestamp>\d{4}-\d{2}-\d{2}-\d{2}:\d{2}:\d{2},\d+)\]
EXTRACT-thread_id = \[Thr\s+(?<thread_id>[0-9a-f]+)\]
EXTRACT-enq_function = \]\s+(?<enq_function>[A-Za-z]\w+):
EVAL-vendor_product = "SAP NetWeaver ABAP"
