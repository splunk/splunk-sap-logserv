disabled = false
nes_fields = src_ips
rule_name = TI: DNS to Malicious Domain
rule_title = TI hit: DNS query to malicious domain ($ti_category$)
search = splunk_sap_logserv_es_ti_dns_to_malicious_domain
security_domain = network
severity = high

[splunk_sap_logserv_es_ti_proxy_to_malicious_ip]
description = TI hit: outbound proxy connection to an IP in the customer-managed malicious-IPs lookup. Risk score 70 (high).
disabled = false
nes_fields = src_ips,dest_ips
rule_name = TI: Proxy to Malicious IP
rule_title = TI hit: outbound proxy to malicious IP ($ti_category$)
