# Correlation Search metadata for Splunk Enterprise Security
#
# Each stanza here references a saved search defined in savedsearches.conf and
# adds ES-specific metadata that ES uses to populate the Correlation Searches
# editor and the Incident Review notable-event panels.
#
# When ES is NOT installed, this file is parsed but harmless — Splunk treats
# it as a custom conf with no consumers. When ES IS installed, ES Content
# Management picks up the entries below and surfaces them in:
#   Settings → Content Management → All Content (filter by App = splunk_app_sap_logserv)
#
# Authored in session 033 / B.4 as part of the v0.1.1 ES-integration work.


[splunk_sap_logserv_es_hana_privilege_escalation]
description = HANA privilege escalation: GRANT WITH ADMIN OPTION or ALTER USER on SYSTEM. Risk score 80 (high).
disabled = false
nes_fields = executing_user,target_user,host
rule_name = HANA Privilege Escalation
rule_title = HANA Privilege Escalation: $action_type$ by $executing_user$ on $target_user$
search = splunk_sap_logserv_es_hana_privilege_escalation
security_domain = identity
severity = high

[splunk_sap_logserv_es_cross_stack_auth_failure]
description = Cross-stack authentication-failure burst across 2+ SAP stacks (HANA, sapstartsrv, Cloud Connector, sudo). Risk score 60 (medium-high).
disabled = false
nes_fields = user
rule_name = Cross-Stack Auth Failure Burst
rule_title = Cross-stack auth-failure burst: user $user$ ($distinct_sourcetypes$ stacks)
search = splunk_sap_logserv_es_cross_stack_auth_failure
security_domain = access
severity = high

[splunk_sap_logserv_es_abap_gateway_anomalous_peer]
description = New ABAP gateway peer IP that has not been seen (or seen <5 times) in the prior 30 days. Risk score 40 (medium).
disabled = false
nes_fields = peer_ip,host
rule_name = ABAP Gateway Anomalous Peer
rule_title = ABAP gateway: new peer IP $peer_ip$ connected to $host$
search = splunk_sap_logserv_es_abap_gateway_anomalous_peer
security_domain = network
severity = medium

[splunk_sap_logserv_es_scc_access_denied_burst]
description = 3+ ACCESS_DENIED events on a single SAP Cloud Connector host within an hour. Risk score 50 (medium).
disabled = false
nes_fields = host
rule_name = SCC ACCESS_DENIED Burst
rule_title = SCC ACCESS_DENIED burst on $host$ ($count$ events)
search = splunk_sap_logserv_es_scc_access_denied_burst
security_domain = access
severity = medium

[splunk_sap_logserv_es_hana_failed_connect_spike]
description = 5+ failed HANA CONNECT attempts by a single user on a single host within an hour. Risk score 50 (medium).
disabled = false
nes_fields = executing_user,host
rule_name = HANA Failed CONNECT Spike
rule_title = HANA failed CONNECT spike: $executing_user$ on $host$ ($count$ failures)
search = splunk_sap_logserv_es_hana_failed_connect_spike
security_domain = access
severity = medium

# Session 034 deep-dive addition
[splunk_sap_logserv_es_oom_kill_burst]
description = 3+ kernel OOM-killer events on a single host within an hour. Detects memory exhaustion (under-sized VM, leaking process, runaway workload). Risk score 50 (medium).
disabled = false
nes_fields = host
rule_name = OOM Kill Burst
rule_title = OOM kill burst on $host$ ($count$ kills, max RSS $max_rss_kb$ kB)
search = splunk_sap_logserv_es_oom_kill_burst
security_domain = endpoint
severity = medium

# B.6 — RBA tier-2 Risk Notable
[splunk_sap_logserv_es_risk_notable_threshold]
description = High accumulated risk on a single object (user, system, or other) across all SAP correlation searches. Fires when total_risk >= 100 in 24h. Standard ES RBA tier-2 pattern. (Source list updated in session 038 / build 232 to include the 13 new B-1 + C + D searches.)
disabled = false
nes_fields = risk_object
rule_name = High Accumulated Risk (SAP RBA)
rule_title = High accumulated risk: $risk_object$ ($total_risk$) across $distinct_searches$ SAP correlation searches
search = splunk_sap_logserv_es_risk_notable_threshold
security_domain = threat
severity = critical

