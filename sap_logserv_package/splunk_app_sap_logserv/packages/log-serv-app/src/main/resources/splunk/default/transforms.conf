filename = splunk_for_sap_logserv_assets.csv
case_sensitive_match = false

[splunk_for_sap_logserv_identities]
filename = splunk_for_sap_logserv_identities.csv
case_sensitive_match = false

# Threat-intelligence lookups (session 038 / build 232 / extended ES content).
# All three CSVs ship empty (header row only) and are customer-managed:
# customers populate from their own threat-intel feed via either Splunk Web
# (Settings -> Lookups -> Lookup table files) or via a customer-authored
# saved search that pulls from their TI source and writes via outputlookup.
# Joined against by the splunk_sap_logserv_es_ti_* correlation searches.
# See docs/content/enterprise-security/threat-intel.md for the full schema +
# population workflow.
[logserv_ti_malicious_domains]
filename = logserv_ti_malicious_domains.csv
case_sensitive_match = false

[logserv_ti_malicious_ips]
filename = logserv_ti_malicious_ips.csv
case_sensitive_match = false

[logserv_ti_compromised_credentials]
filename = logserv_ti_compromised_credentials.csv
case_sensitive_match = false

# Time-bucketed topology KV Store lookups (session 035 / build 188).
# Required by `outputlookup logserv_topology_*` in the aggregate +
# backfill saved searches — without these stanzas Splunk reports
# "The lookup table is invalid" because outputlookup resolves the
# target name through transforms.conf rather than directly against
# the collections.conf entry.
#
# `external_type = kvstore` + `collection = <name>` ties the lookup
# to the KV Store collection. `fields_list` lists every field the
# scheduled-search SPL writes; an unlisted field would be silently
# dropped on outputlookup.

[logserv_topology_nodes]
external_type = kvstore
collection = logserv_topology_nodes
case_sensitive_match = false
fields_list = _key, id, canonical_kind, canonical_value, bucket_ts, kind, tag, label, event_count, last_seen, health_pct

[logserv_topology_edges]
external_type = kvstore
collection = logserv_topology_edges
case_sensitive_match = false
fields_list = _key, id, source_id, target_id, type, direction, bucket_ts, call_count, error_count, warning_count, response_time_p50, response_time_p95, response_time_max, bytes_out_sum, icm_tasks_max, icm_tasks_avg, hana_op_p95_ms, hana_op_max_ms, auth_success_count, auth_fail_count, spl_sourcetype, spl_filter_clauses

[logserv_topology_inventory]
external_type = kvstore
collection = logserv_topology_inventory
case_sensitive_match = false
fields_list = _key, canonical_value, canonical_kind, resolved_sid, updated_at

