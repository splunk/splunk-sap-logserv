# LogServ UI App transforms.
#
# Lookup definitions only; index-time TRANSFORMS-* are owned by the
# Data TA per the app-split rules in CLAUDE.md.

[logserv_sourcetype_metadata_lookup]
filename = logserv_sourcetype_metadata.csv
case_sensitive_match = false

