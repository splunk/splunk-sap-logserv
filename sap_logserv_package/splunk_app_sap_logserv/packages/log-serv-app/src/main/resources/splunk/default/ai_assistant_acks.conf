# ai_assistant_acks.conf — per-app acknowledgement-version tracking
# for AI Assistant legal modals. Mirrors the schema and semantics of
# Splunk's instrumentation framework (`optInVersion` /
# `optInVersionAcknowledged` / `optInChoice` / `optInChoiceAt`) but
# lives in a CUSTOM conf so AppInspect's "no third-party stanzas in
# Splunk-defined conf files" rule passes precert (Splunk Cloud /
# Splunkbase publication).
#
# Renamed from `default/telemetry.conf` in build 123 / session 024
# path A.12 — the original choice (using Splunk's own telemetry.conf)
# matched Splunk's UX pattern but failed the precert rule that
# reserves telemetry.conf for the splunk_instrumentation app.
#
# How it works (`optInVersion` stays in this conf; since build 240 the
# acknowledgement is in KV Store):
#
#   * `optInVersion` declares the current acknowledgement version. It is
#     operator-managed: the Settings page reads it through
#     `configs/conf-ai_assistant_acks` and never writes it.
#   * Since build 240 the acknowledgement itself
#     (`optInVersionAcknowledged`, `optInChoice`, `optInChoiceAt`, stored
#     as `opt_in_*`) lives in the KV Store collection
#     `logserv_ai_assistant_acks`, one row per stanza (writable by
#     admin-tier roles only since build 380). The
#     Settings page compares it against `optInVersion`; when
#     `acknowledged < current`, the corresponding modal is shown on
#     Settings save. Installs from before build 240 may still hold it in
#     `local/ai_assistant_acks.conf`, which is read as a fallback and
#     copied into the collection on an admin's first page load.
#   * Per Splunk's pattern, ANY interaction with the modal — yes
#     (Submit acceptance) OR no (Cancel) — bumps
#     `optInVersionAcknowledged` to the current `optInVersion` (a No
#     that has to turn the AI Assistant off does so only once that
#     write succeeds; build 388). The yes/no choice itself is
#     recorded separately as `optInChoice`
#     and on the corresponding audit event in
#     `logserv_ai_assistant_audit`.
#   * Bumping `optInVersion` in this file asks for the acknowledgement
#     again, once per deployment: the row has no user in its key, so
#     the first admin who answers the modal answers it for everyone.
#     After every change to a disclaimer text in the modal components,
#     increment `optInVersion` below.
#
# REST endpoints used by the React app: `configs/conf-ai_assistant_acks`
# (reads `optInVersion`) and
# `storage/collections/data/logserv_ai_assistant_acks` (the
# acknowledgement).
#
# Companion mechanisms (defence in depth):
#
#   * `forwarder_disabled_acceptance` audit event in
#     `logserv_ai_assistant_audit` (user, IP, timestamp, disclaimer hash,
#     tcVersion, optInChoice). Build 98.
#   * `ai_assistant_enable_acceptance` audit event in
#     `logserv_ai_assistant_audit` for the second stanza. Build 100.
#   * Browser-side dual-write to a customer-controlled HEC endpoint
#     (configurable under General + token under Splunk MCP). Build 98.
#   * THIS conf file (`optInVersion`) and the KV Store collection (the
#     acknowledgement). Build 99 (in default/telemetry.conf), renamed in
#     build 123 (this file); the acknowledgement moved to KV Store in
#     build 240.
#
# Migration note for operators upgrading from build 122 or earlier:
# admin acknowledgement records previously lived in
# `local/telemetry.conf` for our two stanzas. After this rename, those
# records are orphaned and admins will be re-prompted on the next
# Settings save (one-time effect). The previously-written
# local/telemetry.conf entries can be safely deleted.

[logserv-ai-assistant-tc]
# Audit-log integrity acknowledgement (build 99). Triggered on
# Settings save when `audit_forwarder_enabled = false`. The admin
# accepts responsibility for tamper-resistance of the local audit
# index when the off-host forwarder is not enabled.
#
# Bump when `ACCEPTANCE_DISCLAIMER_TEXT` in
# `ForwarderDisabledAcceptanceModal.tsx` changes. Version 2 (build 386): the
# text names the audit index correctly (version 1 named `ai_assistant_audit`).
# utils/legalAcks.consistency-test.ts pins each text to its version.
optInVersion = 2

description = AI Assistant audit-log integrity acknowledgement

# `optInVersionAcknowledged` is INTENTIONALLY ABSENT from default —
# the acknowledged version lives in the KV Store collection
# `logserv_ai_assistant_acks` (since build 240). No row and no pre-240
# local/ value reads as 0, which forces the prompt on first save.
#
# `optInChoice` (yes / no) is written to the same row on
# acknowledgement and reflects the admin's binary answer to the T&C
# prompt. Last-writer-wins; the audit log preserves the historical
# sequence.

[logserv-ai-assistant-enable-tc]
# AI Assistant feature-enablement liability acknowledgement
# (build 100). Triggered on Settings save when `enabled = true` and
# the current version of this T&C has not yet been acknowledged.
# The admin accepts liability disclaimer terms covering data egress
# from this Splunk to the customer-configured LLM provider, customer
# responsibility, no-warranty, indemnification of Splunk + Cisco,
# and limitation of liability. Aligned to Splunk MSA + Cisco EULA
# style.
#
# Bump when `ENABLE_DISCLAIMER_TEXT` in
# `AiAssistantEnableAcceptanceModal.tsx` changes. Version 2 (build 387): clause 7
# says where the answer is recorded - the audit log and the KV Store (version 1
# said "via the standard Splunk telemetry endpoint").
# utils/legalAcks.consistency-test.ts pins each text to its version. Version 3
# (build 388): the closing sentence covers an AI Assistant that is already
# enabled, which a No now turns off.
optInVersion = 3

description = AI Assistant feature-enablement liability acknowledgement
