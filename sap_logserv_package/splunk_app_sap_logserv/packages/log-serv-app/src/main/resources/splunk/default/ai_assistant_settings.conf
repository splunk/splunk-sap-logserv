# ai_assistant_settings.conf — admin-managed defaults for the AI Assistant feature.
#
# All fields here are non-secret. Secrets (API keys, bearer tokens) live in
# passwords.conf via the LLM-provider-specific Settings panels.
#
# Read by: every user when the app loads (universal read via metadata).
# Written by: admin via the Settings page UI (POST to configs/conf-ai_assistant_settings).
#
# Override values land in local/ai_assistant_settings.conf when the admin saves.

[defaults]
# Whether the AI Assistant feature is enabled at all. When false, the
# top-bar AI Assistant button is hidden and no MCP probe runs.
enabled = false

# Templates-only mode. When true, the AI Assistant's free-form / LLM-
# driven path is disabled at RUNTIME: the chat input text field is
# read-only, the Send button is unconditionally disabled, the model
# picker + Power Mode toggle are hidden, the Provider Credentials
# Settings tab is hidden, and an info banner explains the build mode.
# The MCP path + 48 canned prompts + tool tiles + drill-down chips +
# audit log all stay fully active. A defense-in-depth runtime guard at
# the LLM dispatch entry point short-circuits any code path that might
# bypass the disabled UI.
#
# This is the runtime equivalent of the previous compile-time
# TEMPLATES_ONLY build flag — admin-controlled, no rebuild required.
# Toggling false → true takes effect on the next page load (and on the
# running session via the live UI refresh on Settings save). Default
# false (LLM path enabled out-of-the-box for admins who explicitly
# enabled the feature via `enabled = true`).
templates_only_mode = true

# Active LLM provider. Must be one of:
#   mock | anthropic | openai | azure_openai | bedrock | ollama
provider = mock

# Default model for the active provider. Must match a model id from the
# provider's model list (static baseline, or a vendor-discovered model
# when model discovery is enabled). The per-user model picker constrains
# its options to the same provider's list.
default_model = mock-fast

# Dynamic model discovery (session 079 / build 275). When true (default),
# the per-provider model list refreshes itself from the vendor's own
# model-listing API (e.g. Anthropic/OpenAI GET /v1/models) so new models
# appear in the Default Model dropdown + the chat panel's model picker
# without an app upgrade. The fetch is browser-side, uses the provider
# credential already stored in passwords.conf, and is METADATA-ONLY —
# no message content or event data is transmitted (same trust envelope
# as the existing configuration-validation probe). Results are cached in
# the logserv_ai_models KV Store collection (one row per provider,
# refreshed at most every 24h automatically, or on demand via Settings →
# AI Assistant → General → "Refresh model list"). Every refresh writes a
# `model_discovery` audit event.
#
# The shipped static model list is always the floor: discovery failures,
# vendor outages, or disabling this flag can never empty the picker.
# No pricing is guessed for discovered models — the audit log's USD cost
# estimate stays exact-id keyed and reports $0 for unknown ids.
#
# Set to false to forbid all vendor model-list calls (static baseline
# only; the Refresh button hides).
model_discovery_enabled = true

# Privacy tier: 0 = Tier 0 (air-gapped local), 1 = Tier 1 (cloud LLM,
# queries only), 2 = Tier 2 (cloud LLM, aggregated metadata, opt-in).
tier = 1

# Whether the MCP gate is enforced before chat is usable. When false,
# the AI Assistant runs in MCP-less chat mode (Phase D path: streaming
# works, but no tool dispatch).
mcp_required = true

# MCP server endpoint URL. Empty value means "use the default
# /en-US/splunkd/__raw/services/mcp on this Splunk instance". When set,
# MCPClient sends requests to this URL instead.
mcp_server_url =

# Client-side MCP request timeout, in SECONDS. Each request the AI
# Assistant issues to the Splunk MCP Server (tool dispatch, saved-search
# runs, health probe) is aborted client-side after this many seconds. On
# high-ingest environments a canned prompt whose saved search scans a wide
# time range can take a while; if the timeout is too low the request is
# aborted and the chat shows "Error: signal is aborted without reason".
# Raise this if you see that error on legitimately-slow prompts. Note this
# is the BROWSER-side abort — the MCP server has its own separate REST
# timeout (mcp.conf [server] timeout, default 60s in App 7931); the
# effective ceiling for a request is the LOWER of the two, so to allow a
# search to run longer than 60s you must raise BOTH. Accepted range
# 5–600; values outside it are clamped. Default 60.
mcp_timeout_seconds = 60

# Per-user free-form prompt rate limit (rolling 1-hour window). Counts
# free-form sendUserMessage calls per Splunk username. Predefined-prompt
# (Browse prompts) executions do NOT count — they don't invoke the AI
# vendor. When the user reaches the threshold, further free-form
# prompts are refused with a clear in-chat notice and a
# `rate_limited_prompt` audit event is recorded. Set to 0 to disable
# the check entirely. Default 30 (one prompt every two minutes
# sustained).
#
# Maps to OWASP LLM10 (Unbounded Consumption). Defense in depth on top
# of vendor-side rate limits and the customer's billing dashboard.
rate_limit_per_hour = 30

# Per-chat-session cap on the total number of MCP tool dispatches
# (saved-search runs + ad-hoc SPL queries) the AI Assistant may issue
# across all messages in a single chat session. Counts reset when the
# user clears the chat (which generates a new session id). Any dispatch
# beyond the cap is refused with an in-chat notice and a
# `session_tool_cap_hit` audit event. Set to 0 to disable.
#
# This is a defense-in-depth layer ABOVE the per-message cap of 8 turns
# (MAX_TOOL_TURNS). A runaway session that hits MAX_TOOL_TURNS on each
# of N successive user messages would still be bounded by this cap.
#
# Maps to OWASP LLM06 (Excessive Agency). Default 100 — well above
# normal investigative use; bites only on abuse / runaway scripts.
tool_calls_per_session_cap = 100

# Per-user daily AI vendor spend cap in USD. Tracks the sum of
# `vendorCostEstimateUsd` from every `vendor_tier1` audit event for
# the user across the local-calendar-day. When the cap is reached, all
# subsequent free-form prompts are refused with a clear in-chat notice
# and a `daily_spend_cap_hit` audit event is recorded. The check fires
# AFTER the prompt that pushes a user over the cap completes — so a
# user can go up to one prompt over before being locked out (the
# prompt that crossed the line still counts). Tally auto-resets at
# local midnight. Set to 0 to disable.
#
# Maps to OWASP LLM10 (Unbounded Consumption) — cost half. Companion
# to `rate_limit_per_hour` (volume half). Default 50.00 — generous for
# active investigative use on Sonnet/Haiku, tighter on Opus where one
# big prompt can cost a dollar; tune to your model + budget posture.
daily_spend_cap_usd = 50.00

# Tier 2 PII column redaction. When true (default), categorical values
# in `tier2Summary` are replaced with stable `<redacted-XXXXXXX>` tags
# whenever the column NAME matches a known identifier pattern: email,
# user / username, src/dest/client/remote IP, MAC address, account name.
# Cardinality + frequency counts are preserved (the AI still sees that
# column "user" has 7 distinct values, top one with count 12), but the
# value names themselves don't cross the wire to the AI vendor. Set to
# false to send raw identifier values when the customer's compliance
# posture allows it (e.g. internal-only deployment, no PII concern).
#
# Hostname-class columns (host, hostname) are NOT redacted by default —
# Splunk dashboards routinely show hostnames and most admins expect
# them in the AI's view for triage. The companion flag below can opt
# in to hostname redaction for stricter postures.
#
# Maps to OWASP LLM02 (Sensitive Information Disclosure). Closes the
# last open Appendix D recommendation from the OWASP LLM Top 10 review.
tier2_pii_redaction = true

# When true, also redact host / hostname columns under the same scheme
# as the other PII patterns. Default false. Turn on for the strictest
# privacy posture (e.g. multi-tenant or government-tenant deployments
# where host names alone are considered identifying).
tier2_redact_hostnames = false

# ─────────────────────────────────────────────────────────────────────
# Audit index name (configurable; matches the macro)
# ─────────────────────────────────────────────────────────────────────
#
# Splunk index that receives every audit event the AI Assistant writes:
# canned-prompt dispatches, free-form vendor calls, security blocks,
# privacy-tier elevations, legal acknowledgements, etc. The default
# matches the index that the LogServ Index App (splunk_idx_sap_logserv)
# auto-creates from its default/indexes.conf — so out-of-the-box the
# audit log "just works" with no manual configuration.
#
# To use a different index name, do TWO things in lockstep:
#   1. Set this field to the new index name (e.g.
#      `audit_index_name = my_custom_audit_idx`).
#   2. Edit the `sap_logserv_audit_idx_macro` definition (under
#      Settings → Advanced search → Search macros) to match — i.e.
#      `index="my_custom_audit_idx"`.
# The conf field controls WRITES (where AuditWriter posts events); the
# macro controls READS (the SPL the in-app Audit Log Viewer + any user-
# written queries dispatch). They MUST point at the same index, but
# Splunk doesn't auto-sync them — keep them aligned manually.
#
# The underscore-prefixed default name follows Splunk's convention for
# internal / operational indexes (analogous to _internal, _audit). If
# you rename, consider keeping the underscore prefix so the index stays
# excluded from default-index searches.
audit_index_name = logserv_ai_assistant_audit

# ─────────────────────────────────────────────────────────────────────
# Audit log forwarder (tamper-evidence via off-host duplication)
# ─────────────────────────────────────────────────────────────────────
#
# When enabled, every audit event that the AI Assistant writes to the
# local ai_assistant_audit index is ALSO POSTed to the configured HEC
# endpoint. The HEC endpoint should be hosted on a separate Splunk
# instance / SIEM / cloud HEC gateway owned by a different admin team
# than this Splunk's host-root admins. An admin who tampers with the
# local index then has a divergence with the off-host copy, making
# unilateral tampering detectable.
#
# Architecture: forwarding happens client-side (browser dual-write) at
# the same moment the local audit POST fires. Failure to forward fires
# its own `audit_forwarder_failure` audit event in the LOCAL index, so
# operators have a record even when the remote HEC is unreachable.
#
# CORS prerequisite: the destination HEC must allow cross-origin
# requests from this Splunk Web's origin. Add it to HEC's
# `crossOriginSharingPolicy` in the destination instance's
# inputs.conf [http://...] stanza, or to `serverConfig.allowedOrigins`
# in newer Splunk versions.
#
# When false (default), the admin is required to acknowledge a
# tamper-resistance disclaimer at Settings save time. Acceptance is
# recorded as a `forwarder_disabled_acceptance` audit event with the
# admin's user identity, network address, and timestamp.
#
# Maps to OWASP LLM02 (Sensitive Information Disclosure) — defence-in-
# depth on top of Tier 2 PII redaction. Build 98 / session 022.
audit_forwarder_enabled = false

# Destination HEC endpoint. Should be the FULL URL up to (but not
# including) /services/collector/event — e.g.
# `https://siem.example.com:8088`. Empty when the forwarder is disabled.
audit_forwarder_url =

# Optional Splunk index name on the destination side. When empty, the
# destination uses whatever default is configured for the HEC token.
# Common practice is to mirror our local index name (`ai_assistant_audit`)
# but the destination admin may prefer a different name.
audit_forwarder_index =

# Source name stamped on forwarded events. Defaults to a name that
# distinguishes forwarded events from locally-indexed events when both
# end up in the same destination index.
audit_forwarder_source = logserv_ai_assistant_remote

# ─────────────────────────────────────────────────────────────────────
# Power Mode role-based gating (build 166 / session 028)
# ─────────────────────────────────────────────────────────────────────
#
# Comma-separated list of Splunk role names whose members are granted
# the AI Assistant "Power Mode" toggle in the chat input toolbar.
# Empty (default) means the toggle is hidden for everyone — only roles
# in this list see it. Configuration is intentionally role-based, NOT
# user-based: per-user gating would require a custom directory and
# doesn't compose with Splunk's standard RBAC.
#
# When a user whose role appears in this list opens the AI Assistant,
# they see an extra "Power Mode" toggle in the chat input. When that
# toggle is ON, the system primer adds a rule: "you MUST call
# splunk_run_saved_search at least once before generating any narrative
# response." This forces the AI to ground every reply in actual Splunk
# data instead of pure model knowledge — effectively forced-RAG for
# trusted analysts.
#
# Tier interaction: Power Mode does NOT auto-bump the privacy tier.
# Admins who want full data-grounded answers should set BOTH
# `power_user_roles` AND `tier=2` so the AI sees aggregated values from
# the forced saved-search dispatch.
#
# Examples:
#   power_user_roles = power               # built-in Splunk role
#   power_user_roles = sap_basis_analyst   # custom role
#   power_user_roles = power,admin         # multiple roles
power_user_roles =
