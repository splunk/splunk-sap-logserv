# --- Aggregate-EDGES: hourly per-(source_id, target_id, type, bucket) -------
#
# 4-source union: HTTP (webdispatcher access), RFC (gateway peer), HANA Audit
# (cross-stack auth), HANA Tenant (tracelog source path with HANA system +
# tenant SID). Each subsearch normalizes to the shared edge schema with type-
# specific aggregates as additional fields (null for types that don't use
# them).
#
# Edge IDs are computed POST-union from source_id + target_id + type, where
# source_id and target_id are SHA1[:16] of the canonical (kind, value) tuples
# emitted by each subsearch.
#
# spl_filter_clauses encodes the canonical raw-event filter for session-036
# right-pane drilldown queries. Constructed via string concatenation; values
# are constrained to alphanumeric + dot + hyphen + underscore so JSON
# escaping is unnecessary at our data domain.
#
# IP->SID inventory resolution is INTENTIONALLY left to the JS view-side
# aggregator (see useTopologyData) — keeps SPL simple, preserves existing
# display-layer logic, and the canonical raw-IP filter clauses on edge rows
# stay correct for raw-event drilldowns regardless of how the display layer
# retargets edges to SIDs.
#
# Multi-line draft of one subsearch (HTTP edge type) for reference:
#
#   [search `sap_logserv_idx_macro` sourcetype=sap:webdispatcher:access clientip=* host=*
#     | bin _time span=1h
#     | stats count as call_count,
#         sum(eval(if(status>=400, 1, 0))) as error_count,
#         perc50(response_time_ms) as response_time_p50,
#         perc95(response_time_ms) as response_time_p95,
#         max(response_time_ms) as response_time_max,
#         sum(bytes_out) as bytes_out_sum
#         by clientip, host, _time
#     | rename _time as bucket_ts
#     | eval source_kind="ip", source_value=clientip
#     | eval target_kind="host", target_value=host
#     | eval type="http", direction="client"
#     | eval spl_sourcetype="sap:webdispatcher:access"
#     | eval spl_filter_clauses="[{\"field\":\"clientip\",\"value\":\"" . clientip . "\"},{\"field\":\"host\",\"value\":\"" . host . "\"}]"]

[logserv_topology_aggregate_edges]
search = | union [search `sap_logserv_idx_macro` sourcetype=sap:webdispatcher:access clientip=* host=* | bin _time span=1h | stats count as call_count, sum(eval(if(status>=400, 1, 0))) as error_count, perc50(response_time_ms) as response_time_p50, perc95(response_time_ms) as response_time_p95, max(response_time_ms) as response_time_max, sum(bytes_out) as bytes_out_sum by clientip, host, _time | rename _time as bucket_ts | eval source_kind="ip", source_value=clientip, target_kind="host", target_value=host, type="http", direction="client", spl_sourcetype="sap:webdispatcher:access", spl_filter_clauses="[{\"field\":\"clientip\",\"value\":\"" . clientip . "\"},{\"field\":\"host\",\"value\":\"" . host . "\"}]"] [search `sap_logserv_idx_macro` sourcetype=sap:abap:gateway peer_ip=* local_ip=* sap_sid=* | bin _time span=1h | stats count as call_count, sum(eval(if(isnotnull(gw_error_detail), 1, 0))) as error_count by sap_sid, peer_ip, local_ip, _time | rename _time as bucket_ts | eval source_kind="sid", source_value=sap_sid, target_kind="ip", target_value=peer_ip, type="rfc", direction="client", spl_sourcetype="sap:abap:gateway", spl_filter_clauses="[{\"field\":\"sap_sid\",\"value\":\"" . sap_sid . "\"},{\"field\":\"peer_ip\",\"value\":\"" . peer_ip . "\"},{\"field\":\"local_ip\",\"value\":\"" . local_ip . "\"}]"] [search `sap_logserv_idx_macro` sourcetype=sap:hana:audit client_ip=* host=* | where client_ip != "127.0.0.1" | bin _time span=1h | stats count as call_count, sum(eval(if(action_type="CONNECT" AND status="UNSUCCESSFUL", 1, 0))) as auth_fail_count, sum(eval(if(action_type="CONNECT" AND status="SUCCESSFUL", 1, 0))) as auth_success_count by client_ip, host, _time | rename _time as bucket_ts | eval source_kind="ip", source_value=client_ip, target_kind="host", target_value=host, type="hana_audit", direction="client", error_count=auth_fail_count, spl_sourcetype="sap:hana:audit", spl_filter_clauses="[{\"field\":\"client_ip\",\"value\":\"" . client_ip . "\"},{\"field\":\"host\",\"value\":\"" . host . "\"}]"] [search `sap_logserv_idx_macro` sourcetype=sap:hana:tracelogs sap_sid=* hana_tenant_sid=* | bin _time span=1h | stats count as call_count, perc95(hana_op_duration_ms) as hana_op_p95_ms, max(hana_op_duration_ms) as hana_op_max_ms, sum(eval(if(hana_trace_severity="ERROR" OR hana_trace_severity="FATAL", 1, 0))) as error_count, sum(eval(if((hana_trace_severity="WARNING" OR hana_op_duration_ms > 1000) AND hana_trace_severity!="ERROR" AND hana_trace_severity!="FATAL", 1, 0))) as warning_count by sap_sid, hana_tenant_sid, _time | where sap_sid != hana_tenant_sid | rename _time as bucket_ts | eval source_kind="sid", source_value=sap_sid, target_kind="tenant_db", target_value=hana_tenant_sid, type="hana_tenant", direction="bidi", spl_sourcetype="sap:hana:tracelogs", spl_filter_clauses="[{\"field\":\"sap_sid\",\"value\":\"" . sap_sid . "\"},{\"field\":\"hana_tenant_sid\",\"value\":\"" . hana_tenant_sid . "\"}]"] | eval source_id = substr(sha1(source_kind . ":" . source_value), 1, 16) | eval target_id = substr(sha1(target_kind . ":" . target_value), 1, 16) | eval id = substr(sha1(source_id . ":" . target_id . ":" . type), 1, 16) | eval _key = id . ":" . bucket_ts | eval error_count = if(isnull(error_count), 0, error_count) | fields _key, id, source_id, target_id, type, direction, bucket_ts, call_count, error_count, warning_count, response_time_p50, response_time_p95, response_time_max, bytes_out_sum, icm_tasks_max, icm_tasks_avg, hana_op_p95_ms, hana_op_max_ms, auth_success_count, auth_fail_count, spl_sourcetype, spl_filter_clauses | outputlookup append=true logserv_topology_edges
description = Topology Aggregation: per-hour edge rollup into logserv_topology_edges KV Store. Includes pre-computed per-type aggregates (HTTP latency p50/p95/max, RFC saturation, HANA Tenant SQL duration, HANA Audit success/fail) + canonical SPL filter clauses for session-036 edge-data right-pane drilldowns. Hourly cadence in lockstep with logserv_topology_aggregate_nodes.
cron_schedule = 5 * * * *
dispatch.earliest_time = -1h@h
dispatch.latest_time = @h
enableSched = 1
is_scheduled = 1
is_visible = false
disabled = false
request.ui_dispatch_app = splunk_app_sap_logserv

# --- Daily retention cleanup ------------------------------------------------
#
# Trims both KV Store collections to the last 30 days. Pattern: read the
# collection via inputlookup, filter to bucket_ts >= -30d, write back via
# outputlookup (without append=true so the lookup is REPLACED with the
# filtered view).
#
# Two passes (nodes + edges) chained via append. The trailing | stats count
# is just to materialize a small result set so the saved search produces
# something sensible in its dispatched-job summary.
#
# Cron: 30 0 * * * (00:30 UTC daily) — outside the hourly aggregation slot
# to avoid collisions with the :05 aggregation runs.

[logserv_topology_retention]
search = | inputlookup logserv_topology_nodes | where bucket_ts >= relative_time(now(), "-30d") | outputlookup logserv_topology_nodes | append [| inputlookup logserv_topology_edges | where bucket_ts >= relative_time(now(), "-30d") | outputlookup logserv_topology_edges] | stats count
description = Topology Retention: daily cleanup that trims logserv_topology_nodes + logserv_topology_edges to the last 30 days. Runs at 00:30 UTC.
cron_schedule = 30 0 * * *
dispatch.earliest_time = -1d
dispatch.latest_time = now
enableSched = 1
is_scheduled = 1
is_visible = false
disabled = false
request.ui_dispatch_app = splunk_app_sap_logserv

