# ===========================================================================
# Work Process Performance dashboard rollup (session 050 / build 206)
# Dashboard-perf roadmap tier #6 (KV-Store precompute). First dashboard rollup;
# mirrors the Environment Topology KV-Store template above.
#
# A SINGLE collection (logserv_wp_perf_rollup) with a `metric` discriminator
# serves all the dashboard's aggregatable panels (KPIs, sparklines, category
# trend + pie, top functions, by-SID table, dispatcher severity trend, ICM
# async-queue panels). The Recent Dispatcher Errors panel stays RAW (it's an
# event listing a rollup can't reconstruct).
#
# Hour-aligned bucket_ts; composite _key = "<sha1[:20] of metric+dims>:<bucket>".
# Events without wp_function / wp_category_name are fillnull'd to "(none)" so
# the rollup preserves the dashboard's TOTAL counts; the read queries in
# WorkProcessPerformance.tsx exclude "(none)" to reproduce raw `field=*`/dc().
#
# Multi-line draft of the aggregation SPL (flattened in search= below):
#
#   | union
#       [search `sap_logserv_idx_macro` sourcetype="sap:abap:workprocess"
#         | bin _time span=1h
#         | fillnull value="(none)" sap_sid sap_instance wp_function wp_category_name
#         | stats count by sap_sid, sap_instance, wp_function, wp_category_name, _time
#         | rename _time as bucket_ts | eval metric="wp"]
#       [search `sap_logserv_idx_macro` sourcetype="sap:abap:dispatcher"
#         | bin _time span=1h
#         | fillnull value="(none)" sap_sid dp_severity
#         | stats count by dp_severity, sap_sid, _time
#         | rename _time as bucket_ts | eval metric="dp"]
#       [search `sap_logserv_idx_macro` sourcetype="sap:abap:icm" icm_tasks=*
#         | bin _time span=1h
#         | fillnull value="(none)" icm_program icm_request_type
#         | stats count, sum(icm_tasks) as sum_tasks, max(icm_tasks) as max_tasks,
#                 max(icm_memory) as max_mem
#             by icm_program, icm_request_type, _time
#         | rename _time as bucket_ts | eval metric="icm"]
#   | eval _key = substr(sha1(metric.":".coalesce(sap_sid,"").":".coalesce(sap_instance,"")
#               .":".coalesce(wp_function,"").":".coalesce(wp_category_name,"")
#               .":".coalesce(dp_severity,"").":".coalesce(icm_program,"")
#               .":".coalesce(icm_request_type,"")), 1, 20) . ":" . bucket_ts
#   | fields _key, bucket_ts, metric, sap_sid, sap_instance, wp_function,
#            wp_category_name, dp_severity, icm_program, icm_request_type,
#            count, sum_tasks, max_tasks, max_mem
#   | outputlookup append=true logserv_wp_perf_rollup
# ===========================================================================

[logserv_wp_perf_aggregate]
search = | union [search `sap_logserv_idx_macro` sourcetype="sap:abap:workprocess" | bin _time span=1h | fillnull value="(none)" sap_sid sap_instance wp_function wp_category_name | stats count by sap_sid, sap_instance, wp_function, wp_category_name, _time | rename _time as bucket_ts | eval metric="wp"] [search `sap_logserv_idx_macro` sourcetype="sap:abap:dispatcher" | bin _time span=1h | fillnull value="(none)" sap_sid dp_severity | stats count by dp_severity, sap_sid, _time | rename _time as bucket_ts | eval metric="dp"] [search `sap_logserv_idx_macro` sourcetype="sap:abap:icm" icm_tasks=* | bin _time span=1h | fillnull value="(none)" icm_program icm_request_type | stats count, sum(icm_tasks) as sum_tasks, max(icm_tasks) as max_tasks, max(icm_memory) as max_mem by icm_program, icm_request_type, _time | rename _time as bucket_ts | eval metric="icm"] [search `sap_logserv_idx_macro` (sourcetype="sap:abap:dispatcher" OR sourcetype="sap:abap:enqueueserver" OR sourcetype="sap:abap:event" OR sourcetype="sap:abap:messageserver" OR sourcetype="sap:abap:sapstartsrv" OR sourcetype="sap:abap:workprocess") | bin _time span=1h | fillnull value="(none)" sap_sid | stats count by sourcetype, sap_sid, _time | rename _time as bucket_ts | eval metric="abap"] [search `sap_logserv_idx_macro` sourcetype="sap:abap:workprocess" wp_function=* | bin _time span=1h | fillnull value="(none)" wp_sub_function | stats count by wp_function, wp_sub_function, _time | rename _time as bucket_ts | eval metric="abap_wpfn"] [search `sap_logserv_idx_macro` sourcetype="sap:abap:event" uptime_days=* | bin _time span=1h AS bucket_ts | stats latest(uptime_days) as uptime_days, latest(uptime_hours) as uptime_hours by sap_sid, sap_instance, bucket_ts | eval metric="uptime"] | eval _key = case(metric="abap", substr(sha1("abap:" . coalesce(sourcetype,"") . ":" . coalesce(sap_sid,"")), 1, 20), metric="abap_wpfn", substr(sha1("abap_wpfn:" . coalesce(wp_function,"") . ":" . coalesce(wp_sub_function,"")), 1, 20), metric="uptime", substr(sha1("uptime:" . coalesce(sap_sid,"") . ":" . coalesce(sap_instance,"")), 1, 20), 1==1, substr(sha1(metric . ":" . coalesce(sap_sid,"") . ":" . coalesce(sap_instance,"") . ":" . coalesce(wp_function,"") . ":" . coalesce(wp_category_name,"") . ":" . coalesce(dp_severity,"") . ":" . coalesce(icm_program,"") . ":" . coalesce(icm_request_type,"")), 1, 20)) . ":" . bucket_ts | fields _key, bucket_ts, metric, sap_sid, sap_instance, wp_function, wp_category_name, dp_severity, icm_program, icm_request_type, sourcetype, wp_sub_function, count, sum_tasks, max_tasks, max_mem, uptime_days, uptime_hours | outputlookup append=true logserv_wp_perf_rollup
description = WP Perf Aggregation: per-hour rollup of sap:abap:workprocess/dispatcher/icm activity into logserv_wp_perf_rollup KV Store. Powers the Work Process Performance dashboard (KPIs, category/severity trends, by-SID table, ICM async-queue panels). Hourly cadence; admin can disable from Settings.
