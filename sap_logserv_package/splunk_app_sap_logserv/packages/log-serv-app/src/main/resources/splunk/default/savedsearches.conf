# ===========================================================================
# ABAP Network & Security dashboard rollup (session 052 / build 217, icmerr
# predicate fixed build 218). 7 metrics across 3 sourcetypes
# (sap:abap:audit/gateway/icm). Design adversarially reviewed pre-build (caught
# the vol-null-fill customer-data undercount + the icm_is_error string-vs-number
# latent bug).
#   vol      (sourcetype, sap_sid, sap_instance)+count, ST_ALL; sid+instance
#            fillnull'd (kpiTotal/sparkTotal/volumeByType sum over ALL rows --
#            raw doesn't group by sid; only sidInstance excludes "(none)").
#   icmstat  (status_cat)+count, icm icm_status_code present; 2xx/3xx/4xx/5xx
#            case() done in-aggregate.
#   icmreq   (icm_request_type raw)+count, icm request_type present; decode @read.
#   icmpeer  (icm_peer_ip, icm_transaction_id, icm_protocol)+count, icm peer
#            present; fillnull txn+protocol (35 combos).
#   icmerr   per-bucket count, icm `icm_is_error="true"` (build 218 fix of the
#            original `=1` string-vs-number bug -- props.conf EVAL emits
#            icm_is_error as "true" iff icm_status_code is 4xx/5xx). 0 on the
#            current data (no 4xx/5xx ICM events); counts real ICM errors on
#            customer data. task_7e242b2b.
#   gwhost   (gw_remote_host, gw_function, gw_service)+count, ALL gateway;
#            fillnull all 3 (Gateway Hosts Events + values(gw_service)).
#   gwlatest (gw_remote_host, gw_function)+count+latest(gw_error_detail), gateway
#            error events; bin _time AS bucket_ts (latest-in-bucket); fillnull
#            rhost+func. Serves Gateway Errors KPI/timeline (sum count over ALL)
#            + the Gateway Hosts "Last Error" column (latest, left-joined).
# No RAW panels. Fresh collection -> uniform sha1[:24] _key.
# ===========================================================================

[logserv_abapnet_aggregate]
search = | union [search `sap_logserv_idx_macro` sourcetype IN ("sap:abap:audit","sap:abap:gateway","sap:abap:icm") | fillnull value="(none)" sap_sid sap_instance | bin _time span=1h | stats count by sourcetype, sap_sid, sap_instance, _time | rename _time as bucket_ts | eval metric="vol"] [search `sap_logserv_idx_macro` sourcetype="sap:abap:icm" icm_status_code=* | eval status_cat=case(icm_status_code>=200 AND icm_status_code<300, "2xx", icm_status_code>=300 AND icm_status_code<400, "3xx", icm_status_code>=400 AND icm_status_code<500, "4xx", icm_status_code>=500, "5xx", 1=1, "Other") | bin _time span=1h | stats count by status_cat, _time | rename _time as bucket_ts | eval metric="icmstat"] [search `sap_logserv_idx_macro` sourcetype="sap:abap:icm" icm_request_type=* | bin _time span=1h | stats count by icm_request_type, _time | rename _time as bucket_ts | eval metric="icmreq"] [search `sap_logserv_idx_macro` sourcetype="sap:abap:icm" icm_peer_ip=* | fillnull value="(none)" icm_transaction_id icm_protocol | bin _time span=1h | stats count by icm_peer_ip, icm_transaction_id, icm_protocol, _time | rename _time as bucket_ts | eval metric="icmpeer"] [search `sap_logserv_idx_macro` sourcetype="sap:abap:icm" icm_is_error="true" | bin _time span=1h | stats count by _time | rename _time as bucket_ts | eval metric="icmerr"] [search `sap_logserv_idx_macro` sourcetype="sap:abap:gateway" | fillnull value="(none)" gw_remote_host gw_function gw_service | bin _time span=1h | stats count by gw_remote_host, gw_function, gw_service, _time | rename _time as bucket_ts | eval metric="gwhost"] [search `sap_logserv_idx_macro` sourcetype="sap:abap:gateway" gw_error_detail=* gw_error_detail!="" | fillnull value="(none)" gw_remote_host gw_function | bin _time span=1h AS bucket_ts | stats count, latest(gw_error_detail) AS gw_error_detail by gw_remote_host, gw_function, bucket_ts | eval metric="gwlatest"] | eval _key = substr(sha1(metric . ":" . coalesce(sourcetype,"") . ":" . coalesce(sap_sid,"") . ":" . coalesce(sap_instance,"") . ":" . coalesce(status_cat,"") . ":" . coalesce(icm_request_type,"") . ":" . coalesce(icm_peer_ip,"") . ":" . coalesce(icm_transaction_id,"") . ":" . coalesce(icm_protocol,"") . ":" . coalesce(gw_remote_host,"") . ":" . coalesce(gw_function,"") . ":" . coalesce(gw_service,"")), 1, 24) . ":" . bucket_ts | fields _key, bucket_ts, metric, sourcetype, sap_sid, sap_instance, status_cat, icm_request_type, icm_peer_ip, icm_transaction_id, icm_protocol, gw_remote_host, gw_function, gw_service, gw_error_detail, count | outputlookup append=true logserv_abapnet_rollup
