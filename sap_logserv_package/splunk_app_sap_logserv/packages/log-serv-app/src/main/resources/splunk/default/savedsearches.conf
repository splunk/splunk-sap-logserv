# ===========================================================================
# ===========================================================================
# Cloud Connector dashboard rollup (build 232 — ditches the CIM Web/Authentication
# tier for the KV-Store rollup; CIM fell back to a RAW full-scan when the customer
# hadn't accelerated the models). 5 metrics over sap:scc:http_access + sap:scc:audit:
#   http   per-bucket: count + err_count(tonumber(status)>=400) + sum_rt(NATIVE) +
#          cnt_rt -- HTTP Error Rate + spark + Avg Response Time chart.
#   status (status) count -- Status Code Distribution (status_cat decoded at READ).
#   method (method) count -- HTTP Methods pie (read excludes "(none)" = CIM !=unknown).
#   client (clientip,uri) count + sum_rt + cnt_rt + bytes_sum -- Top Clients
#          (by clientip: dc(uri)+bytes) AND Top URIs (by uri: avg+bytes).
#   audit  (scc_audit_type) count -- Access Denied KPI+spark (=="ACCESS_DENIED").
# Total Requests / Audit Events / Request Volume stay tstats-now; auditLog stays RAW.
# ===========================================================================
[logserv_cloudconn_aggregate]
search = | union [search `sap_logserv_idx_macro` sourcetype="sap:scc:http_access" | bin _time span=1h | stats count, sum(eval(if(tonumber(status)>=400,1,0))) as err_count, sum(response_time_ms) as sum_rt, count(response_time_ms) as cnt_rt by _time | rename _time as bucket_ts | eval metric="http"] [search `sap_logserv_idx_macro` sourcetype="sap:scc:http_access" | fillnull value="(none)" status | bin _time span=1h | stats count by status, _time | rename _time as bucket_ts | eval metric="status"] [search `sap_logserv_idx_macro` sourcetype="sap:scc:http_access" | fillnull value="(none)" method | bin _time span=1h | stats count by method, _time | rename _time as bucket_ts | eval metric="method"] [search `sap_logserv_idx_macro` sourcetype="sap:scc:http_access" | fillnull value="(none)" clientip uri | bin _time span=1h | stats count, sum(response_time_ms) as sum_rt, count(response_time_ms) as cnt_rt, sum(bytes) as bytes_sum by clientip, uri, _time | rename _time as bucket_ts | eval metric="client"] [search `sap_logserv_idx_macro` sourcetype="sap:scc:audit" | fillnull value="(none)" scc_audit_type | bin _time span=1h | stats count by scc_audit_type, _time | rename _time as bucket_ts | eval metric="audit"] | eval _key = case(metric="http", "http:" . bucket_ts, metric="status", substr(sha1("status:" . coalesce(status,"")), 1, 24) . ":" . bucket_ts, metric="method", substr(sha1("method:" . coalesce(method,"")), 1, 24) . ":" . bucket_ts, metric="client", substr(sha1("client:" . coalesce(clientip,"") . ":" . coalesce(uri,"")), 1, 24) . ":" . bucket_ts, metric="audit", substr(sha1("audit:" . coalesce(scc_audit_type,"")), 1, 24) . ":" . bucket_ts, 1==1, "x:" . bucket_ts) | fields _key, bucket_ts, metric, status, method, clientip, uri, scc_audit_type, count, err_count, sum_rt, cnt_rt, bytes_sum | outputlookup append=true logserv_cloudconn_rollup
description = Cloud Connector Aggregation: per-hour rollup of sap:scc:http_access + sap:scc:audit into logserv_cloudconn_rollup KV Store (5 metrics: http/status/method/client/audit). Replaces the CIM Web + Authentication model reads (build 232). Hourly cadence.
cron_schedule = 23 * * * *
dispatch.earliest_time = -1h@h
dispatch.latest_time = @h
