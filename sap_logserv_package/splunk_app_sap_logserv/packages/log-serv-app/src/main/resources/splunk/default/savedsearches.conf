ction_type,"") . ":" . coalesce(action_category,"") . ":" . coalesce(status,"") . ":" . coalesce(risk_level,"") . ":" . coalesce(client_ip,"") . ":" . coalesce(host,"") . ":" . coalesce(admin_action,"") . ":" . coalesce(event_type,"") . ":" . coalesce(password_action,"") . ":" . coalesce(target_user,"")), 1, 24) . ":" . bucket_ts | fields _key, bucket_ts, metric, executing_user, action_type, action_category, status, risk_level, client_ip, host, admin_action, event_type, password_action, target_user, count, last_seen | outputlookup append=true logserv_hana_category_rollup
