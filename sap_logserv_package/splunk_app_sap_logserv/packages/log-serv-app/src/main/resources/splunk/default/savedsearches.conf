# --- Aggregate-INVENTORY: hourly IP/host -> SID mapping ---------------------
#
# Mirrors the legacy on-demand SEARCH_INVENTORY (session 023 build 113 +
# build 122 / A.3): unambiguous (mvcount(sids)=1) mapping from peer
# endpoints (IPs or hostnames) to the SAP SID that owns them. Sourced from
# 4 self-attribution patterns:
#
#   1. gateway local_ip -> sap_sid: gateway daemon listening on this IP
#      tagged sap_sid=X means IP belongs to X.
#   2. ICM icm_local_ip -> sap_sid: ICM process listening IP, same pattern.
#   3. HANA tracelogs hana_host -> sap_sid: HANA tracelog hostname segment
#      paired with HANA SID via existing EXTRACT-sap_sid.
#   4. Splunk default `host` -> sap_sid: any SAP-sourcetype event tagged
#      with both host and sap_sid, when single-SID per host.
#
# Schedule: 5 minutes past every hour, dispatch.earliest_time=-1h@h, with
# outputlookup append=true (upsert by _key=canonical_value). No retention
# sweep in v1 — inventory grows monotonically as new IPs surface; stale
# entries don't render unless an active edge references them.
#
# Multi-line draft of the SPL (flattened in the search= line below):
#
#   | union
#       [search `sap_logserv_idx_macro` sourcetype=sap:abap:gateway local_ip=* sap_sid=*
#         | stats values(sap_sid) as sids by local_ip
#         | where mvcount(sids)=1
#         | eval canonical_value=local_ip, canonical_kind="ip", resolved_sid=mvindex(sids,0)
#         | fields canonical_value, canonical_kind, resolved_sid]
#       [search `sap_logserv_idx_macro` sourcetype=sap:abap:icm icm_local_ip=* sap_sid=*
#         | stats values(sap_sid) as sids by icm_local_ip
#         | where mvcount(sids)=1
#         | eval canonical_value=icm_local_ip, canonical_kind="ip", resolved_sid=mvindex(sids,0)
#         | fields canonical_value, canonical_kind, resolved_sid]
#       [search `sap_logserv_idx_macro` sourcetype=sap:hana:tracelogs hana_host=* sap_sid=*
#         | stats values(sap_sid) as sids by hana_host
#         | where mvcount(sids)=1
#         | eval canonical_value=hana_host, canonical_kind="host", resolved_sid=mvindex(sids,0)
#         | fields canonical_value, canonical_kind, resolved_sid]
#       [search `sap_logserv_idx_macro` sap_sid=* host=*
#         | stats values(sap_sid) as sids by host
#         | where mvcount(sids)=1
#         | eval canonical_value=host, canonical_kind="host", resolved_sid=mvindex(sids,0)
#         | fields canonical_value, canonical_kind, resolved_sid]
#   | stats values(resolved_sid) as resolved_sids by canonical_value, canonical_kind
#   | where mvcount(resolved_sids)=1
#   | eval resolved_sid = mvindex(resolved_sids, 0)
#   | eval _key = canonical_value
#   | eval updated_at = now()
#   | fields _key, canonical_value, canonical_kind, resolved_sid, updated_at
#   | outputlookup append=true logserv_topology_inventory

[logserv_topology_aggregate_inventory]
search = | union [search `sap_logserv_idx_macro` sourcetype=sap:abap:gateway local_ip=* sap_sid=* | stats values(sap_sid) as sids by local_ip | where mvcount(sids)=1 | eval canonical_value=local_ip, canonical_kind="ip", resolved_sid=mvindex(sids,0) | fields canonical_value, canonical_kind, resolved_sid] [search `sap_logserv_idx_macro` sourcetype=sap:abap:icm icm_local_ip=* sap_sid=* | stats values(sap_sid) as sids by icm_local_ip | where mvcount(sids)=1 | eval canonical_value=icm_local_ip, canonical_kind="ip", resolved_sid=mvindex(sids,0) | fields canonical_value, canonical_kind, resolved_sid] [search `sap_logserv_idx_macro` sourcetype=sap:hana:tracelogs hana_host=* sap_sid=* | stats values(sap_sid) as sids by hana_host | where mvcount(sids)=1 | eval canonical_value=hana_host, canonical_kind="host", resolved_sid=mvindex(sids,0) | fields canonical_value, canonical_kind, resolved_sid] [search `sap_logserv_idx_macro` sap_sid=* host=* | stats values(sap_sid) as sids by host | where mvcount(sids)=1 | eval canonical_value=host, canonical_kind="host", resolved_sid=mvindex(sids,0) | fields canonical_value, canonical_kind, resolved_sid] | stats values(resolved_sid) as resolved_sids by canonical_value, canonical_kind | where mvcount(resolved_sids)=1 | eval resolved_sid = mvindex(resolved_sids, 0) | eval _key = canonical_value | eval updated_at = now() | fields _key, canonical_value, canonical_kind, resolved_sid, updated_at | outputlookup append=true logserv_topology_inventory
description = Topology Inventory: hourly IP/host -> SID mapping rollup into logserv_topology_inventory KV Store. Powers the topology view's edge-rendering retargeting (raw peer IP gets resolved to its owning SID node). Hourly cadence in lockstep with logserv_topology_aggregate_*.
cron_schedule = 7 * * * *
dispatch.earliest_time = -1h@h
dispatch.latest_time = @h
enableSched = 1
is_scheduled = 1
is_visible = false
disabled = false
