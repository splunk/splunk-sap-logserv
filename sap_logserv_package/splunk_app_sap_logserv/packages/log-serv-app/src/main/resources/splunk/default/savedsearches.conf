# =============================================================================
# Extended ES Content Pack v2 (session 038 / build 232)
# =============================================================================
# Three categories of additional ES content layered on top of the v0.1.1 starter
# pack:
#   - B-1: 6 cross-stack correlation searches (lateral movement, privilege chain,
#     after-hours admin data access, service-account interactive login, HANA
#     user-creation off-hours, HANA mass DROP/DELETE).
#   - C: 3 threat-intel correlation searches that join against customer-managed
#     CSV lookups (malicious domains, malicious IPs, compromised credentials).
#     The lookups ship empty under default/lookups/; customer populates from
#     their own TI feed. See docs/content/enterprise-security/threat-intel.md.
#   - D: 4 stats-based behavioral anomaly searches (per-user auth volume,
#     per-host webdispatcher response time, per-edge topology call volume,
#     per-admin after-hours activity). Use streamstats/eventstats Z-score
#     calculations; no MLTK dependency. Customers with MLTK installed can swap
#     in fit/apply for sharper baselines.
#
# Every search in this section emits action.notable=1 + action.risk so it
# integrates with ES Notable Review + RBA. Without ES installed, action.notable
# silently no-ops and the searches still run successfully (returning rows that
# customers can search via the Splunk_audit index or the AI Assistant).
# =============================================================================

