# ===========================================================================
# Change & Configuration Activity dashboard rollup (session 051 / build 212).
# 4 metric sub-types via a union. The compliance dashboard's count panels
# raw-scan a 3-source change synthesis (HANA / Windows / Linux) + a per-event
# ENRICH classification; precompute that once/hour here.
#   main      (change_source, category, operator, is_after_hours) + count
#             -> Total/After-Hours/Operators KPIs+sparks, Activity chart,
#                Category pie, Operators table. operator is nullable
#                (HANA "HANA:"+null executing_user) -> fillnull "(none)";
#                reads exclude "(none)" to match raw stats-by-operator / dc.
#   userchg / permgrant / password (per-bucket count) -> the 3 subset KPIs +
#             sparks. Each replicates the panel's EXACT filter (NOT derivable
#             from main's category dim -- e.g. permGrants counts Windows
#             group-add EventCodes that main classifies "Group Membership").
#             userchg/password apply their Linux match(_raw,...) regex in a
#             post-base | where (session-051 follow-up): match() in BASE-search
#             position silently returns 0, which under-counted the Linux clause
#             (kpiPassword read 0 vs the Category pie's 21 linux:sudolog passwd
#             events). The | where form is byte-identical to the Category pie's
#             regex classification on any data; it scans all linux events in the
#             background hourly job (acceptable -- not an interactive query).
# The 5 per-event audit-trail tables (HANA/Windows/Linux/Privileged/After-Hours)
# stay RAW. Fresh collection -> uniform sha1[:24] _key.
#
# Multi-line draft of the main arm (flattened in search= below):
#   [search `sap_logserv_idx_macro` <CHANGE_FILTER>
#     | eval change_source=case(...) | rex sudo_op | rex paren_op
#     | eval operator=case(...) | eval category=case(...)
#     | eval hr=... | eval dw=... | eval is_after_hours=case(...)
#     | fillnull value="(none)" operator
#     | bin _time span=1h | stats count by change_source, category, operator,
#                                            is_after_hours, _time
#     | rename _time as bucket_ts | eval metric="main"]
# ===========================================================================

[logserv_compliance_aggregate]
