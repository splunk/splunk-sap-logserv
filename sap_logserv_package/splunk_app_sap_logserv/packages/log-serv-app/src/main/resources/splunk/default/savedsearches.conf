# ===========================================================================
# Proxy Analytics dashboard rollup (build 232 — ditches the CIM Web tier). 6
# metrics over squid:access:
#   core   per-bucket: count + denied_count(action="denied") + bytes_sum(bytes_out)
#          -- Total Bandwidth + Denied KPIs+sparks + Bandwidth Timeline.
#   status (status) count -- Status Code Distribution (status_cat decoded at read).
#   domain (url_domain,src) count + bytes_sum -- Top Domains/Clients/Diversity/
#          Bytes + Bandwidth-by-domain (all derived by grouping by url_domain or src).
#   cacheaction (vendor_action) count -- Cache Action Distribution.
#   dur    per-bucket over source="*access.log*" duration=*: sum_dur+cnt_dur+max_dur
#          -- Response Time chart (was RAW p50/p95/max -> now Avg+Max).
#   destdur (dest) over the same scope: +count -- Slowest Destinations (was perc95
#          -> now Max/Avg). Total Requests / Request Volume stay tstats-now.
# ===========================================================================
[logserv_proxy_aggregate]
search = | union [search `sap_logserv_idx_macro` sourcetype="squid:access" | bin _time span=1h | stats count, sum(eval(if(action="denied",1,0))) as denied_count, sum(bytes_out) as bytes_sum by _time | rename _time as bucket_ts | eval metric="core"] [search `sap_logserv_idx_macro` sourcetype="squid:access" | fillnull value="(none)" status | bin _time span=1h | stats count by status, _time | rename _time as bucket_ts | eval metric="status"] [search `sap_logserv_idx_macro` sourcetype="squid:access" | fillnull value="(none)" url_domain src | bin _time span=1h | stats count, sum(bytes_out) as bytes_sum by url_domain, src, _time | rename _time as bucket_ts | eval metric="domain"] [search `sap_logserv_idx_macro` sourcetype="squid:access" | fillnull value="(none)" vendor_action | bin _time span=1h | stats count by vendor_action, _time | rename _time as bucket_ts | eval metric="cacheaction"] [search `sap_logserv_idx_macro` sourcetype="squid:access" source="*access.log*" duration=* | bin _time span=1h | stats sum(duration) as sum_dur, count(duration) as cnt_dur, max(duration) as max_dur by _time | rename _time as bucket_ts | eval metric="dur"] [search `sap_logserv_idx_macro` sourcetype="squid:access" source="*access.log*" duration=* | fillnull value="(none)" dest | bin _time span=1h | stats sum(duration) as sum_dur, count(duration) as cnt_dur, max(duration) as max_dur, count as count by dest, _time | rename _time as bucket_ts | eval metric="destdur"] | eval _key = case(metric="core", "core:" . bucket_ts, metric="status", substr(sha1("status:" . coalesce(status,"")), 1, 24) . ":" . bucket_ts, metric="domain", substr(sha1("domain:" . coalesce(url_domain,"") . ":" . coalesce(src,"")), 1, 24) . ":" . bucket_ts, metric="cacheaction", substr(sha1("cacheaction:" . coalesce(vendor_action,"")), 1, 24) . ":" . bucket_ts, metric="dur", "dur:" . bucket_ts, metric="destdur", substr(sha1("destdur:" . coalesce(dest,"")), 1, 24) . ":" . bucket_ts, 1==1, "x:" . bucket_ts) | fields _key, bucket_ts, metric, status, url_domain, src, vendor_action, dest, count, denied_count, bytes_sum, sum_dur, cnt_dur, max_dur | outputlookup append=true logserv_proxy_rollup
description = Proxy Analytics Aggregation: per-hour rollup of squid:access into logserv_proxy_rollup KV Store (6 metrics: core/status/domain/cacheaction/dur/destdur). Replaces the CIM Web model reads (build 232). Hourly cadence.
