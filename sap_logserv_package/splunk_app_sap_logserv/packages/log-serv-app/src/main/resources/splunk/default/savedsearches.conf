 memory: Killed process" | fillnull value="(none)" oom_proc host | bin _time span=1h | stats count, max(oom_rss_kb) as max_rss, max(oom_vm_kb) as max_vm by host, oom_proc, _time | rename _time as bucket_ts | eval metric="oom"] [search `sap_logserv_idx_macro` (sourcetype="linux:warn" OR sourcetype="syslog") "soft lockup" | fillnull value="(none)" lockup_cpu host | bin _time span=1h | stats count, max(lockup_duration_s) as max_dur, sum(lockup_duration_s) as sum_dur by host, lockup_cpu, _time | rename _time as bucket_ts | eval metric="lockup"] [search `sap_logserv_idx_macro` (sourcetype="linux:warn" OR sourcetype="syslog") "TCP: out of memory" | fillnull value="(none)" host | bin _time span=1h | stats count by host, _time | rename _time as bucket_ts | eval metric="tcpoom"] | eval _key = substr(sha1(metric . ":" . coalesce(host,"") . ":" . coalesce(sourcetype,"") . ":" . coalesce(fw_action,"") . ":" . coalesce(fw_src,"") . ":" . coalesce(fw_dst,"") . ":" . coalesce(fw_dpt,"") . ":" . coalesce(fw_proto,"") . ":" . coalesce(kernel_event,"") . ":" . coalesce(sap_app,"") . ":" . coalesce(sap_sid,"") . ":" . coalesce(sap_inst,"") . ":" . coalesce(sap_cid,"") . ":" . coalesce(oom_proc,"") . ":" . coalesce(lockup_cpu,"")), 1, 24) . ":" . bucket_ts | fields _key, bucket_ts, metric, host, sourcetype, fw_action, fw_src, fw_dst, fw_dpt, fw_proto, kernel_event, sap_app, sap_sid, sap_inst, sap_cid, oom_proc, lockup_cpu, count, max_rss, max_vm, max_dur, sum_dur | outputlookup append=true logserv_linux_rollup
description = Linux Backfill: one-time 30-day fill of logserv_linux_rollup. Disabled by default; admin dispatches manually after first install. Idempotent (upsert by composite _key).
dispatch.earliest_time = -30d@d
dispatch.latest_time = @h
enableSched = 0
is_scheduled = 0
is_visible = false
disabled = false
request.ui_dispatch_app = splunk_app_sap_logserv

# Daily retention — trims logserv_linux_rollup to the last 365 days. 01:15 UTC.
[logserv_linux_retention]
search = | inputlookup logserv_linux_rollup | where bucket_ts >= relative_time(now(), "-365d") | outputlookup logserv_linux_rollup | stats count
description = Linux Retention: daily cleanup that trims logserv_linux_rollup to the last 365 days. Runs at 01:15 UTC.
cron_schedule = 52 0 * * *
dispatch.earliest_time = -1d
dispatch.latest_time = now
enableSched = 1
is_scheduled = 1
is_visible = false
disabled = false
request.ui_dispatch_app = splunk_app_sap_logserv
# ===========================================================================
# Web & API Performance dashboard rollup (session 052 / build 222; extended
# build 232). 7 metric sub-types via a | union + 1 RAW panel (err500 = listing).
# Design adversarially reviewed pre-build.
#   core   per-bucket over ST_BOTH (webdispatcher + scc:http_access): count +
#          err_count (tonumber(status)>=400) + sum_rt (NATIVE float) + cnt_rt
#          (count(response_time_ms)) + max_rt (build 232) + authfail_count +
#          cc_count + cc_authfail_count -- KPIs + sparks + errorAuth (2 rates) +
#          Response Time Percentiles chart (now Avg=Σsum_rt/Σcnt_rt + Max=max_rt).
#   url    (uri)+count over ST_BOTH uri=* -- kpiUniqueUrls/sparkUniqueUrls.
#   timing per-bucket over ST_WD dt1-4 present: sum_dt1..4 (dt_us/1000) + cnt_dt
#          -- 4-stage timing chart (UNROUNDED avg per stage).
#   tls    (tls_version)+count over ST_WD tls_version=* -- tlsVersion.
#   cipher (cipher_suite)+count over ST_WD cipher_suite=* -- tlsCipher.
#   client (clientip,uri)+count+sum_rt+cnt_rt+max_rt over ST_BOTH response_time_ms=*
#          clientip=* (build 232) -- Slow Clients table (events/avg/Max/dc(uri)).
#   slowuri (uri,src_log)+count+sum_rt+cnt_rt+max_rt+err_count over ST_BOTH
#          response_time_ms=* uri=* (build 232) -- Slow URIs table (events/avg/Max/
#          errors). src_log = WebDisp|CC decoded at aggregate.
# Build 232 percentile refactor: percentiles/slowUris/slowClients (perc95) were
# RAW (option c). p50/p95/p99 do NOT merge across buckets, so they are DROPPED
# and replaced by avg(=Σsum_rt/Σcnt_rt) + max(=max-of-per-bucket-max_rt), both
# byte-exact. err_count uses tonumber() (range test); authfail uses bare string
# status= (equality) -- NOT unified, matches raw. _key uses a case() so client/
# slowuri get their own collision-free formula while core/url/timing/tls/cipher
# keys stay BYTE-IDENTICAL (a re-backfill upserts existing rows in place).
# ===========================================================================

[logserv_web_timing_aggregate]
search = | union [search `sap_logserv_idx_macro` (sourcetype="sap:webdispatcher:access" OR sourcetype="sap:scc:http_access") | bin _time span=1h | stats count, sum(eval(if(tonumber(status)>=400,1,0))) as err_count, sum(response_time_ms) as sum_rt, count(response_time_ms) as cnt_rt, max(response_time_ms) as max_rt, sum(eval(if((sourcetype="sap:webdispatcher:access" AND (status=401 OR status=403)) OR (sourcetype="sap:scc:http_access" AND (status=401 OR status=403 OR is_authenticated="false")),1,0))) as authfail_count, sum(eval(if(sourcetype="sap:scc:http_access",1,0))) as cc_count, sum(eval(if(sourcetype="sap:scc:http_access" AND (status=401 OR status=403 OR is_authenticated="false"),1,0))) as cc_authfail_count by _time | rename _time as bucket_ts | eval metric="core"] [search `sap_logserv_idx_macro` (sourcetype="sap:webdispatcher:access" OR sourcetype="sap:scc:http_access") uri=* | bin _time span=1h | stats count by uri, _time | rename _time as bucket_ts | eval metric="url"] [search `sap_logserv_idx_macro` sourcetype="sap:webdispatcher:access" dt1_us=* dt2_us=* dt3_us=* dt4_us=* | eval dt1_ms=dt1_us/1000, dt2_ms=dt2_us/1000, dt3_ms=dt3_us/1000, dt4_ms=dt4_us/1000 | bin _time span=1h | stats sum(dt1_ms) as sum_dt1, sum(dt2_ms) as sum_dt2, sum(dt3_ms) as sum_dt3, sum(dt4_ms) as sum_dt4, count as cnt_dt by _time | rename _time as bucket_ts | eval metric="timing"] [search `sap_logserv_idx_macro` sourcetype="sap:webdispatcher:access" tls_version=* | bin _time span=1h | stats count by tls_version, _time | rename _time as bucket_ts | eval metric="tls"] [search `sap_logserv_idx_macro` sourcetype="sap:webdispatcher:access" cipher_suite=* | bin _time span=1h | stats count by cipher_suite, _time | rename _time as bucket_ts | eval metric="cipher"] [search `sap_logserv_idx_macro` (sourcetype="sap:webdispatcher:access" OR sourcetype="sap:scc:http_access") response_time_ms=* clientip=* | fillnull value="(none)" uri | bin _time span=1h | stats count, sum(response_time_ms) as sum_rt, count(response_time_ms) as cnt_rt, max(response_time_ms) as max_rt by clientip, uri, _time | rename _time as bucket_ts | eval metric="client"] [search `sap_logserv_idx_macro` (sourcetype="sap:webdispatcher:access" OR sourcetype="sap:scc:http_access") response_time_ms=* uri=* | eval src_log=if(sourcetype="sap:webdispatcher:access","WebDisp","CC") | bin _time span=1h | stats count, sum(response_time_ms) as sum_rt, count(response_time_ms) as cnt_rt, max(response_time_ms) as max_rt, sum(eval(if(tonumber(status)>=400,1,0))) as err_count by uri, src_log, _time | rename _time as bucket_ts | eval metric="slowuri"] [search `sap_logserv_idx_macro` sourcetype="sap:webdispatcher:access" | eval response_time_ms=tonumber(total_us)/1000 | bin _time span=1h | stats count, sum(eval(if(tonumber(status)>=400,1,0))) as err_count, sum(response_time_ms) as sum_rt, count(response_time_ms) as cnt_rt, max(response_time_ms) as max_rt by _time | rename _time as bucket_ts | eval metric="wd_core"] [search `sap_logserv_idx_macro` sourcetype="sap:webdispatcher:access" | eval status_group=case(tonumber(status)<300,"Success (2xx)",tonumber(status)<400,"Redirect (3xx)",tonumber(status)<500,"Client Error (4xx)",tonumber(status)>=500,"Server Error (5xx)",1==1,"Other") | bin _time span=1h | stats count by status_group, _time | rename _time as bucket_ts | eval metric="wd_status"] [search `sap_logserv_idx_macro` sourcetype="sap:webdispatcher:access" | fillnull value="(none)" method | bin _time span=1h | stats count by method, _time | rename _time as bucket_ts | eval metric="wd_method"] [search `sap_logserv_idx_macro` sourcetype="sap:webdispatcher:access" | eval response_time_ms=tonumber(total_us)/1000, status_group=case(tonumber(status)>=200 AND tonumber(status)<300,"2xx",tonumber(status)>=300 AND tonumber(status)<400,"3xx",tonumber(status)>=400 AND tonumber(status)<500,"4xx",tonumber(status)>=500 AND tonumber(status)<600,"5xx",1==1,"other") | fillnull value="(none)" uri | bin _time span=1h | stats count, sum(response_time_ms) as sum_rt, count(response_time_ms) as cnt_rt by uri, status_group, _time | rename _time as bucket_ts | eval metric="wd_uristat"] [search `sap_logserv_idx_macro` sourcetype="sap:webdispatcher:access" | eval response_time_ms=tonumber(total_us)/1000 | fillnull value="(none)" uri clientip | bin _time span=1h | stats count, sum(response_time_ms) as sum_rt, count(response_time_ms) as cnt_rt by clientip, uri, _time | rename _time as bucket_ts | eval metric="wd_client"] | eval _key = case(metric="client", substr(sha1(metric . ":" . coalesce(clientip,"") . ":" . coalesce(uri,"")), 1, 24) . ":" . bucket_ts, metric="slowuri", substr(sha1(metric . ":" . coalesce(uri,"") . ":" . coalesce(src_log,"")), 1, 24) . ":" . bucket_ts, metric="wd_core", "wd_core:" . bucket_ts, metric="wd_status", substr(sha1("wd_status:" . coalesce(status_group,"")), 1, 24) . ":" . bucket_ts, metric="wd_method", substr(sha1("wd_method:" . coalesce(method,"")), 1, 24) . ":" . bucket_ts, metric="wd_uristat", substr(sha1("wd_uristat:" . coalesce(uri,"") . ":" . coalesce(status_group,"")), 1, 24) . ":" . bucket_ts, metric="wd_client", substr(sha1("wd_client:" . coalesce(clientip,"") . ":" . coalesce(uri,"")), 1, 24) . ":" . bucket_ts, 1==1, substr(sha1(metric . ":" . coalesce(uri,"") . ":" . coalesce(tls_version,"") . ":" . coalesce(cipher_suite,"")), 1, 24) . ":" . bucket_ts) | fields _key, bucket_ts, metric, uri, src_log, clientip, status_group, method, tls_version, cipher_suite, count, err_count, sum_rt, cnt_rt, max_rt, authfail_count, cc_count, cc_authfail_count, sum_dt1, sum_dt2, sum_dt3, sum_dt4, cnt_dt | outputlookup append=true logserv_web_timing_rollup
description = Web & API Performance Aggregation: per-hour rollup of sap:webdispatcher:access + sap:scc:http_access into logserv_web_timing_rollup KV Store (7 metrics: core/url/timing/tls/cipher/client/slowuri). Powers the KPIs, sparks, four-stage timing chart, HTTP-error-vs-CC-auth-failure rates, TLS version/cipher distributions, Response Time (avg+max) chart, Slow Clients + Slow URIs tables. Build 232 folded the former RAW percentile panels into avg+max measures. Hourly cadence.
cron_schedule = 18 * * * *
dispatch.earliest_time = -1h@h
dispatch.latest_time = @h
enableSched = 1
is_scheduled = 1
is_visible = false
disabled = false
