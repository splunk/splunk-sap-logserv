# Asset & Identity feed for ES Identity Management framework (session 033 / B.5)
# =============================================================================
# Two scheduled saved searches that emit CSV lookups via outputlookup. Customer
# wires these into ES via Settings -> Identity Management -> Asset Configuration
# (or Identity Configuration) so the merger framework consumes them alongside
# any existing CMDB-sourced records.
#
# Per session 033 user directive Q3 = "Primary mode" (no CMDB assumed):
# populate full ES Asset records using SAP-stack heuristics derived from the
# same data sources the Environment Topology view uses — gateway L=, HANA
# tracelog hana_host, ICM peer/local pairs.
#
# Schedule: 4 hours (the inventory data doesn't change often; daily would also
# be acceptable but 4h gives faster pickup on environment growth).

[splunk_sap_logserv_es_asset_feed]
search = | union [search `sap_logserv_idx_macro` sourcetype="sap:abap:gateway" local_ip=* sap_sid=* | stats latest(host) AS dns by local_ip sap_sid | rename local_ip AS ip | eval system_role="application", role_label="SAP NetWeaver ABAP" | fields ip dns sap_sid system_role role_label] [search `sap_logserv_idx_macro` sourcetype="sap:hana:tracelogs" hana_host=* sap_sid=* | stats count by hana_host sap_sid | eval ip="", dns=hana_host, system_role="database", role_label="SAP HANA" | fields ip dns sap_sid system_role role_label] [search `sap_logserv_idx_macro` sourcetype="sap:abap:icm" icm_local_ip=* sap_sid=* | stats latest(host) AS dns by icm_local_ip sap_sid | rename icm_local_ip AS ip | eval system_role="application", role_label="SAP NetWeaver ABAP ICM" | fields ip dns sap_sid system_role role_label] [search `sap_logserv_idx_macro` sourcetype="sap:saprouter" | stats count by host | eval ip="", dns=host, sap_sid="", system_role="middleware", role_label="SAP Router" | fields ip dns sap_sid system_role role_label] [search `sap_logserv_idx_macro` sourcetype="sap:scc:audit" | stats count by host | eval ip="", dns=host, sap_sid="", system_role="middleware", role_label="SAP Cloud Connector" | fields ip dns sap_sid system_role role_label] [search `sap_logserv_idx_macro` sourcetype="sap:webdispatcher:access" | stats count by host | eval ip="", dns=host, sap_sid="", system_role="application", role_label="SAP Web Dispatcher" | fields ip dns sap_sid system_role role_label] | eval lookup_key = if(ip != "", ip, dns) | stats values(dns) AS dns_values, values(sap_sid) AS sap_sids, values(role_label) AS roles, values(system_role) AS system_roles, max(eval(case(system_role="database",3, system_role="middleware",2, 1=1,1))) AS role_priority by lookup_key | eval ip = if(match(lookup_key, "^\d+\.\d+\.\d+\.\d+$"), lookup_key, "") | eval dns = mvindex(dns_values, 0) | eval primary_role = case(role_priority=3, "database", role_priority=2, "middleware", 1=1, "application") | eval priority = case(primary_role="database", "high", primary_role="middleware", "high", 1=1, "medium") | eval category = case(primary_role="database", "Server | Database | SAP HANA", primary_role="middleware", "Server | Middleware | SAP", 1=1, "Server | Application | SAP NetWeaver") | eval bunit = "SAP", owner = "SAP-Operations" | eval is_expected = 1, should_timesync = 1, should_update = 1, requires_av = 0 | eval mac = "", lat = "", long = "", city = "", country = "", pci_domain = "", nt_host = "" | eval _sap_sids = mvjoin(sap_sids, ","), _roles = mvjoin(roles, ",") | table ip mac nt_host dns owner priority lat long city country bunit category pci_domain is_expected should_timesync should_update requires_av _sap_sids _roles | sort dns ip | outputlookup splunk_for_sap_logserv_assets.csv
