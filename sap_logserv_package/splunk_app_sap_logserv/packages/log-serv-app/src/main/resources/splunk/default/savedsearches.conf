# ===========================================================================
# Linux System & Security dashboard rollup (session 052 / build 221). 9 metric
# sub-types via a | union, 0 RAW. Design adversarially reviewed pre-build; the
# host-split (total vs hosts) was added post-de-risk after discovering 400
# linux_messages_syslog events carry a MULTIVALUE host -> a (sourcetype, host)
# grain expands count-by-sourcetype by +1 per extra host value (raw count-by-
# sourcetype counts each event once). Splitting count (by sourcetype) from
# dc(host) (by host) keeps both byte-exact.
#   total    (sourcetype)+count over ST_ALL (7 linux sourcetypes) -- kpiTotal/
#            sparkTotal/volumeByType/fwTimeline (NO host in grain; mv-host-safe).
#   hosts    (host)+count over ST_ALL -- kpiHosts/sparkHosts (dc(host); the count
#            is unused, only dc(host) is read, which is mv-host-correct).
#   fw       (fw_action,fw_src,fw_dst,fw_dpt,fw_proto,host)+count over linux_secure
#            (rex from _raw, fillnull all 6) -- same shape as the NP "fw" metric.
#   kernel   (kernel_event)+count over linux_secure (inline rex, where isnotnull).
#   sapapp   (sap_app,sap_sid)+count over linux_messages_syslog sap_app=*.
#   sapinst  (sap_sid,sap_inst,sap_cid,host)+count over linux_messages_syslog
#            sap_sid=* (fillnull inst/cid/host).
#   oom      (host,oom_proc)+count+max_rss+max_vm over (linux:warn OR syslog)
#            "Out of memory: Killed process" (NO oom_proc=* scope -- Kills counts
#            text-matched events even when oom_proc fails to extract).
#   lockup   (host,lockup_cpu)+count+max_dur+sum_dur over (linux:warn OR syslog)
#            "soft lockup" (avg=sum_dur/count at read; max-of-max).
#   tcpoom   (host)+count over (linux:warn OR syslog) "TCP: out of memory".
# Fresh collection -> uniform sha1[:24] _key.
# ===========================================================================

[logserv_linux_aggregate]
search = | union [search `sap_logserv_idx_macro` (sourcetype="linux_messages_syslog" OR sourcetype="linux:cron" OR sourcetype="linux:warn" OR sourcetype="linux:sudolog" OR sourcetype="linux:slapd" OR sourcetype="syslog" OR sourcetype="linux_secure") | bin _time span=1h | stats count by sourcetype, _time | rename _time as bucket_ts | eval metric="total"] [search `sap_logserv_idx_macro` (sourcetype="linux_messages_syslog" OR sourcetype="linux:cron" OR sourcetype="linux:warn" OR sourcetype="linux:sudolog" OR sourcetype="linux:slapd" OR sourcetype="syslog" OR sourcetype="linux_secure") | bin _time span=1h | stats count by host, _time | rename _time as bucket_ts | eval metric="hosts"] [search `sap_logserv_idx_macro` sourcetype="linux_secure" | rex field=_raw "(?<fw_action>IN_DROP|IN_ACCEPT)" | rex field=_raw "SRC=(?<fw_src>[^ ]+)" | rex field=_raw "DST=(?<fw_dst>[^ ]+)" | rex field=_raw "DPT=(?<fw_dpt>[^ ]+)" | rex field=_raw "PROTO=(?<fw_proto>[^ ]+)" | fillnull value="(none)" fw_action fw_src fw_dst fw_dpt fw_proto host | bin _time span=1h | stats count by fw_action, fw_src, fw_dst, fw_dpt, fw_proto, host, _time | rename _time as bucket_ts | eval metric="fw"] [search `sap_logserv_idx_macro` sourcetype="linux_secure" | rex field=_raw "kernel:.*?\]\s+(?<kernel_event>[A-Z_]+)" | where isnotnull(kernel_event) | bin _time span=1h | stats count by kernel_event, _time | rename _time as bucket_ts | eval metric="kernel"] [search `sap_logserv_idx_macro` sourcetype="linux_messages_syslog" sap_app=* | fillnull value="(none)" sap_sid | bin _time span=1h | stats count by sap_app, sap_sid, _time | rename _time as bucket_ts | eval metric="sapapp"] [search `sap_logserv_idx_macro` sourcetype="linux_messages_syslog" sap_sid=* | fillnull value="(none)" sap_inst sap_cid host | bin _time span=1h | stats count by sap_sid, sap_inst, sap_cid, host, _time | rename _time as bucket_ts | eval metric="sapinst"] [search `sap_logserv_idx_macro` (sourcetype="linux:warn" OR sourcetype="syslog") "Out of memory: Killed process" | fillnull value="(none)" oom_proc host | bin _time span=1h | stats count, max(oom_rss_kb) as max_rss, max(oom_vm_kb) as max_vm by host, oom_proc, _time | rename _time as bucket_ts | eval metric="oom"] [search `sap_logserv_idx_macro` (sourcetype="linux:warn" OR sourcetype="syslog") "soft lockup" | fillnull value="(none)" lockup_cpu host | bin _time span=1h | stats count, max(lockup_duration_s) as max_dur, sum(lockup_duration_s) as sum_dur by host, lockup_cpu, _time | rename _time as bucket_ts | eval metric="lockup"] [search `sap_logserv_idx_macro` (sourcetype="linux:warn" OR sourcetype="syslog") "TCP: out of memory" | fillnull value="(none)" host | bin _time span=1h | stats count by host, _time | rename _time as bucket_ts | eval metric="tcpoom"] | eval _key = substr(sha1(metric . ":" . coalesce(host,"") . ":" . coalesce(sourcetype,"") . ":" . coalesce(fw_action,"") . ":" . coalesce(fw_src,"") . ":" . coalesce(fw_dst,"") . ":" . coalesce(fw_dpt,"") . ":" . coalesce(fw_proto,"") . ":" . coalesce(kernel_event,"") . ":" . coalesce(sap_app,"") . ":" . coalesce(sap_sid,"") . ":" . coalesce(sap_inst,"") . ":" . coalesce(sap_cid,"") . ":" . coalesce(oom_proc,"") . ":" . coalesce(lockup_cpu,"")), 1, 24) . ":" . bucket_ts | fields _key, bucket_ts, metric, host, sourcetype, fw_action, fw_src, fw_dst, fw_dpt, fw_proto, kernel_event, sap_app, sap_sid, sap_inst, sap_cid, oom_proc, lockup_cpu, count, max_rss, max_vm, max_dur, sum_dur | outputlookup append=true logserv_linux_rollup
description = Linux Aggregation: per-hour rollup of the Linux System & Security dashboard's 7-sourcetype synthesis into logserv_linux_rollup KV Store (8 metrics: total/fw/kernel/sapapp/sapinst/oom/lockup/tcpoom). Powers the KPIs, sparks, volume/firewall/kernel charts, SAP instance/app tables, blocked-src/port tables, and the OOM/lockup/TCP resource-pressure panels. Hourly cadence.
cron_schedule = 17 * * * *
dispatch.earliest_time = -1h@h
dispatch.latest_time = @h
enableSched = 1
is_scheduled = 1
is_visible = false
disabled = false
request.ui_dispatch_app = splunk_app_sap_logserv

