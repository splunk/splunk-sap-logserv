action.notable.param.severity = medium
action.notable.param.rule_title = OOM kill burst on $host$ ($count$ kills, max RSS $max_rss_kb$ kB)
action.notable.param.rule_description = Host $host$ logged $count$ kernel OOM-killer events in the last hour, victim processes $victim_processes$ with max RSS $max_rss_kb$ kB. Investigate: VM under-sized, memory leak, or runaway workload.
