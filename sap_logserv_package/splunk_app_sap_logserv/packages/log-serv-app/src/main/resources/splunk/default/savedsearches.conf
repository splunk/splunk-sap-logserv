# LogServ AI Assistant — saved searches.
#
# Each [stanza] here corresponds to one entry in
# default/data/mcp/logserv_intent_map.json. The SPL is duplicated in
# both files; intentMap.consistency-test.ts asserts byte-equality at
# build time.
#
# These searches are discovered automatically by the official Splunk MCP
# Server (Splunkbase App 7931) via its `splunk_list_saved_searches`
# tool. The AI Assistant invokes them via `splunk_run_saved_search`.
#
# `is_visible = false` keeps these out of the user's saved-search
# picker — they're meant to be invoked through the AI Assistant only.
# `disabled = false` keeps them executable.
#
# We deliberately do NOT bake `dispatch.earliest_time` /
# `dispatch.latest_time` here. The AI Assistant's PromptBrowser picks a
# time range (Last 1h ... Last 30d) and passes it as MCP arguments,
# which Splunk applies as dispatch tokens that override any earliest=
# baked into the SPL.
#
# Session 025 (2026-05-03): groomed against live splunk-sh-idxr data.
# 17 SPL rewrites (corrected field names + values), 5 repurposes,
# 1 drop (linux_ssh_brute_force), 6 net-new prompts, 9 stale-suffix
# renames, 4 chartHint cleanups. See SESSION-MEMORY-025.md for the
# audit punch list.
#
# See ai_assistant_design_v0.1_20260427.md §4.1, §7.6.

