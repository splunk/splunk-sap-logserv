# =============================================================================
# Splunk Enterprise Security correlation searches (session 033 / B.4)
# =============================================================================
# Five starter correlation searches that emit notable events when ES is installed.
# Each uses `action.notable = 1` + standard ES action.notable.param.* fields.
# When ES is NOT installed, these saved searches load + dispatch normally but
# the notable action silently no-ops (Splunk's standard behavior).
# Risk scoring (action.risk = 1) is added in B.6.

# --- 1. HANA privilege escalation -------------------------------------------
[splunk_sap_logserv_es_hana_privilege_escalation]
search = `sap_logserv_idx_macro` sourcetype="sap:hana:audit" tag=change ((action_type=GRANT AND match(sql_statement, "(?i)WITH ADMIN OPTION")) OR (action_type="ALTER USER" AND target_user="SYSTEM")) | stats count, latest(_time) AS last_seen, values(sql_statement) AS sql_statements by executing_user, target_user, host, action_type | sort -count
description = ES Correlation Search: HANA privilege escalation. Detects GRANT statements with WITH ADMIN OPTION and ALTER USER on the SYSTEM user. Both signal privilege expansion or system-account modification — should map to a known change ticket. Risk score 80 (high).
cron_schedule = 35 * * * *
dispatch.earliest_time = -65m@m
dispatch.latest_time = -5m@m
enableSched = 1
is_scheduled = 1
is_visible = false
disabled = 1
request.ui_dispatch_app = splunk_app_sap_logserv
action.notable = 1
action.notable.param.severity = high
action.notable.param.rule_title = HANA Privilege Escalation: $action_type$ by $executing_user$ on $target_user$
action.notable.param.rule_description = HANA admin $executing_user$ ran $action_type$ targeting $target_user$ on host $host$. Total events in window: $count$. Confirm the change ticket; ALTER USER SYSTEM RESET CONNECT ATTEMPTS is routine but PASSWORD/role changes warrant investigation.
action.notable.param.security_domain = identity
action.notable.param.nes_fields = executing_user,target_user,host
# RBA risk annotations (B.6): operator + target user + host all accrue risk
action.risk = 1
action.risk.param._risk = [{"risk_object_field":"executing_user","risk_object_type":"user","risk_score":80},{"risk_object_field":"target_user","risk_object_type":"user","risk_score":40},{"risk_object_field":"host","risk_object_type":"system","risk_score":30}]
action.risk.param._risk_message = HANA privilege escalation: $executing_user$ ran $action_type$ on $target_user$ ($host$)

# --- 2. Cross-stack auth-failure burst --------------------------------------
[splunk_sap_logserv_es_cross_stack_auth_failure]
search = | datamodel Authentication search | search Authentication.action="failure" sourcetype IN ("sap:hana:audit","sap:sapstartsrv","sap:scc:audit","linux:sudolog") | rename Authentication.user AS user | stats values(sourcetype) AS sourcetypes, dc(sourcetype) AS distinct_sourcetypes, count, latest(_time) AS last_seen by user | where distinct_sourcetypes >= 2 | sort -distinct_sourcetypes -count
description = ES Correlation Search: Cross-stack authentication-failure burst. Detects when a single user has authentication failures across 2+ SAP stacks (HANA, sapstartsrv host control, Cloud Connector, sudo) within the same window. The cross-stack pattern is the highest-signal indicator of credential stuffing or coordinated brute force.
cron_schedule = 1,16,31,46 * * * *
dispatch.earliest_time = -20m@m
dispatch.latest_time = -5m@m
enableSched = 1
is_scheduled = 1
is_visible = false
disabled = 1
request.ui_dispatch_app = splunk_app_sap_logserv
action.notable = 1
action.notable.param.severity = high
action.notable.param.rule_title = Cross-stack auth-failure burst: user $user$ ($distinct_sourcetypes$ stacks)
