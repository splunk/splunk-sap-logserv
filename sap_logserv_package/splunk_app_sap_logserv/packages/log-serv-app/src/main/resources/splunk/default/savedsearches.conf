# ===========================================================================
# HANA Audit dashboard rollup (session 050 cont. / build 211). 4 metric
# sub-types (main / useradmin / security / password) via a union.
#   main: ALL events, fillnull the 5 nullable dims (executing_user, client_ip,
#         status, host, action_type) -> "(none)" so the per-(dims) stats keeps
#         every event (else null-dim rows drop). `bin _time AS bucket_ts`
#         preserves _time so max(_time)=last_seen is the true latest-in-bucket.
#   useradmin/security/password: precompute the panel's case()-categorization
#         on RAW events (correct null semantics), bin, count by the category.
# Fresh collection -> uniform sha1[:24] _key over metric + all dims.
#
# Multi-line draft of the main arm (flattened in search= below):
#   [search `sap_logserv_idx_macro` sourcetype="sap:hana:audit"
#     | bin _time span=1h AS bucket_ts
#     | fillnull value="(none)" executing_user client_ip status host action_type
#     | stats count, max(_time) as last_seen
#         by executing_user, action_type, action_category, status, risk_level,
#            client_ip, host, bucket_ts
#     | eval metric="main"]
# ===========================================================================

[logserv_hana_aggregate]
search = | union [search `sap_logserv_idx_macro` sourcetype="sap:hana:audit" | bin _time span=1h AS bucket_ts | fillnull value="(none)" executing_user client_ip status host action_type | stats count, max(_time) as last_seen by executing_user, action_type, action_category, status, risk_level, client_ip, host, bucket_ts | eval metric="main"] [search `sap_logserv_idx_macro` sourcetype="sap:hana:audit" | where match(audit_category,"HEC Audit - User Administration") | eval admin_action=case(match(sql_statement,"(?i)reset connect"),"Password Reset", match(sql_statement,"(?i)activate user"),"User Activation", match(sql_statement,"(?i)deactivate user"),"User Deactivation", match(sql_statement,"(?i)disable password"),"Policy Change", 1=1,"Other Admin") | bin _time span=1h | stats count by admin_action, _time | rename _time as bucket_ts | eval metric="useradmin"] [search `sap_logserv_idx_macro` sourcetype="sap:hana:audit" | where status!="SUCCESSFUL" OR match(action_type,"(?i)(grant|revoke|create|drop)") | eval event_type=case(status!="SUCCESSFUL","Failed Operation", match(action_type,"(?i)grant"),"Permission Grant", match(action_type,"(?i)revoke"),"Permission Revoke", match(action_type,"(?i)(create|drop)"),"Object Modification", 1=1,"Other Security Event") | bin _time span=1h | stats count by event_type, _time | rename _time as bucket_ts | eval metric="security"] [search `sap_logserv_idx_macro` sourcetype="sap:hana:audit" | where match(sql_statement,"(?i)password") | eval password_action=case(match(sql_statement,"password \*\*\*"),"Password Change", match(sql_statement,"disable password"),"Disable Lifetime", match(sql_statement,"reset.*connect"),"Reset Attempts", 1=1,"Other") | fillnull value="(none)" target_user executing_user client_ip | bin _time span=1h | stats count by password_action, target_user, executing_user, client_ip, _time | rename _time as bucket_ts | eval metric="password"] | eval _key = substr(sha1(metric . ":" . coalesce(executing_user,"") . ":" . coalesce(action_type,"") . ":" . coalesce(action_category,"") . ":" . coalesce(status,"") . ":" . coalesce(risk_level,"") . ":" . coalesce(client_ip,"") . ":" . coalesce(host,"") . ":" . coalesce(admin_action,"") . ":" . coalesce(event_type,"") . ":" . coalesce(password_action,"") . ":" . coalesce(target_user,"")), 1, 24) . ":" . bucket_ts | fields _key, bucket_ts, metric, executing_user, action_type, action_category, status, risk_level, client_ip, host, admin_action, event_type, password_action, target_user, count, last_seen | outputlookup append=true logserv_hana_category_rollup
