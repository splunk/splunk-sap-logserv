# =============================================================================
# Environment Topology — KV Store aggregation pipeline (session 035 / build 188)
# =============================================================================
# Hourly time-bucketed aggregation of topology nodes + edges into KV Store
# collections (logserv_topology_nodes + logserv_topology_edges). Replaces the
# on-demand SPL aggregation in useTopologyData (session 023 builds 109+).
#
# Two aggregation searches run hourly at :05 past the hour, processing the
# just-completed hour. Composite _key = "<id>:<bucket_ts>" gives upsert
# semantics via outputlookup append=true (existing _keys get replaced; new
# rows get added).
#
# A daily retention search at 00:30 trims rows older than 30 days from both
# collections.
#
# A one-time backfill search (disabled by default) fills the last 30 days in
# one pass — admin runs it from Settings -> AI Assistant -> Topology after
# first install, then never again.
#
# View-side reader: useTopologyData hook fetches via REST KV Store API
# filtered on bucket_ts range (driven by the global TimeRangeProvider's
# earliest/latest). JS aggregator collapses per-bucket rows into per-entity
# display rows + applies inventory-driven IP->SID resolution at render time
# (preserves the existing display-layer logic from build 113+).
#
# IDs:
#   - Node id  = substr(sha1("<canonical_kind>:<canonical_value>"), 1, 16)
#   - Edge id  = substr(sha1("<source_id>:<target_id>:<type>"), 1, 16)
# 16 hex chars = 64-bit collision resistance, plenty for sub-1000 entities.
#
# spl_filter_clauses on edge rows: JSON array of {field, value} pairs that
# the session-036 right-pane drilldown queries splice into the per-edge SPL
# filter (e.g., for a webdispatcher HTTP edge: [{"field":"clientip","value":"10.x.y.z"},{"field":"host","value":"hec53v..."}]).
# Built via string concatenation since values are constrained to alphanumeric
# + dots/hyphens/underscores; no JSON-escaping needed for our data domain.
# =============================================================================

# --- Aggregate-NODES: hourly per-(canonical_kind, canonical_value, bucket) ---
#
# 5-source union mirroring the on-demand SEARCH_INVENTORY (session 023 build
# 113 + build 122 / A.3): gateway local_ip + ICM icm_local_ip + HANA
# tracelogs hana_host + Splunk default host. Each source contributes
# event_count and last_seen. Final stats merges duplicates (same canonical
# entity from multiple sources within the same bucket) by summing counts +
# maxing last_seen.
#
# Multi-line draft of the SPL (flattened to a single line in the search=
# value below):
#
#   | union
#       [search `sap_logserv_idx_macro` sourcetype=sap:abap:gateway local_ip=* sap_sid=*
#         | bin _time span=1h
#         | stats count as event_count, max(_time) as last_seen by sap_sid, _time
#         | rename sap_sid as canonical_value
#         | eval canonical_kind="sid"]
#       [search `sap_logserv_idx_macro` sourcetype=sap:abap:gateway local_ip=*
#         | bin _time span=1h
#         | stats count as event_count, max(_time) as last_seen by local_ip, _time
#         | rename local_ip as canonical_value
#         | eval canonical_kind="ip"]
#       [search `sap_logserv_idx_macro` sourcetype=sap:abap:icm icm_local_ip=*
#         | bin _time span=1h
#         | stats count as event_count, max(_time) as last_seen by icm_local_ip, _time
#         | rename icm_local_ip as canonical_value
#         | eval canonical_kind="ip"]
#       [search `sap_logserv_idx_macro` sourcetype=sap:hana:tracelogs hana_host=*
#         | bin _time span=1h
#         | stats count as event_count, max(_time) as last_seen by hana_host, _time
#         | rename hana_host as canonical_value
#         | eval canonical_kind="host"]
#       [search `sap_logserv_idx_macro` host=* sap_sid=*
#         | bin _time span=1h
#         | stats count as event_count, max(_time) as last_seen by host, _time
#         | rename host as canonical_value
#         | eval canonical_kind="host"]
#   | stats sum(event_count) as event_count, max(last_seen) as last_seen
#       by canonical_kind, canonical_value, _time
#   | rename _time as bucket_ts
#   | eval id = substr(sha1(canonical_kind . ":" . canonical_value), 1, 16)
#   | eval _key = id . ":" . bucket_ts
#   | eval kind = case(
#       canonical_kind == "sid" AND match(canonical_value, "^(XCP|XHQ)$"), "sid_focused",
#       canonical_kind == "sid", "sid_secondary",
#       1==1, "partner")
#   | eval tag = case(
#       canonical_kind == "sid" AND match(canonical_value, "^XC[A-Z]$"), "ECC",
#       canonical_kind == "sid" AND match(canonical_value, "^XH[A-Z]$"), "DB",
#       canonical_kind == "sid", "ABAP",
#       canonical_kind == "tenant_db", "DB",
#       1==1, "EXT")
#   | eval label = canonical_value
#   | fields _key, id, canonical_kind, canonical_value, bucket_ts, kind, tag, label, event_count, last_seen
#   | outputlookup append=true logserv_topology_nodes

[logserv_topology_aggregate_nodes]
search = | union [search `sap_logserv_idx_macro` sourcetype=sap:abap:gateway local_ip=* sap_sid=* | bin _time span=1h | stats count as event_count, max(_time) as last_seen by sap_sid, _time | rename sap_sid as canonical_value | eval canonical_kind="sid"] [search `sap_logserv_idx_macro` sourcetype=sap:abap:gateway local_ip=* | bin _time span=1h | stats count as event_count, max(_time) as last_seen by local_ip, _time | rename local_ip as canonical_value | eval canonical_kind="ip"] [search `sap_logserv_idx_macro` sourcetype=sap:abap:icm icm_local_ip=* | bin _time span=1h | stats count as event_count, max(_time) as last_seen by icm_local_ip, _time | rename icm_local_ip as canonical_value | eval canonical_kind="ip"] [search `sap_logserv_idx_macro` sourcetype=sap:hana:tracelogs hana_host=* | bin _time span=1h | stats count as event_count, max(_time) as last_seen by hana_host, _time | rename hana_host as canonical_value | eval canonical_kind="host"] [search `sap_logserv_idx_macro` host=* sap_sid=* | bin _time span=1h | stats count as event_count, max(_time) as last_seen by host, _time | rename host as canonical_value | eval canonical_kind="host"] [search `sap_logserv_idx_macro` sourcetype=sap:webdispatcher:access clientip=* | bin _time span=1h | stats count as event_count, max(_time) as last_seen by clientip, _time | rename clientip as canonical_value | eval canonical_kind="ip"] [search `sap_logserv_idx_macro` sourcetype=sap:abap:gateway peer_ip=* | bin _time span=1h | stats count as event_count, max(_time) as last_seen by peer_ip, _time | rename peer_ip as canonical_value | eval canonical_kind="ip"] [search `sap_logserv_idx_macro` sourcetype=sap:hana:audit client_ip=* | where client_ip != "127.0.0.1" | bin _time span=1h | stats count as event_count, max(_time) as last_seen by client_ip, _time | rename client_ip as canonical_value | eval canonical_kind="ip"] | stats sum(event_count) as event_count, max(last_seen) as last_seen by canonical_kind, canonical_value, _time | rename _time as bucket_ts | eval id = substr(sha1(canonical_kind . ":" . canonical_value), 1, 16) | eval _key = id . ":" . bucket_ts | eval kind = case(canonical_kind == "sid" AND match(canonical_value, "^(XCP|XHQ)$"), "sid_focused", canonical_kind == "sid", "sid_secondary", 1==1, "partner") | eval tag = case(canonical_kind == "sid" AND match(canonical_value, "^XC[A-Z]$"), "ECC", canonical_kind == "sid" AND match(canonical_value, "^XH[A-Z]$"), "DB", canonical_kind == "sid", "ABAP", canonical_kind == "tenant_db", "DB", 1==1, "EXT") | eval label = canonical_value | fields _key, id, canonical_kind, canonical_value, bucket_ts, kind, tag, label, event_count, last_seen | outputlookup append=true logserv_topology_nodes
description = Topology Aggregation: per-hour activity rollup into logserv_topology_nodes KV Store. Powers the Environment Topology view's node list and the time-range picker filter. Hourly cadence; admin can disable from Settings -> AI Assistant -> Topology.
