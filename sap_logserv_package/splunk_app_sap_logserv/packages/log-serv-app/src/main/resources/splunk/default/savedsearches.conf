y=action_type, metric="edge_op"] [search `sap_logserv_idx_macro` sourcetype=sap:hana:tracelogs sap_sid=* hana_tenant_sid=* hana_trace_component=* | where sap_sid!=hana_tenant_sid | bin _time span=1h | stats count by sap_sid, hana_tenant_sid, hana_trace_component, _time | rename _time as bucket_ts | eval source_id=substr(sha1("sid:" . sap_sid), 1, 16) | eval target_id=substr(sha1("tenant_db:" . hana_tenant_sid), 1, 16) | eval scope=substr(sha1(source_id . ":" . target_id . ":hana_tenant"), 1, 16) | eval entity=hana_trace_component, metric="edge_op"] [search `sap_logserv_idx_macro` sourcetype=sap:webdispatcher:access clientip=* host=* status=* | eval bucket_label=case(status>=200 AND status<300, "2xx Success", status>=300 AND status<400, "3xx Redirect", status>=400 AND status<500, "4xx Client Error", status>=500, "5xx Server Error", 1==1, "other") | bin _time span=1h | stats count by clientip, host, bucket_label, _time | rename _time as bucket_ts | eval source_id=substr(sha1("ip:" . clientip), 1, 16) | eval target_id=substr(sha1("host:" . host), 1, 16) | eval scope=substr(sha1(source_id . ":" . target_id . ":http"), 1, 16) | eval metric="edge_perf"] [search `sap_logserv_idx_macro` sourcetype=sap:abap:gateway peer_ip=* local_ip=* sap_sid=* icm_tasks=* | eval bucket_label=case(icm_tasks=0, "0 idle", icm_tasks<=2, "1-2", icm_tasks<=5, "3-5", icm_tasks<=10, "6-10", icm_tasks<=25, "11-25", 1==1, "26+") | bin _time span=1h | stats count by sap_sid, peer_ip, bucket_label, _time | rename _time as bucket_ts | eval source_id=substr(sha1("sid:" . sap_sid), 1, 16) | eval target_id=substr(sha1("ip:" . peer_ip), 1, 16) | eval scope=substr(sha1(source_id . ":" . target_id . ":rfc"), 1, 16) | eval metric="edge_perf"] [search `sap_logserv_idx_macro` sourcetype=sap:hana:audit client_ip=* host=* action_status=* | where client_ip!="127.0.0.1" | bin _time span=1h | stats count by client_ip, host, action_status, _time | rename _time as bucket_ts, action_status as bucket_label | eval source