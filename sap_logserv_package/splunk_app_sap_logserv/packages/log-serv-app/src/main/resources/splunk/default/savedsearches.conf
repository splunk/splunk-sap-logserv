") . ":" . coalesce(sap_instance,"") . ":" . coalesce(status_cat,"") . ":" . coalesce(icm_request_type,"") . ":" . coalesce(icm_peer_ip,"") . ":" . coalesce(icm_transaction_id,"") . ":" . coalesce(icm_protocol,"") . ":" . coalesce(gw_remote_host,"") . ":" . coalesce(gw_function,"") . ":" . coalesce(gw_service,"")), 1, 24) . ":" . bucket_ts | fields _key, bucket_ts, metric, sourcetype, sap_sid, sap_instance, status_cat, icm_request_type, icm_peer_ip, icm_transaction_id, icm_protocol, gw_remote_host, gw_function, gw_service, gw_error_detail, count | outputlookup append=true logserv_abapnet_rollup
