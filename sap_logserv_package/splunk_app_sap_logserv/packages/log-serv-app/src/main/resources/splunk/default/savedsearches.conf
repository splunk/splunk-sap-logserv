# ===========================================================================
# Web Dispatcher Slowest Traces rollup (build 236). Per-hour top-20
# sap:webdispatcher:access events by total_us, with per-event trace detail
# (uri/status/method/dt1-4_us/total_us/event_time). The dashboard reads the
# union of per-hour top-20s, re-sorts by total_us, head 20 → the GLOBAL top-20
# over the picked range, BYTE-EXACT (every global-top-20 event is within its
# own hour's top-20). _key = <bucket_ts>:<rank>. Hourly cadence.
# ===========================================================================
[logserv_webdisp_slowtrace_aggregate]
search = `sap_logserv_idx_macro` sourcetype="sap:webdispatcher:access" | bin _time span=1h as bucket_ts | sort 0 - total_us, _time | streamstats count as rk by bucket_ts | where rk<=20 | eval event_time=_time, _key=bucket_ts . ":" . rk | fields _key, bucket_ts, event_time, uri, status, method, dt1_us, dt2_us, dt3_us, dt4_us, total_us | outputlookup append=true logserv_webdisp_slowtrace_rollup
description = Web Dispatcher Slowest Traces Aggregation: per-hour top-20 webdispatcher events by total_us into logserv_webdisp_slowtrace_rollup. Powers the Slowest Request Traces panel (byte-exact global top-20). Hourly cadence.
