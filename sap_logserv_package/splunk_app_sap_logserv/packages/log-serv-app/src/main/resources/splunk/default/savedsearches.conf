# ===========================================================================
# SAP Router dashboard rollup (session 052 / build 216). 2 metric sub-types.
#   main      grain (action, peer_ip, return_code, is_error, error_function) +
#             count -- 18 combos; all 5 dims fillnull'd to "(none)" (heavily
#             nullable) so totals are preserved; reads exclude "(none)". Serves
#             the 4 KPIs+sparks (Total / Errors=is_error="true" / Inval=
#             action="INVAL DATA" / Peers=dc(peer_ip)), the Connection-Actions
#             (by action) + Error trends, Top Peers (by peer_ip), the Return-
#             Code pie (raw code stored, decoded at read), and the Error-Detail
#             table's Count + dc(peer_ip) + values(return_code) by error_function.
#   errdetail (error_function) + per-bucket latest(error_detail) over
#             is_error="true" error_function=* events -- the Error-Detail
#             table's "Last Error Detail" column (bin _time AS bucket_ts keeps
#             _time so latest() is the true latest-in-bucket; read =
#             latest-of-per-bucket-latest by error_function).
# Recent Connection Log stays RAW (event listing). Fresh -> uniform sha1[:24].
# ===========================================================================

[logserv_saprouter_aggregate]
search = | union [search `sap_logserv_idx_macro` sourcetype="sap:saprouter" | fillnull value="(none)" action peer_ip return_code is_error error_function | bin _time span=1h | stats count by action, peer_ip, return_code, is_error, error_function, _time | rename _time as bucket_ts | eval metric="main"] [search `sap_logserv_idx_macro` sourcetype="sap:saprouter" is_error="true" error_function=* | bin _time span=1h AS bucket_ts | stats latest(error_detail) AS error_detail by error_function, bucket_ts | eval metric="errdetail"] | eval _key = substr(sha1(metric . ":" . coalesce(action,"") . ":" . coalesce(peer_ip,"") . ":" . coalesce(return_code,"") . ":" . coalesce(is_error,"") . ":" . coalesce(error_function,"")), 1, 24) . ":" . bucket_ts | fields _key, bucket_ts, metric, action, peer_ip, return_code, is_error, error_function, error_detail, count | outputlookup append=true logserv_saprouter_rollup
description = SAP Router Aggregation: per-hour rollup of sap:saprouter into logserv_saprouter_rollup KV Store (main + errdetail metrics). Powers the SAP Router dashboard KPIs, trends, Top Peers, Return-Code pie, and Error-Detail table. Hourly cadence.
cron_schedule = 13 * * * *
dispatch.earliest_time = -1h@h
dispatch.latest_time = @h
enableSched = 1
is_scheduled = 1
is_visible = false
disabled = false
