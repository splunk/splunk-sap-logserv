# ===========================================================================
# Network Perimeter dashboard rollup (session 052 / build 220). 7 metric
# sub-types via a | union + 3 RAW panels (kpiBeacon / sparkBeacon / suspicious =
# streamstats per-event beaconing). Design adversarially reviewed pre-build.
#   fw       (fw_action,fw_src,fw_dst,fw_dpt,fw_proto,host)+count over ALL
#            linux_secure (rex from _raw, all 6 fillnull'd). kpiFw/sparkFw/fwProto
#            read fw_action="IN_DROP"; blockedSrc/blockedPort do NOT filter action
#            (latent dashboard imprecision -- counts IN_ACCEPT too -- REPLICATED).
#   proxy    per-bucket count + denied_count (status=403 OR vendor_action=
#            "TCP_DENIED") + bytes_sum (sum(bytes_out)) over squid:access.
#   proxydom (url_domain,src_ip)+count+bytes_sum over squid url_domain=* bytes_out=*.
#   dnscount per-bucket count over tag=dns message_type="Query" (FULL scope).
#   dnstype  (query_type)+count over tag=dns message_type="Query" query_type=*.
#   dnsq     (query,src)+count+txt_count+mx_count over tag=dns message_type=
#            "Query" query=* (query is the scope filter; query_type collapsed to
#            txt/mx sum-measures for cardinality).
#   activity (source_type)+count over the combined base with the VERBATIM
#            source_type case (match(_raw,"IN_DROP") + sourcetype="isc:bind:query").
# Fresh collection -> uniform sha1[:24] _key.
# ===========================================================================

[logserv_perimeter_aggregate]
search = | union [search `sap_logserv_idx_macro` sourcetype="linux_secure" | rex field=_raw "(?<fw_action>IN_DROP|IN_ACCEPT)" | rex field=_raw "SRC=(?<fw_src>[^ ]+)" | rex field=_raw "DST=(?<fw_dst>[^ ]+)" | rex field=_raw "DPT=(?<fw_dpt>[^ ]+)" | rex field=_raw "PROTO=(?<fw_proto>[^ ]+)" | fillnull value="(none)" fw_action fw_src fw_dst fw_dpt fw_proto host | bin _time span=1h | stats count by fw_action, fw_src, fw_dst, fw_dpt, fw_proto, host, _time | rename _time as bucket_ts | eval metric="fw"] [search `sap_logserv_idx_macro` sourcetype="squid:access" | bin _time span=1h | stats count, sum(eval(if(status=403 OR vendor_action="TCP_DENIED",1,0))) as denied_count, sum(bytes_out) as bytes_sum by _time | rename _time as bucket_ts | eval metric="proxy"] [search `sap_logserv_idx_macro` sourcetype="squid:access" url_domain=* bytes_out=* | fillnull value="(none)" src_ip | bin _time span=1h | stats count, sum(bytes_out) as bytes_sum by url_domain, src_ip, _time | rename _time as bucket_ts | eval metric="proxydom"] [search `sap_logserv_idx_macro` tag=dns message_type="Query" | bin _time span=1h | stats count by _time | rename _time as bucket_ts | eval metric="dnscount"] [search `sap_logserv_idx_macro` tag=dns message_type="Query" query_type=* | bin _time span=1h | stats count by query_type, _time | rename _time as bucket_ts | eval metric="dnstype"] [search `sap_logserv_idx_macro` tag=dns message_type="Query" query=* | fillnull value="(none)" src | bin _time span=1h | stats count, sum(eval(if(query_type="TXT",1,0))) as txt_count, sum(eval(if(query_type="MX",1,0))) as mx_count by query, src, _time | rename _time as bucket_ts | eval metric="dnsq"] [search `sap_logserv_idx_macro` (sourcetype="linux_secure" OR sourcetype="squid:access" OR (tag=dns message_type="Query")) | eval source_type = case(sourcetype="linux_secure" AND match(_raw, "IN_DROP"), "Firewall Drops", sourcetype="squid:access", "Proxy Requests", sourcetype="isc:bind:query", "DNS Queries", 1=1, "other") | where source_type != "other" | bin _time span=1h | stats count by source_type, _time | rename _time as bucket_ts | eval metric="activity"] | eval _key = substr(sha1(metric . ":" . coalesce(fw_action,"") . ":" . coalesce(fw_src,"") . ":" . coalesce(fw_dst,"") . ":" . coalesce(fw_dpt,"") . ":" . coalesce(fw_proto,"") . ":" . coalesce(host,"") . ":" . coalesce(url_domain,"") . ":" . coalesce(src_ip,"") . ":" . coalesce(query_type,"") . ":" . coalesce(query,"") . ":" . coalesce(src,"") . ":" . coalesce(source_type,"")), 1, 24) . ":" . bucket_ts | fields _key, bucket_ts, metric, fw_action, fw_src, fw_dst, fw_dpt, fw_proto, host, url_domain, src_ip, query_type, query, src, source_type, count, denied_count, bytes_sum, txt_count, mx_count | outputlookup append=true logserv_perimeter_rollup
