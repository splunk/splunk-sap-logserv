# ===========================================================================
# Environment Health cross-cutting error/severity rollup (session 050 cont. /
# build 209). Dashboard-perf tier #6 — precomputes the error CLASSIFICATION
# for the default-landing dashboard's cross-cutting panels.
#
# 6 metric sub-types via a union (each precomputes ONE panel-group's EXACT
# condition + classification, since the panels count different event sets):
#   toterr   (sourcetype, host)        -> Total Errors KPI + spark; HANA
#                                         Failed Ops + Firewall Drops KPIs
#                                         derive by sourcetype filter.
#   trend    (trend_cat, trend_src)    -> the 6 error-trend charts.
#   tophost  (host, error_cat)         -> Affected Hosts matrix.
#   web      (per-bucket)              -> Web Error Rate + Web Response Time.
#   icmstat  (status_cat)             -> ICM Status Codes.
#   authfail (per-bucket)             -> Auth Failures KPI + spark.
# Fresh collection -> uniform sha1[:24] _key over metric + all dims.
#
# Multi-line draft of the trend arm (the most intricate; flattened below):
#   [search `sap_logserv_idx_macro` (<union of the 6 charts' conditions>)
#     | eval trend_cat=case(<sourcetype -> ABAP/HANA/Security/Web-Network/
#                            OS-Infra/Cloud-Connector>)
#     | eval trend_src=case(<sourcetype[+severity/status] -> the per-chart
#                            series label, e.g. Dispatcher / Audit Failures /
#                            WebDisp 4xx/5xx / Windows High / 5xx Server>)
#     | bin _time span=1h | stats count by trend_cat, trend_src, _time
#     | rename _time as bucket_ts | eval metric="trend"]
# ===========================================================================

[logserv_severity_aggregate]
