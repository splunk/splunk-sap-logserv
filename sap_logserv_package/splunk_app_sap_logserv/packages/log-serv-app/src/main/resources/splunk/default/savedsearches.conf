# ===========================================================================
# HANA Trace dashboard rollup (session 053 / build 223; extended build 232 with
# dur + durop metrics). main metric grain (all fillnull "(none)"): sap_sid,
# hana_instance, hana_trace_component, hana_trace_source_file,
# hana_trace_source_line, hana_trace_severity. Measures: count + last_seen
# (=max(_time)) for sourceHotspots' latest(sev). Powers KPIs/sparks/traceVolume/
# bySeverity/topComponents/componentSeverity/sourceHotspots/sidInstance.
#   dur   per-bucket over hana_op_duration_ms=*: sum_dur+cnt_dur+max_dur (build
#         232) -- Operation Duration chart (was RAW p50/p95/max -> now Avg+Max).
#   durop (hana_op,sap_sid) over hana_op_duration_ms=*: sum_dur+cnt_dur+max_dur+
#         count (build 232) -- Slowest SQL Operations (was a RAW per-event head-
#         sort listing -> now top operations by Max/Avg duration; per-event
#         _time/host dropped, cannot survive a rollup). hana_op rex'd from _raw.
# Build 232 _key uses a case(): dur="dur:"+bucket_ts; durop=sha1("durop:"+op+sid);
# main keeps its ORIGINAL formula byte-identical (re-backfill upserts in place).
# RAW remaining: errorDetail (event listing, | head 500). Hourly cadence.
# ===========================================================================
[logserv_hana_trace_aggregate]
search = | union [search `sap_logserv_idx_macro` sourcetype="sap:hana:tracelogs" | fillnull value="(none)" sap_sid hana_instance hana_trace_component hana_trace_source_file hana_trace_source_line hana_trace_severity | bin _time span=1h AS bucket_ts | stats count, max(_time) as last_seen by sap_sid, hana_instance, hana_trace_component, hana_trace_source_file, hana_trace_source_line, hana_trace_severity, bucket_ts | eval metric="main"] [search `sap_logserv_idx_macro` sourcetype="sap:hana:tracelogs" hana_op_duration_ms=* | bin _time span=1h AS bucket_ts | stats sum(hana_op_duration_ms) as sum_dur, count(hana_op_duration_ms) as cnt_dur, max(hana_op_duration_ms) as max_dur by bucket_ts | eval metric="dur"] [search `sap_logserv_idx_macro` sourcetype="sap:hana:tracelogs" hana_op_duration_ms=* | rex field=_raw "^\"(?<hana_op>[^\"]+)\"" | fillnull value="(none)" hana_op sap_sid | bin _time span=1h AS bucket_ts | stats sum(hana_op_duration_ms) as sum_dur, count(hana_op_duration_ms) as cnt_dur, max(hana_op_duration_ms) as max_dur, count as count by hana_op, sap_sid, bucket_ts | eval metric="durop"] | eval _key = case(metric="dur", "dur:" . bucket_ts, metric="durop", substr(sha1("durop:" . coalesce(hana_op,"") . ":" . coalesce(sap_sid,"")), 1, 24) . ":" . bucket_ts, 1==1, substr(sha1(metric . ":" . sap_sid . ":" . hana_instance . ":" . hana_trace_component . ":" . hana_trace_source_file . ":" . hana_trace_source_line . ":" . hana_trace_severity), 1, 24) . ":" . bucket_ts) | fields _key, bucket_ts, metric, sap_sid, hana_instance, hana_trace_component, hana_trace_source_file, hana_trace_source_line, hana_trace_severity, hana_op, count, last_seen, sum_dur, cnt_dur, max_dur | outputlookup append=true logserv_hana_trace_rollup
description = HANA Trace Aggregation: per-hour rollup of sap:hana:tracelogs into logserv_hana_trace_rollup KV Store (3 metrics: main/dur/durop). Powers the KPIs, sparks, trace-volume + by-severity timecharts, Components / Component-by-Severity / Source-File-Hotspots tables, SID/Instance chart, Operation Duration (avg+max) chart, and Slowest SQL Operations table. Build 232 folded the former RAW duration percentile + slowest-ops panels into dur/durop measures. Only errorDetail (event listing) stays RAW. Hourly cadence.
