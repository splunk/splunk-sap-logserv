# ===========================================================================
# Host Details dashboard rollup (build 233). 3 metrics per (host, bucket):
#   vol  -- count + sum_bytes(=sum(len(_raw)))  : DATA VOLUME KPI + sparkVolume
#   err  -- count over (severity=ERROR OR severity=CRITICAL OR "error" OR
#           "critical")                          : ERRORS/CRITICALS + sparkErrors
#   auth -- count over ("authentication failure" OR "Failed password" OR
#           "FAILED LOGIN" OR EventCode=4625 OR status="UNSUCCESSFUL")
#                                                : AUTH FAILURES + sparkAuth
# Each arm fillnull "(none)" host so null-host events are preserved (the all-hosts
# reads sum over them, matching the raw KPIs). _key = sha1(metric:host)[:24]:bucket_ts.
# sparkErrors/sparkAuth are ALIGNED to their KPI filter (the pre-build sparks used a
# narrower filter than the KPI — a pre-existing inconsistency now made consistent).
# eventsBySource was moved to tstats (sourcetype indexed); TOTAL EVENTS / ACTIVE
# SOURCETYPES / topSources / dataFreshness were already tstats. Hourly cadence.
# ===========================================================================
[logserv_hostdetails_aggregate]
search = | union [search `sap_logserv_idx_macro` | eval bytes=len(_raw) | fillnull value="(none)" host | bin _time span=1h | stats count, sum(bytes) as sum_bytes by host, _time | rename _time as bucket_ts | eval metric="vol"] [search `sap_logserv_idx_macro` (severity=ERROR OR severity=CRITICAL OR "error" OR "critical") | fillnull value="(none)" host | bin _time span=1h | stats count by host, _time | rename _time as bucket_ts | eval metric="err"] [search `sap_logserv_idx_macro` ("authentication failure" OR "Failed password" OR "FAILED LOGIN" OR EventCode=4625 OR status="UNSUCCESSFUL") | fillnull value="(none)" host | bin _time span=1h | stats count by host, _time | rename _time as bucket_ts | eval metric="auth"] | eval _key = substr(sha1(metric . ":" . host), 1, 24) . ":" . bucket_ts | fields _key, bucket_ts, metric, host, count, sum_bytes | outputlookup append=true logserv_hostdetails_rollup
description = Host Details Aggregation: per-hour rollup of the Overview-tab raw full-scan panels into logserv_hostdetails_rollup KV Store (3 metrics: vol/err/auth). Powers DATA VOLUME / ERRORS-CRITICALS / AUTH FAILURES KPIs + their sparklines. Hourly cadence.
cron_schedule = 27 * * * *
dispatch.earliest_time = -1h@h
dispatch.latest_time = @h
enableSched = 1
is_scheduled = 1
is_visible = false
disabled = false
request.ui_dispatch_app = splunk_app_sap_logserv

