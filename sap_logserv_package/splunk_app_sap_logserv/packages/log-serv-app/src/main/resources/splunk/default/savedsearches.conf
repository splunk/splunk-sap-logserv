# =============================================================================
# Risk-Based Notable (session 033 / B.6)
# =============================================================================
# Higher-tier correlation search that aggregates risk events from the 5 base
# correlation searches above and creates a Notable when a single risk_object
# accumulates >= 100 risk_score within 24 hours. Standard ES RBA pattern.
#
# This search reads from ES's Risk data model (Risk.All_Risk), which is
# populated when ES is installed AND action.risk=1 fires on the base searches.
# When ES is NOT installed, this search returns no rows (the Risk data model
# isn't accelerated), so it silently no-ops.

[splunk_sap_logserv_es_risk_notable_threshold]
search = | from datamodel:Risk.All_Risk | search source IN ("splunk_sap_logserv_es_hana_privilege_escalation","splunk_sap_logserv_es_cross_stack_auth_failure","splunk_sap_logserv_es_abap_gateway_anomalous_peer","splunk_sap_logserv_es_scc_access_denied_burst","splunk_sap_logserv_es_hana_failed_connect_spike","splunk_sap_logserv_es_oom_kill_burst","splunk_sap_logserv_es_lateral_movement","splunk_sap_logserv_es_privilege_chain","splunk_sap_logserv_es_after_hours_admin_data_access","splunk_sap_logserv_es_service_account_interactive","splunk_sap_logserv_es_hana_user_creation_off_hours","splunk_sap_logserv_es_hana_mass_drop","splunk_sap_logserv_es_ti_dns_to_malicious_domain","splunk_sap_logserv_es_ti_proxy_to_malicious_ip","splunk_sap_logserv_es_ti_compromised_credential_use","splunk_sap_logserv_es_anomaly_user_auth_volume","splunk_sap_logserv_es_anomaly_webdisp_response","splunk_sap_logserv_es_anomaly_topology_edge_volume","splunk_sap_logserv_es_anomaly_after_hours_admin") | stats sum(All_Risk.risk_score) AS total_risk values(All_Risk.risk_object_type) AS risk_object_type values(source) AS source_searches dc(source) AS distinct_searches latest(_time) AS last_event by All_Risk.risk_object | rename All_Risk.risk_object AS risk_object | where total_risk >= 100 | sort -total_risk
description = ES Risk Notable (RBA tier 2): aggregates risk events from the 5 SAP-side correlation searches and creates a Notable when a single risk_object (user, system, or other) accumulates >= 100 risk_score in 24h. Only fires when ES is installed (depends on Risk.All_Risk data model).
