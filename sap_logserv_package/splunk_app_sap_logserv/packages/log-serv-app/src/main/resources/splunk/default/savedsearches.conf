ame _time as bucket_ts | eval id = substr(sha1(canonical_kind . ":" . canonical_value), 1, 16) | eval _key = id . ":" . bucket_ts | eval kind = case(canonical_kind == "sid" AND match(canonical_value, "^(XCP|XHQ)$"), "sid_focused", canonical_kind == "sid", "sid_secondary", 1==1, "partner") | eval tag = case(canonical_kind == "sid" AND match(canonical_value, "^XC[A-Z]$"), "ECC", canonical_kind == "sid" AND match(canonical_value, "^XH[A-Z]$"), "DB", canonical_kind == "sid", "ABAP", canonical_kind == "tenant_db", "DB", 1==1, "EXT") | eval label = canonical_value | fields _key, id, canonical_kind, canonical_value, bucket_ts, kind, tag, label, event_count, last_seen | outputlookup append=true logserv_topology_nodes
