# ===========================================================================
# Cross-Stack Authentication dashboard rollup (session 052 / build 219).
# 3 metric sub-types via a | union + 2 RAW panels (windowsEvents / sapAuth).
# Design adversarially reviewed pre-build (3 lenses + synthesis; verdict: ship
# with the fillnull-0 timecharts + empty-safe KPIs already in the reads).
#   fail     (layer, failed_user)+count over ANY_AUTH_FAIL. failed_user=
#            coalesce(auth_user,src_user,user) fillnull'd (null AND empty ->
#            "(none)"); layer=case(sourcetype...) never null. KPIs partition by
#            layer (kpiTotal sums all incl "(none)"); topUsers groups by
#            failed_user excluding "(none)".
#   failip   (src, sourcetype)+count+last_seen over ANY_AUTH_FAIL with raw's src
#            filter (coalesce remote_ip/client_ip/src_ip/IpAddress; isnotnull AND
#            !="" AND !="127.0.0.1") applied in the aggregate -- failip is
#            sourceIps' sole consumer so null/loopback rows are pre-excluded.
#            sourceIps derives layer at read from sourcetype (decode-at-read).
#   hanauser (src_user, action_type, status, risk_level)+count+last_seen over the
#            FULL hana:audit Authentication population (incl successes -- separate
#            arm, NOT derived from fail). All 4 dims fillnull'd; read excludes
#            src_user="(none)"; Failures uses the STRICT guard (status!=
#            "SUCCESSFUL" AND status!="(none)") so a customer null-status event
#            with valid src_user is +1 Events / +0 Failures (sticky #16).
# ANY_AUTH_FAIL = ((sourcetype="sap:sapstartsrv" is_auth_event="true"
#   auth_result="failure") OR (sourcetype="sap:hana:audit" action_category=
#   "Authentication" status!="SUCCESSFUL") OR (sourcetype="XmlWinEventLog"
#   action="failure")). Fresh collection -> uniform sha1[:24] _key.
# ===========================================================================

[logserv_xstack_auth_aggregate]
search = | union [search `sap_logserv_idx_macro` ((sourcetype="sap:sapstartsrv" is_auth_event="true" auth_result="failure") OR (sourcetype="sap:hana:audit" action_category="Authentication" status!="SUCCESSFUL") OR (sourcetype="XmlWinEventLog" action="failure")) | eval layer=case(sourcetype="sap:sapstartsrv","SAP",sourcetype="sap:hana:audit","HANA",sourcetype="XmlWinEventLog","Windows") | eval failed_user=coalesce(auth_user, src_user, user) | eval failed_user=if(isnull(failed_user) OR failed_user="","(none)",failed_user) | bin _time span=1h | stats count by layer, failed_user, _time | rename _time as bucket_ts | eval metric="fail"] [search `sap_logserv_idx_macro` ((sourcetype="sap:sapstartsrv" is_auth_event="true" auth_result="failure") OR (sourcetype="sap:hana:audit" action_category="Authentication" status!="SUCCESSFUL") OR (sourcetype="XmlWinEventLog" action="failure")) | eval src=coalesce(remote_ip, client_ip, src_ip, IpAddress) | where isnotnull(src) AND src!="" AND src!="127.0.0.1" | bin _time span=1h AS bucket_ts | stats count, max(_time) as last_seen by src, sourcetype, bucket_ts | eval metric="failip"] [search `sap_logserv_idx_macro` sourcetype="sap:hana:audit" action_category="Authentication" | fillnull value="(none)" src_user action_type status risk_level | bin _time span=1h AS bucket_ts | stats count, max(_time) as last_seen by src_user, action_type, status, risk_level, bucket_ts | eval metric="hanauser"] | eval _key = substr(sha1(metric . ":" . coalesce(layer,"") . ":" . coalesce(failed_user,"") . ":" . coalesce(src,"") . ":" . coalesce(sourcetype,"") . ":" . coalesce(src_user,"") . ":" . coalesce(action_type,"") . ":" . coalesce(status,"") . ":" . coalesce(risk_level,"")), 1, 24) . ":" . bucket_ts | fields _key, bucket_ts, metric, layer, failed_user, src, sourcetype, src_user, action_type, status, risk_level, count, last_seen | outputlookup append=true logserv_xstack_auth_rollup
description = Cross-Stack Authentication Aggregation: per-hour rollup of the cross-source auth-failure synthesis (sapstartsrv / hana:audit / Windows) + the HANA Authentication activity population into logserv_xstack_auth_rollup KV Store (fail + failip + hanauser metrics). Powers the dashboard KPIs, sparks, Failures-by-Layer trend, Top Users, Source IPs, and HANA Users tables. Hourly cadence.
