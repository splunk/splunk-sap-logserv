# ===========================================================================
# Environment Topology DETAIL-TAB rollup (session 060 / build 240).
# Dashboard-perf tier #6 applied to the topology right-pane detail tabs — the
# one corner the v0.0.6 refactor never cached. ONE collection
# (logserv_topology_detail_rollup) + `metric` discriminator serves the node
# tabs (Calls/Hr, Top Programs, Errors, Hosts) and edge tabs (Operations,
# Performance, Errors). Edge Activity reuses logserv_topology_edges; the edge
# Performance headline p50/p95/max come straight off the edge row.
#
# NODE arms reproduce the live sourcetype-agnostic OR-match SEARCH_NODE_*
# (NOT the sourcetype-scoped per-field union in aggregate_nodes — that's why
# Calls/Hr can't reuse logserv_topology_nodes.event_count). The 3 full-scan
# metrics (node_hourly / node_host / node_error) are HOST-SPLIT into two arms
# (build 241) so the one-time backfill is ~minutes not ~hours:
#   - Arm H (host): a cheap single-pass `stats ... by host | eval scope=host`
#     over the full index — NO mvexpand — covering scope=host nodes.
#   - Arm S (SAP-fields explode): the 5 SAP fields only
#     (mvdedup(mvappend(sap_sid, peer_ip, local_ip, client_ip, clientip)) |
#     mvexpand scope), scoped to SAP events, covering scope=SID/IP nodes.
#   Combined = the 6-field OR-match BYTE-EXACT, because host values are disjoint
#   from SID/IP values (the only double-count case is a single event whose host
#   literally equals one of its own SAP-field values — structurally absent here;
#   gated by testing/derisk_hostsplit.py). node_program keeps the single 5-field
#   explode (it's already icm-scoped + cheap). Measured: node_host/day dropped
#   from ~1059 s (full-index mvexpand) to ~3 s.
#
# EDGE arms replicate aggregate_edges' id derivation: source_id=sha1(kind:val)
# [:16], target_id=sha1(kind:val)[:16], scope(=edge id)=sha1(source_id:target_id
# :type)[:16]. 4 types (http/rfc/hana_audit/hana_tenant). hana_tenant Performance
# stores sum/n/max of hana_op_duration_ms (Avg+Max at read — percentiles don't
# merge across buckets; session-051 option-c).
#
# Arm 1 (node_host Arm H) is the union PRIMARY (unlimited). For the one-time -30d
# backfill the bundled | union truncates at scale, so it MUST be run via
# Settings -> AI Assistant -> Dashboard Data -> Run backfill (the panel
# dispatches each arm as a top-level job — session-054).
#
# Byte-exact gotchas: capture etime=_time BEFORE bin for last/first-seen; the
# error_kind / bucket_label case() exprs are verbatim from SEARCH_NODE_ERRORS /
# SEARCH_EDGE_PERFORMANCE; top-N is applied at READ (store-all-then-top); rfc
# edge_op/edge_perf legitimately yield 0 rows (icm_program/icm_tasks absent on
# sap:abap:gateway) — matches the live empty result; nullable group-by dims
# (host/sourcetype) are never null in our data so no fillnull needed.
#
# Multi-line draft of the node_host HOST-SPLIT (Arm H + Arm S) for maintenance reference:
#   Arm H (host, cheap, no mvexpand):
#   [search `sap_logserv_idx_macro` host=*
#     | eval etime=_time | bin _time span=1h
#     | stats count, min(etime) as min_time, max(etime) as max_time by host, sourcetype, _time
#     | eval scope=host | rename _time as bucket_ts | eval metric="node_host"]
#   Arm S (SAP-fields explode, scoped to SAP events):
#   [search `sap_logserv_idx_macro` (sap_sid=* OR peer_ip=* OR local_ip=* OR client_ip=* OR clientip=*)
#     | eval etime=_time | bin _time span=1h
#     | eval scope=mvdedup(mvappend(sap_sid, peer_ip, local_ip, client_ip, clientip)) | mvexpand scope
#     | stats count, min(etime) as min_time, max(etime) as max_time by scope, host, sourcetype, _time
#     | rename _time as bucket_ts | eval metric="node_host"]
# And ONE edge arm (edge_op http):
#   [search `sap_logserv_idx_macro` sourcetype=sap:webdispatcher:access clientip=* host=* uri=*
#     | bin _time span=1h | stats count by clientip, host, uri, _time | rename _time as bucket_ts
#     | eval source_id=substr(sha1("ip:" . clientip), 1, 16)
#     | eval target_id=substr(sha1("host:" . host), 1, 16)
#     | eval scope=substr(sha1(source_id . ":" . target_id . ":http"), 1, 16)
#     | eval entity=uri, metric="edge_op"]
# ===========================================================================

