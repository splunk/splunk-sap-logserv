ic="uptime", substr(sha1("uptime:" . coalesce(sap_sid,"") . ":" . coalesce(sap_instance,"")), 1, 20), 1==1, substr(sha1(metric . ":" . coalesce(sap_sid,"") . ":" . coalesce(sap_instance,"") . ":" . coalesce(wp_function,"") . ":" . coalesce(wp_category_name,"") . ":" . coalesce(dp_severity,"") . ":" . coalesce(icm_program,"") . ":" . coalesce(icm_request_type,"")), 1, 20)) . ":" . bucket_ts | fields _key, bucket_ts, metric, sap_sid, sap_instance, wp_function, wp_category_name, dp_severity, icm_program, icm_request_type, sourcetype, wp_sub_function, count, sum_tasks, max_tasks, max_mem, uptime_days, uptime_hours | outputlookup append=true logserv_wp_perf_rollup
