# ===========================================================================
# Beaconing detail rollup (build 237). DAY-bucketed gap-stats for the 3 DNS/
# Network-Perimeter streamstats panels. APPROXIMATE (per-day gaps miss the
# midnight-boundary gap) but picker-responsive. 2 metrics:
#   qs    (query, src, day): cnt + n_gap/sum_gap/sumsq_gap (gaps BY query, per
#         day via streamstats by query, day_ts). Serves DNS Beaconing Activity
#         (sum over src), Hosts-to-Beaconing (+ dc(src)), NP Suspicious.
#   denied (src, day): squid 403/TCP_DENIED count -> NP Suspicious append arm.
# DAILY cadence (gaps need a complete day; matches the existing per-day
# logserv_beaconing_rollup). Reads reconstruct avg=Σsum/Σn, var=(Σsumsq-
# Σsum²/Σn)/(Σn-1) over the picked day range.
# ===========================================================================
[logserv_beaconing_detail_aggregate]
search = | union [search `sap_logserv_idx_macro` tag=dns message_type="Query" | fillnull value="(none)" query src | bin _time span=1d as day_ts | streamstats current=f last(_time) as last_time by query, day_ts | eval gap=last_time - _time | stats count as cnt, count(gap) as n_gap, sum(gap) as sum_gap, sum(eval(gap*gap)) as sumsq_gap by query, src, day_ts | eval metric="qs"] [search `sap_logserv_idx_macro` sourcetype="squid:access" (status=403 OR vendor_action="TCP_DENIED") src_ip=* | fillnull value="(none)" src_ip | bin _time span=1d as day_ts | stats count as denied_count by src_ip, day_ts | rename src_ip as src | eval metric="denied"] | eval _key = case(metric="qs", substr(sha1("qs:" . query . ":" . src), 1, 24) . ":" . day_ts, 1==1, substr(sha1("denied:" . src), 1, 24) . ":" . day_ts) | fields _key, day_ts, metric, query, src, cnt, n_gap, sum_gap, sumsq_gap, denied_count | outputlookup append=true logserv_beaconing_detail_rollup
description = Beaconing Detail Aggregation: per-day gap-stats (qs) + proxy-denied counts (denied) into logserv_beaconing_detail_rollup. Powers DNS Beaconing Activity / Hosts-to-Beaconing + Network Perimeter Suspicious Activity (approximate, picker-responsive). Daily cadence (previous complete day).
cron_schedule = 32 0 * * *
dispatch.earliest_time = -1d@d
dispatch.latest_time = @d
enableSched = 1
is_scheduled = 1
is_visible = false
disabled = false
request.ui_dispatch_app = splunk_app_sap_logserv

