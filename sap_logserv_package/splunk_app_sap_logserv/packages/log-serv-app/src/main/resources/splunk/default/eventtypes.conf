# Eventtypes for CIM data-model tagging — Splunk for SAP LogServ
#
# These eventtypes pre-classify events from SAP-specific sourcetypes so they can
# participate in Splunk's standard CIM data models (Authentication, Change,
# Network_Sessions, Web). Each eventtype here is paired with one or more tag
# entries in tags.conf that route the matched events into the right model.
#
# Authored in session 033 / B.2 as part of the v0.1.1 ES-integration work.
# See es_integration/cim_compliance_audit.md for the full design rationale.


# =============================================================================
# Authentication model
# =============================================================================

# HANA CONNECT events (login/logout) and SYSTEM Logins audit category
[sap_hana_authentication]
search = sourcetype="sap:hana:audit" (action_type="CONNECT" OR audit_category="SYSTEM Logins")

# SAP host control authentication events (sapstartsrv / Webmethod / SOAP auth)
[sap_sapstartsrv_authentication]
search = sourcetype="sap:sapstartsrv" is_auth_event="true"

# SAP Cloud Connector access-denied events (the only SCC audit signal that's auth-relevant)
[sap_scc_authentication]
search = sourcetype="sap:scc:audit" scc_audit_type="ACCESS_DENIED"

# Linux sudo events — privilege escalation / privileged-cmd attempts
# Splunk_TA_nix covers `linux_secure` for sudo;  this is for our custom `linux:sudolog`
# sourcetype which Splunk_TA_nix doesn't auto-CIM (build 145, Path B split).
[linux_sudolog_authentication]
search = sourcetype="linux:sudolog"


# =============================================================================
# Change model
# =============================================================================

# HANA DDL / role / privilege management events
[sap_hana_change]
search = sourcetype="sap:hana:audit" (action_type IN ("ALTER USER","CREATE USER","DROP USER","GRANT","REVOKE","CREATE ROLE","DROP ROLE") OR audit_category IN ("User Administration","Permission Grant","User Management","User Creation"))

# SAP Cloud Connector configuration + service-state changes
[sap_scc_change]
search = sourcetype="sap:scc:audit" scc_audit_type IN ("CONFIGURATION_CHANGED","SERVICE_STARTED","SERVICE_STOPPED")


# =============================================================================
# Web model
# =============================================================================

# SAP Web Dispatcher access logs (TLS-terminating front-end)
[sap_webdispatcher_access]
search = sourcetype="sap:webdispatcher:access"

# SAP Cloud Connector HTTP access logs (backend tunneled traffic)
[sap_scc_http_access]
search = sourcetype="sap:scc:http_access"

# SAP ABAP ICM (Internet Communication Manager) HTTP requests
[sap_abap_icm_request]
search = sourcetype="sap:abap:icm" icm_request_type="HTTP_NORMAL"


# =============================================================================
# Network_Sessions model
# =============================================================================

# SAP ABAP gateway connection events (RFC peer/local IP present)
[sap_abap_gateway_session]
search = sourcetype="sap:abap:gateway" peer_ip="*"

# SAP Router connection-tracking events
[sap_saprouter_session]
search = sourcetype="sap:saprouter" is_connection_event="true"


# =============================================================================
# Eventtypes for our own dashboard convenience (not CIM-tagged)
# =============================================================================
# These help our dashboards filter by purpose without re-typing the SPL.

[sap_hana_audit_high_risk]
search = sourcetype="sap:hana:audit" is_critical="true"

[sap_abap_audit_event]
search = sourcetype="sap:abap:audit"


