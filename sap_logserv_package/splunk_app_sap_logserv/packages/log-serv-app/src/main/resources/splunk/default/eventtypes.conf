# --- ISC BIND ---

[isc_bind_query]
search = sourcetype=isc:bind:query
#tags = network resolution dns

[isc_bind_queryerror]
search = sourcetype=isc:bind:queryerror
#tags = network resolution dns

[isc_bind_lameserver]
search = sourcetype=isc:bind:lameserver
#tags = alert

[isc_bind_transfer]
search = sourcetype=isc:bind:transfer
#tags = network resolution dns

# --- Squid Proxy ---

[squid_access]
search = sourcetype=squid:access
#tags = web proxy
