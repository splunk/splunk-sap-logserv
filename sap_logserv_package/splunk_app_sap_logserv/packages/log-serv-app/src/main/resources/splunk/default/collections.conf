# sourcetype; count (by sourcetype) and dc(host) (by host) are separate metrics.
#   total    (sourcetype)+count over ST_ALL -- kpiTotal + sparkTotal +
#            volumeByType + fwTimeline (derived via sourcetype="linux_secure";
#            raw fwTimeline counts ALL linux_secure, not IN_DROP). NO host grain.
#   hosts    (host)+count over ST_ALL -- kpiHosts/sparkHosts (dc(host) only).
#   fw       (fw_action, fw_src, fw_dst, fw_dpt, fw_proto, host)+count over ALL
#            linux_secure (rex from _raw, fillnull all 6) -- IDENTICAL shape to
#            the Network Perimeter "fw" metric. kpiFwDrops/sparkFwDrops read
#            fw_action="IN_DROP"; kpiTopDropSrc/fwTopSources scope all-secure-
#            with-src (NO IN_DROP filter -- latent imprecision REPLICATED);
#            fwTopPorts adds fw_proto!="(none)". NOTE the Linux DataTables key on
#            the RAW field names (fw_src/fw_dpt/fw_proto/Targets/Protocol) -- the
#            reads must NOT apply NP's renames.
#   kernel   (kernel_event)+count over linux_secure (rex "kernel:...]<EVENT>",
#            where isnotnull) -- Kernel Event Types.
#   sapapp   (sap_app, sap_sid)+count over linux_messages_syslog sap_app=*;
#            fillnull sap_sid, read excludes "(none)" (raw drops null-sid). Plain
#            stats fed to a chart (NOT a timechart) -- no fillnull-0 idiom.
#   sapinst  (sap_sid, sap_inst, sap_cid, host)+count over linux_messages_syslog
#            sap_sid=*; fillnull sap_inst/sap_cid/host; read excludes "(none)" on
#            sap_inst AND sap_cid (raw drops null group-by rows), dc(host) guard.
#   oom      (host, oom_proc)+count+max_rss(max oom_rss_kb)+max_vm(max oom_vm_kb)
