# Network Perimeter dashboard rollup (session 052 / build 220). Tier #6
# (KV-Store precompute). The dashboard is a cross-source firewall + proxy + DNS
# synthesis; its 18 aggregatable count/sum/dc panels raw-scan linux_secure
# (rex'd from _raw), squid:access, and isc:bind:query. 7 metrics + 3 RAW
# (kpiBeacon / sparkBeacon / suspicious = per-event streamstats beaconing, NOT
# roll-up-able). Design adversarially reviewed pre-build (3 lenses + synthesis;
# verdict: ship with the 6 null/empty-window refinements applied below).
#   fw       (fw_action, fw_src, fw_dst, fw_dpt, fw_proto, host)+count over ALL
#            linux_secure (rex fw_action/SRC/DST/DPT/PROTO from _raw, fillnull all
#            6 to "(none)"). MERGES the IN_DROP-scoped KPIs (kpiFw/sparkFw/fwProto,
#            read filters fw_action="IN_DROP") with the all-secure-scoped block
#            tables (blockedSrc/blockedPort, NO IN_DROP filter -- a latent
#            dashboard imprecision we REPLICATE, not fix) via fw_action in the
#            grain. blockedPort adds fw_proto!="(none)" (raw stats-by-fw_proto
#            drops null-proto). decode-at-read proto_name. dc/values null-guard.
#   proxy    per-bucket count + denied_count (sum-of-indicator status=403 OR
#            vendor_action="TCP_DENIED") + bytes_sum (sum(bytes_out)) over ALL
#            squid:access -- kpiProxy/kpiDenied/kpiBw + sparks + proxyDenied.
#            (bytes_out=* prefilter is a no-op for sum.)
#   proxydom (url_domain, src_ip)+count+bytes_sum over squid url_domain=*
#            bytes_out=* -- outDomains (sum/sum/dc(src_ip-guard) by url_domain).
#   dnscount per-bucket count over tag=dns message_type="Query" (FULL 73849 scope,
#            incl 21 null-query_type) -- kpiDns/sparkDns. NOT derived from dnstype.
#   dnstype  (query_type)+count over tag=dns message_type="Query" query_type=*
#            -- dnsType (decode-at-read query_type_label).
#   dnsq     (query, src)+count+txt_count+mx_count over tag=dns message_type=
#            "Query" query=* -- queried. query is the SCOPE filter (not a fillnull
#            dim); query_type collapsed into txt/mx sum-measures (cardinality).
#   activity (source_type)+count over (linux_secure OR squid OR (tag=dns
#            message_type=Query)) with the VERBATIM source_type case (match(_raw,
#            "IN_DROP") + sourcetype="isc:bind:query") -- the Activity chart. Kept
#            SEPARATE from fw/dnscount: tag=dns covers isc:bind:query AND
#            :queryerror, so activity's DNS arm is a strictly narrower set than
