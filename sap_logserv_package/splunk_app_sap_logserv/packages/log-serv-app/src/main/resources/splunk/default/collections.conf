# Linux System & Security dashboard rollup (session 052 / build 221). Tier #6
# (KV-Store precompute). The dashboard's 22 count/sum/dc/max/values/avg panels
# raw-scan 7 linux sourcetypes (ST_ALL = linux_messages_syslog / linux:cron /
