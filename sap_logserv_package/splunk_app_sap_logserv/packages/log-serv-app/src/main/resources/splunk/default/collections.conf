field.metric = string
field.host = string
field.count = number
field.sum_bytes = number

accelerated_fields.by_metric_bucket = {"metric": 1, "bucket_ts": 1}

# Web Dispatcher "Slowest Request Traces" rollup (build 236). Per-hour top-20
# webdispatcher events by total_us, with their per-event trace detail. The global
# top-20 over any range is BYTE-EXACT from the union of per-hour top-20s (every
# global-top-20 event is within its own hour's top-20). Replaces a raw
# `| sort 20 - total_us` full-scan of the highest-volume web sourcetype.
# _key = <bucket_ts>:<rank within bucket, 1-20>.
[logserv_webdisp_slowtrace_rollup]
field.bucket_ts = number
field.event_time = number
field.uri = string
field.status = string
field.method = string
field.dt1_us = number
field.dt2_us = number
field.dt3_us = number
field.dt4_us = number
field.total_us = number

accelerated_fields.by_bucket = {"bucket_ts": 1}

# Beaconing detail rollup (build 237 — DNS/Network-Perimeter streamstats panels).
# DAY-bucketed (gaps are computed within each day). APPROXIMATE: per-day gap
# resetting misses the inter-arrival gap that spans each midnight boundary, so
# avg/variance differ slightly from a full-range streamstats — picker-responsive
# was chosen over byte-exact for these 3 rarely-opened forensic tables.
#   qs    grain (query, src, day_ts): cnt (events) + n_gap/sum_gap/sumsq_gap
#         (gaps computed BY query, per day) -> serves DNS Beaconing Activity
#         (sum over src), Hosts-to-Beaconing (sum + dc(src)), and Network
#         Perimeter Suspicious (per query,src then by src). avg=Σsum/Σn,
#         var=(Σsumsq - Σsum²/Σn)/(Σn-1) (Splunk sample-variance form).
#   denied grain (src, day_ts): denied_count -> NP Suspicious proxy-denied arm.
[logserv_beaconing_detail_rollup]
field.day_ts = number
field.metric = string
field.query = string
field.src = string
field.cnt = number
field.n_gap = number
field.sum_gap = number
field.sumsq_gap = number
field.denied_count = number

accelerated_fields.by_metric_day = {"metric": 1, "day_ts": 1}
