###############################################################################
# Splunk App for SAP LogServ — KV Store collection definitions
#
# Currently one collection: per-user named layouts for the Environment Topology
# view (added build 120 / session 024 path A.4).
#
# Records are keyed by `<username>::<slug>` so a single GET on
# /storage/collections/data/logserv_topology_layouts/<key> returns one record.
# Listing a user's layouts uses a filter query on the `username` field.
#
# `nodes_json` and `panels_json` hold the SavedLayout payload as JSON strings
# rather than nested KV Store fields — keeps the schema flat and portable as
# the layout shape evolves (no recurring schema migration when nested fields
# change).
###############################################################################

[logserv_topology_layouts]
field.username = string
field.layout_name = string
field.layout_name_slug = string
field.saved_at = string
field.version = number
field.nodes_json = string
field.panels_json = string
# v4 fields (build 169 / session 028) — restore additional viewport &
# control state on load so a saved layout reproduces the user's session
# more completely. All optional; v3 records read fine with these absent.
field.viewport_json = string
field.enabled_types_json = string
field.selected_node_id = string
field.right_tab_id = string
field.snap_mode = number
# v5 fields (build 215 / session 036) — layout_mode tags which mode
# (force / layered / tree) the layout was saved in. Loading restores
# both the mode + positions.
field.layout_mode = string

# Accelerate by username so listLayouts(username) doesn't full-scan as the
# collection grows across many users. The leading 1 sets ascending order;
# KV Store accelerators don't take advantage of order semantics for equality
# filters, so direction is just convention.
accelerated_fields.by_user = {"username": 1}

###############################################################################
# Per-user per-mode default layout (build 226 / session 037 / Path F).
#
# Each row designates one saved layout as the auto-load default for one
# layout mode (Force / Layered / Tree). When the user opens the topology
# view OR switches to a different mode, the default for that mode (if set)
# auto-loads.
#
# _key = "<username>::<layout_mode>" so a user has at most 3 rows
# (one per mode). Set: POST a fresh record. Clear: DELETE /<key>.
#
# Stored in a separate collection from logserv_topology_layouts to avoid
# the partial-POST replace problem: Splunk KV Store treats POST to /<key>
# as create-or-overwrite (replaces the entire record), so a partial-field
# update on a layouts record would null all other fields. Splitting
# defaults into their own collection means each row is fully self-
# contained — POST with `{username, layout_mode, layout_slug}` replaces
# the whole row idempotently.
###############################################################################

[logserv_topology_layout_defaults]
field.username = string
field.layout_mode = string
field.layout_slug = string

accelerated_fields.by_user = {"username": 1}

###############################################################################
# Per-user active layout mode preference (build 229 / session 037 / Option C
# follow-on to Path F).
#
# Stores which layout mode (force / layered / tree) the user prefers as the
# active mode on first navigation. Cross-browser persistent. localStorage
# `logserv.topology.layoutMode` mirrors this for synchronous fast-mount
# reads (avoids flicker before the async KV Store fetch resolves).
#
# One row per user: _key = <username>, layout_mode = "force"|"layered"|"tree".
# Updated whenever the user switches modes via the LAYOUT dropdown.
###############################################################################

[logserv_topology_active_mode]
field.username = string
field.layout_mode = string

accelerated_fields.by_user = {"username": 1}

###############################################################################
# Per-user per-dashboard auto-refresh interval (build 155 / session 027).
#
# Each record holds one user's chosen refresh cadence for one dashboard.
# DashboardLayout's RefreshProvider reads this on mount; the
# RefreshIntervalPicker writes back when the user changes the dropdown.
#
# _key = "<username>::<dashboard_id>" so a single GET returns one record.
# `dashboard_id` is the URL pathname slug (e.g. "platform-host-details",
# "topology-integration-topology") derived from useLocation() via
# dashboardIdFromPath() — stable per route even when the user-visible
# label changes.
#
# `interval_ms` is the chosen interval in milliseconds. 0 = "Never"
# (no auto-refresh). The supported values are
# {0, 30000, 60000, 300000, 900000, 1800000, 3600000} — matching the
# RefreshIntervalPicker's options.
###############################################################################

[logserv_dashboard_refresh]
field.username = string
field.dashboard_id = string
field.interval_ms = number
field.updated_at = string

# Same accelerator rationale as logserv_topology_layouts: equality-filter
# by username is the dominant access pattern (no list-by-dashboard-id use
# case yet).
accelerated_fields.by_user = {"username": 1}

###############################################################################
# Time-bucketed topology nodes (session 035 / build 188).
#
# Each row is one canonical entity (SID / IP / host / HANA tenant) during one
# hourly bucket. Hour-aligned bucket_ts (epoch seconds, floor(_time / 3600) *
# 3600). Composite _key = "<id>:<bucket_ts>" gives upsert semantics for the
# hourly outputlookup append=true.
#
# `id` is SHA1[:16] of "<canonical_kind>:<canonical_value>" — 64-bit collision
# resistance, plenty for the sub-1000-entity scale we expect per customer.
#
# Populated by the [logserv_topology_aggregate_nodes] saved search (cron
# 5 * * * *). One-time backfill via [logserv_topology_backfill]. Retention
# trimmed to last 30 days via [logserv_topology_retention] daily.
#
# View-side reader: useTopologyData hook fetches via REST KV Store API
# filtered on bucket_ts range (driven by global TimeRangeProvider).
###############################################################################

[logserv_topology_nodes]
field.id = string
field.canonical_kind = string
field.canonical_value = string
field.bucket_ts = number
field.kind = string
field.tag = string
field.label = string
field.event_count = number
field.last_seen = number
field.health_pct = number

# Range queries on bucket_ts are the hot path (time-range picker filter);
# accelerate for sub-second 30-day windows on multi-thousand-row collections.
accelerated_fields.by_bucket_ts = {"bucket_ts": 1}
# Cross-bucket aggregation by entity needs id index too.
accelerated_fields.by_id = {"id": 1}

###############################################################################
# Time-bucketed topology edges (session 035 / build 188).
#
# Each row is one edge between two canonical entities during one hourly
# bucket. Includes pre-computed per-type aggregates (HTTP latency percentiles,
# RFC saturation, HANA op duration) AND canonical SPL filter clauses for
# session-036 right-pane drilldown queries.
#
# `id` is SHA1[:16] of "<source_id>:<target_id>:<type>". `_key` composite =
# "<id>:<bucket_ts>".
#
# Populated by the [logserv_topology_aggregate_edges] saved search (cron
# 5 * * * *) — same schedule as nodes, runs in parallel.
###############################################################################

[logserv_topology_edges]
field.id = string
field.source_id = string
field.target_id = string
field.type = string
field.direction = string
field.bucket_ts = number
field.call_count = number
field.error_count = number
# HANA Tenant-only — first-class warning bucket count (build 224 / session 037)
# Counts events where hana_trace_severity="WARNING" OR (hana_op_duration_ms > 1000
# AND severity not in {ERROR, FATAL}). Replaces the build-211 heuristic that
# moved 25% of clean calls to warning when hanaOpMaxMs > 1000.
field.warning_count = number
# HTTP-only aggregates (null for RFC / HANA Audit / HANA Tenant rows)
field.response_time_p50 = number
field.response_time_p95 = number
field.response_time_max = number
field.bytes_out_sum = number
# RFC-only
field.icm_tasks_max = number
field.icm_tasks_avg = number
# HANA Tenant-only (build 187 hana_op_duration_ms field)
field.hana_op_p95_ms = number
field.hana_op_max_ms = number
# HANA Audit-only
field.auth_success_count = number
field.auth_fail_count = number
# Canonical SPL filter parameters for raw-event drilldown
field.spl_sourcetype = string
field.spl_filter_clauses = string

accelerated_fields.by_bucket_ts = {"bucket_ts": 1}
accelerated_fields.by_id = {"id": 1}
accelerated_fields.by_source = {"source_id": 1}
accelerated_fields.by_target = {"target_id": 1}

###############################################################################
# IP/host -> SID inventory (session 035 / build 188).
#
# Flat collection (NO time bucketing) keyed by canonical_value. Tracks the
# unambiguous mapping from a peer endpoint (IP or hostname) to the SAP
# system identifier (SID) that owns it.
#
# Used by the topology view's edge-rendering layer: a raw-IP target on an
# RFC edge gets retargeted to the resolved SID node when the IP appears in
# this collection (e.g. peer_ip 100.127.255.9 -> XCQ when 100.127.255.9 is
# XCQ's local_ip per the gateway / icm self-attribution data).
#
# Populated by the [logserv_topology_aggregate_inventory] saved search
# running hourly with append=true (upsert). One-time backfill via
# [logserv_topology_backfill_inventory]. No retention sweep in v1 — stale
# inventory entries that no longer reference any active node simply don't
# render.
#
# Same `mvcount(sids)=1` filter as the legacy on-demand SEARCH_INVENTORY:
# only entities with unambiguous single-SID attribution are written.
###############################################################################

[logserv_topology_inventory]
field.canonical_value = string
field.canonical_kind = string
field.resolved_sid = string
field.updated_at = number

# Equality lookup by canonical_value is the dominant access pattern (the
# view fetches all rows and builds an in-memory map, so collection-level
# scan is normal — but having an index speeds up the few cases where the
# scheduled search reads back its own state).
accelerated_fields.by_canonical_value = {"canonical_value": 1}

###############################################################################
# Environment Topology right-pane DETAIL-TAB rollup (session 060 / build 240).
#
# Caches the topology view's per-node / per-edge detail tabs (node Calls/Hr,
# Top Programs, Errors, Hosts; edge Operations, Performance, Errors) — the one
# corner the v0.0.6 dashboard-perf refactor never touched (they dispatched live
# raw `sap_logserv_idx_macro` scans on every node/edge click → slow at scale).
#
# ONE collection, `metric` discriminator (long/narrow — unused dims null per
# row). `scope` = the selected node's canonical label (node_* metrics) OR the
# edge id (edge_* metrics, sha1[:16] of source_id:target_id:type, matching
# logserv_topology_edges.id). Composite _key = "<sha1[:24] of metric+scope+
# dims>:<bucket_ts>". Populated by [logserv_topology_detail_aggregate] (hourly).
#
# Edge Activity reuses logserv_topology_edges (already per-(edge,bucket)); the
# edge Performance headline p50/p95/max also come from the edge row — neither
# needs a metric here. The hana_tenant Performance distribution stores
# sum/n/max of hana_op_duration_ms (Avg+Max at read; percentiles don't merge
# across buckets — session-051 option-c).
###############################################################################

[logserv_topology_detail_rollup]
field.metric = string
field.scope = string
field.bucket_ts = number
field.icm_program = string
field.sourcetype = string
field.error_kind = string
field.host = string
field.entity = string
field.bucket_label = string
field.error_detail = string
field.count = number
field.min_time = number
field.max_time = number
field.sum_dur = number
field.n_dur = number
field.max_dur = number

# Range queries on bucket_ts (the global TimeRange picker + the -24h Calls/Hr
# window) are the hot read path; (metric, scope) narrows to one tab's rows.
accelerated_fields.by_bucket_ts = {"bucket_ts": 1}
accelerated_fields.by_metric_scope = {"metric": 1, "scope": 1}

###############################################################################
# AI Assistant admin-managed settings (session 042 / Option D).
#
# Migrated from the conf-file ai_assistant_settings.conf [defaults] stanza
# to KV Store so sc_subadmin users on locked-down Splunk Cloud Victoria
# deployments (where admin_all_objects is not granted to sc_subadmin) can
# save changes. Splunk's /configs/conf-X/ REST endpoint has a hardcoded
# admin_all_objects capability gate that the metadata.meta ACL cannot
# bypass; KV Store endpoints check only the collection-level ACL.
#
# One row, _key = "defaults". On fresh install the conf-file in default/
# still ships the safe baseline (enabled = false, provider = mock, etc.);
# the React app reads the conf as a fallback when this KV Store row is
# absent and migrates conf-file values into KV Store on first load (so
# customers upgrading from a build that wrote to local/ keep their settings).
#
# Boolean fields use number 0/1 since Splunk KV Store coerces booleans
# inconsistently; the React code parses both forms defensively.
###############################################################################

[logserv_ai_assistant_settings]
field.enabled = number
field.templates_only_mode = number
field.provider = string
field.default_model = string
field.tier = number
field.mcp_required = number
field.mcp_server_url = string
field.rate_limit_per_hour = number
field.tool_calls_per_session_cap = number
field.daily_spend_cap_usd = number
field.tier2_pii_redaction = number
field.tier2_redact_hostnames = number
field.audit_index_name = string
field.audit_forwarder_enabled = number
field.audit_forwarder_url = string
field.audit_forwarder_index = string
field.audit_forwarder_source = string
field.power_user_roles = string
field.updated_at = string

###############################################################################
# AI Assistant per-stanza T&C acknowledgements (session 042 / Option D).
#
# Migrated from the conf-file ai_assistant_acks.conf stanzas to KV Store
# for the same admin_all_objects capability-gate reason as
# logserv_ai_assistant_settings above.
#
# One row per stanza, _key = the stanza name (e.g. "logserv-ai-assistant-tc",
# "logserv-ai-assistant-enable-tc"). Follows Splunk's optInVersion pattern
# verbatim: every interaction (yes OR no) bumps opt_in_version_acknowledged
# to the current opt_in_version declared in the conf-file. Bumping the conf-
# file's optInVersion re-prompts everyone.
#
# Note: KV Store field names use snake_case to match Splunk's convention
# for collection field schemas; the React API surface keeps the camelCase
# (optInVersion / optInVersionAcknowledged / optInChoice / optInChoiceAt)
# from the prior conf-file API for stable callers.
###############################################################################

[logserv_ai_assistant_acks]
field.opt_in_version = number
field.opt_in_version_acknowledged = number
field.opt_in_choice = string
field.opt_in_choice_at = string

###############################################################################
# Work Process Performance dashboard rollup (session 050 / build 206).
#
# Dashboard-perf roadmap tier #6 (KV-Store precompute) — the first dashboard
# rollup, mirroring the Environment Topology KV-Store template. The Work
# Process Performance dashboard is HIGH-VOL and has NO CIM data-model path
# (workprocess / dispatcher / icm are not CIM-tagged), so neither the
# tstats-now (#1) nor CIM-DMA (#4) tiers can accelerate it — KV-Store is the
# only option.
#
# A SINGLE collection serves all the dashboard's aggregatable panels via a
# `metric` discriminator (long/narrow "summary index" shape):
#   metric="wp"  grain (sap_sid, sap_instance, wp_function, wp_category_name)
#                -> Total / Active SIDs / Active Functions KPIs + sparklines,
#                   Category Trend + Distribution, Top Functions, Activity by
#                   SID/Instance. ~66 distinct combos on the sh-idxr dataset.
#   metric="dp"  grain (dp_severity, sap_sid)
#                -> Dispatcher Errors KPI + sparkline, Dispatcher Severity Trend.
#   metric="icm" grain (icm_program, icm_request_type) + task aggregates
#                -> Async RFC Queue Depth trend + Top Programs by Queue Depth.
#                   Only task-bearing (icm_tasks=*) events are rolled up.
# Session 050 cont. — this collection ALSO serves the ABAP Operations dashboard
# (the doc's stated second consumer), via three more metric sub-types + reuse of
# metric="wp" (WP Categories pie) and metric="dp" (Dispatcher Severity, WP
# Errors KPI):
#   metric="abap"      grain (sourcetype, sap_sid) over the 6 ABAP runtime
#                      sourcetypes -> Total / Active SIDs KPIs + sparklines,
#                      Event Volume by Sourcetype, Enqueue Lock Activity,
#                      Activity by SID/Sourcetype.
#   metric="abap_wpfn" grain (wp_function, wp_sub_function) -> Work Process
#                      Functions table (both fields present, matching the raw
#                      `wp_function=* | stats ... by wp_function, wp_sub_function`
#                      which drops null-sub_function events).
#   metric="uptime"    grain (sap_sid, sap_instance) + latest uptime_days /
#                      uptime_hours per bucket -> System Uptime (Latest). Read
#                      reconstructs the overall latest as latest-of-per-bucket.
#
# _key construction is per-metric (see [logserv_wp_perf_aggregate] case() eval):
# wp/dp/icm keep their EXACT build-207 hash formula so re-running the backfill
# after this extension re-upserts them in place (no orphans / double-count on
# upgrade); abap/abap_wpfn/uptime get their own collision-free key scheme.
#
# Hour-aligned bucket_ts (floor(_time/3600)*3600). Composite
# _key = "<sha1[:20] of metric+dims>:<bucket_ts>" gives upsert semantics for the
# hourly outputlookup append=true.
#
# Events without wp_function / wp_category_name (about half lack a function)
# are fillnull'd to "(none)" so the rollup preserves the dashboard's TOTAL
# counts; the read queries exclude "(none)" to reproduce the raw `field=*` /
# dc() semantics exactly.
#
# Populated by [logserv_wp_perf_aggregate] (cron 5 * * * *). One-time backfill
# via [logserv_wp_perf_backfill]. Retention trimmed to last 30 days via
# [logserv_wp_perf_retention] daily. Read by WorkProcessPerformance.tsx via
# `| inputlookup logserv_wp_perf_rollup where metric=... | addinfo | where
# bucket_ts range | stats/timechart` (respects the global TimeRange picker).
###############################################################################

[logserv_wp_perf_rollup]
field.bucket_ts = number
field.metric = string
# metric="wp" / "dp" / "uptime" dims
field.sap_sid = string
field.sap_instance = string
field.wp_function = string
field.wp_category_name = string
# metric="dp" dim
field.dp_severity = string
# metric="icm" dims
field.icm_program = string
field.icm_request_type = string
# metric="abap" / "abap_wpfn" dims (session 050 cont. — ABAP Operations, the
# second dashboard this collection serves). "abap" = (sourcetype, sap_sid) over
# the 6 ABAP runtime sourcetypes; "abap_wpfn" = (wp_function, wp_sub_function).
field.sourcetype = string
field.wp_sub_function = string
# measures (count is shared; task aggregates are icm-only; uptime_* are the
# metric="uptime" latest-per-bucket values for ABAP Operations System Uptime)
field.count = number
field.sum_tasks = number
field.max_tasks = number
field.max_mem = number
field.uptime_days = number
field.uptime_hours = number

# Reads filter `metric=X` then range-scan bucket_ts — a compound accelerator
# over both serves that access pattern directly.
accelerated_fields.by_metric_bucket = {"metric": 1, "bucket_ts": 1}

###############################################################################
# Environment Health cross-cutting error/severity rollup (session 050 cont. /
# build 209). Dashboard-perf tier #6 — the default-landing dashboard's
# cross-cutting error panels today raw-scan all 11 sourcetypes' events. This
# collection precomputes the error CLASSIFICATION once per hour so the panels
# read pre-tagged counts.
#
# The dashboard's error panels use heterogeneous conditions (totalErrors counts
# Windows critical/error/high + scc:audit ACCESS_DENIED; the trend charts use
# Windows high/medium + scc:http_access status>=400 + add saprouter), so a
# SINGLE unified "errors" metric can't be byte-exact for all. Six metric
# sub-types, each precomputing one panel-group's EXACT condition + classification:
#   metric="toterr"   grain (sourcetype, host) -> Total Errors KPI + spark
#                     (the 11-condition set); HANA Failed Ops + Firewall Drops
#                     KPIs derive from it by sourcetype filter.
#   metric="trend"    grain (trend_cat, trend_src) -> the 6 error-trend charts
#                     (ABAP / HANA / Security / Web-Network / OS-Infra /
#                     Cloud-Connector), each event tagged with its category+src.
#   metric="tophost"  grain (host, error_cat) -> Affected Hosts matrix
#                     (its own broader condition + ABAP/HANA/Services/Firewall/
#                     Other categorization).
#   metric="web"      grain (bucket) + web_err / web_total / web_rt_sum /
#                     web_rt_cnt -> Web Error Rate (pct) + Web Response Time
#                     (avg) + sparks. Needs ALL webdispatcher events.
#   metric="icmstat"  grain (status_cat) -> ICM Status Codes chart (2xx/3xx/
#                     4xx/5xx breakdown of icm_status_code).
#   metric="authfail" grain (bucket) -> Auth Failures KPI + spark (sapstartsrv
#                     auth-fail OR hana audit_action=CONNECT failure).
# NOT rolled up: beaconing (streamstats gap analysis) + Recent Critical Events
# (event listing) stay RAW; the 3 Data Pipeline panels stay tstats-now (build
# 200). Fresh collection (no key-stability constraint) -> uniform sha1[:24]
# _key over (metric + all dims). Hourly [logserv_severity_aggregate]; backfill
# [logserv_severity_backfill]; retention [logserv_severity_retention].
###############################################################################

[logserv_severity_rollup]
field.bucket_ts = number
field.metric = string
field.sourcetype = string
field.host = string
# metric="trend" dims
field.trend_cat = string
field.trend_src = string
# metric="tophost" dim
field.error_cat = string
# metric="icmstat" dim
field.status_cat = string
# measures
field.count = number
# metric="web" measures
field.web_err = number
field.web_total = number
field.web_rt_sum = number
field.web_rt_cnt = number

accelerated_fields.by_metric_bucket = {"metric": 1, "bucket_ts": 1}

###############################################################################
# HANA Audit dashboard rollup (session 050 cont. / build 211). Dashboard-perf
# tier #6. The HANA Audit dashboard raw-scans sourcetype="sap:hana:audit"
# (~20,947 events); this collection precomputes hourly rollups. 4 metric
# sub-types + 2 RAW panels (highRiskEvents / afterHoursAdmin — event listings):
#   metric="main"      grain (executing_user, action_type, action_category,
#                      status, risk_level, client_ip, host) + count +
#                      last_seen(max _time). Only ~248 distinct combos. Serves
#                      13 panels: Total/Failures/Users KPIs+sparks, Audit
#                      Category Breakdown, Risk Timeline, Activity by Hour,
#                      Daily Health Score, Failed-by-Host, Top Users, Client IPs.
#   metric="useradmin" grain (admin_action) — User Administration Activity
#                      Timeline (precomputed sql_statement->admin_action case,
#                      filtered to audit_category "HEC Audit - User Administration").
#   metric="security"  grain (event_type) — Security Events Timeline (precomputed
#                      status/action_type->event_type case).
#   metric="password"  grain (password_action, target_user, executing_user,
#                      client_ip) — Password Management table.
#
# CRITICAL null-handling (design-review workflow finding): status is NULL on
# 2,450 events, action_type/host/client_ip on 410, executing_user on 1,105.
# `stats count by ...` DROPS null-dim rows, so the 248-combo/20,947-event fact
# only reproduces if ALL FIVE nullable main dims are fillnull'd to "(none)"
# (executing_user, client_ip, status, host, action_type). action_category +
# risk_level are EVAL fields with a 1==1 terminal branch -> never null -> no
# fillnull. STRICT-failure reads (kpiFailures/sparkFailures/failedByHost/
# topUsers.Failures/clientIps.Failures/healthScore) must use
# `status!="SUCCESSFUL" AND status!="(none)"` (=335), NOT bare !=SUCCESSFUL
# (which would count the 2,450 "(none)" rows). afterHours uses the OPPOSITE
# LOOSE rule `if(status="SUCCESSFUL","Successes","Failures")` so "(none)" -> the
# Failures column (byte-exact with the unmodified raw formula; the strict and
# loose panels legitimately differ by exactly 2,450). dc() reads null-guard the
# sentinel: dc(eval(if(X="(none)",null(),X))) for executing_user AND action_type.
#
# TZ caveat: afterHours strftime(bucket_ts,"%H") and healthScore
# strftime(bucket_ts,"%Y-%m-%d") equal the raw per-event strftime only when the
# aggregate-cron and dashboard-read TZ match and the UTC offset is a whole hour
# (sub-hour offsets like +05:30 can shift the hour/day). Fine on UTC / whole-
# hour-offset deployments (verified 0/20,947 mismatches on sh-idxr).
#
# Fresh collection -> uniform sha1[:24] _key. Hourly [logserv_hana_aggregate];
# backfill [logserv_hana_backfill]; retention [logserv_hana_retention].
###############################################################################

[logserv_hana_category_rollup]
field.bucket_ts = number
field.metric = string
# metric="main" dims
field.executing_user = string
field.action_type = string
field.action_category = string
field.status = string
field.risk_level = string
field.client_ip = string
field.host = string
# precomputed-category dims (useradmin / security / password)
field.admin_action = string
field.event_type = string
field.password_action = string
field.target_user = string
# measures
field.count = number
field.last_seen = number

accelerated_fields.by_metric_bucket = {"metric": 1, "bucket_ts": 1}

###############################################################################
# Change & Configuration Activity dashboard rollup (session 051 / build 212).
# Dashboard-perf tier #6 (KV-Store precompute). The compliance dashboard's
# count-based panels raw-scan a 3-source synthesis (HANA / Windows / Linux)
# with a per-event ENRICH classification (change_source / category / operator /
# is_after_hours). Precompute that classification once/hour here.
#
# 4 metric sub-types via a union:
#   main      (change_source, category, operator, is_after_hours) + count
#             -> Total/After-Hours/Operators KPIs+sparks, Activity-by-Source
