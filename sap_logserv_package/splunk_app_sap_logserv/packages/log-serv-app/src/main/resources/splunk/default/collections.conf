###############################################################################
# Splunk App for SAP LogServ — KV Store collection definitions
#
# Currently one collection: per-user named layouts for the Environment Topology
# view (added build 120 / session 024 path A.4).
#
# Records are keyed by `<username>::<slug>` so a single GET on
# /storage/collections/data/logserv_topology_layouts/<key> returns one record.
# Listing a user's layouts uses a filter query on the `username` field.
#
# `nodes_json` and `panels_json` hold the SavedLayout payload as JSON strings
# rather than nested KV Store fields — keeps the schema flat and portable as
# the layout shape evolves (no recurring schema migration when nested fields
# change).
###############################################################################

[logserv_topology_layouts]
field.username = string
field.layout_name = string
field.layout_name_slug = string
field.saved_at = string
field.version = number
field.nodes_json = string
field.panels_json = string
# v4 fields (build 169 / session 028) — restore additional viewport &
# control state on load so a saved layout reproduces the user's session
# more completely. All optional; v3 records read fine with these absent.
field.viewport_json = string
field.enabled_types_json = string
field.selected_node_id = string
field.right_tab_id = string
field.snap_mode = number
# v5 fields (build 215 / session 036) — layout_mode tags which mode
# (force / layered / tree) the layout was saved in. Loading restores
# both the mode + positions.
field.layout_mode = string

# Accelerate by username so listLayouts(username) doesn't full-scan as the
# collection grows across many users. The leading 1 sets ascending order;
# KV Store accelerators don't take advantage of order semantics for equality
# filters, so direction is just convention.
accelerated_fields.by_user = {"username": 1}

###############################################################################
# Per-user per-mode default layout (build 226 / session 037 / Path F).
#
# Each row designates one saved layout as the auto-load default for one
# layout mode (Force / Layered / Tree). When the user opens the topology
# view OR switches to a different mode, the default for that mode (if set)
# auto-loads.
#
# _key = "<username>::<layout_mode>" so a user has at most 3 rows
# (one per mode). Set: POST a fresh record. Clear: DELETE /<key>.
#
# Stored in a separate collection from logserv_topology_layouts to avoid
# the partial-POST replace problem: Splunk KV Store treats POST to /<key>
# as create-or-overwrite (replaces the entire record), so a partial-field
# update on a layouts record would null all other fields. Splitting
# defaults into their own collection means each row is fully self-
# contained — POST with `{username, layout_mode, layout_slug}` replaces
# the whole row idempotently.
###############################################################################

[logserv_topology_layout_defaults]
field.username = string
field.layout_mode = string
field.layout_slug = string

accelerated_fields.by_user = {"username": 1}

###############################################################################
# Per-user active layout mode preference (build 229 / session 037 / Option C
# follow-on to Path F).
#
# Stores which layout mode (force / layered / tree) the user prefers as the
# active mode on first navigation. Cross-browser persistent. localStorage
# `logserv.topology.layoutMode` mirrors this for synchronous fast-mount
# reads (avoids flicker before the async KV Store fetch resolves).
#
# One row per user: _key = <username>, layout_mode = "force"|"layered"|"tree".
# Updated whenever the user switches modes via the LAYOUT dropdown.
###############################################################################

[logserv_topology_active_mode]
field.username = string
field.layout_mode = string

accelerated_fields.by_user = {"username": 1}

###############################################################################
# Per-user per-dashboard auto-refresh interval (build 155 / session 027).
#
# Each record holds one user's chosen refresh cadence for one dashboard.
# DashboardLayout's RefreshProvider reads this on mount; the
# RefreshIntervalPicker writes back when the user changes the dropdown.
#
# _key = "<username>::<dashboard_id>" so a single GET returns one record.
# `dashboard_id` is the URL pathname slug (e.g. "platform-host-details",
# "topology-integration-topology") derived from useLocation() via
# dashboardIdFromPath() — stable per route even when the user-visible
# label changes.
#
# `interval_ms` is the chosen interval in milliseconds. 0 = "Never"
# (no auto-refresh). The supported values are
# {0, 30000, 60000, 300000, 900000, 1800000, 3600000} — matching the
# RefreshIntervalPicker's options.
###############################################################################

[logserv_dashboard_refresh]
field.username = string
field.dashboard_id = string
field.interval_ms = number
field.updated_at = string

# Same accelerator rationale as logserv_topology_layouts: equality-filter
# by username is the dominant access pattern (no list-by-dashboard-id use
# case yet).
accelerated_fields.by_user = {"username": 1}

###############################################################################
# Time-bucketed topology nodes (session 035 / build 188).
#
# Each row is one canonical entity (SID / IP / host / HANA tenant) during one
# hourly bucket. Hour-aligned bucket_ts (epoch seconds, floor(_time / 3600) *
# 3600). Composite _key = "<id>:<bucket_ts>" gives upsert semantics for the
# hourly outputlookup append=true.
#
# `id` is SHA1[:16] of "<canonical_kind>:<canonical_value>" — 64-bit collision
# resistance, plenty for the sub-1000-entity scale we expect per customer.
#
# Populated by the [logserv_topology_aggregate_nodes] saved search (cron
# 5 * * * *). One-time backfill via [logserv_topology_backfill]. Retention
# trimmed to last 30 days via [logserv_topology_retention] daily.
#
# View-side reader: useTopologyData hook fetches via REST KV Store API
# filtered on bucket_ts range (driven by global TimeRangeProvider).
###############################################################################

[logserv_topology_nodes]
field.id = string
field.canonical_kind = string
field.canonical_value = string
field.bucket_ts = number
field.kind = string
field.tag = string
field.label = string
field.event_count = number
field.last_seen = number
field.health_pct = number

# Range queries on bucket_ts are the hot path (time-range picker filter);
# accelerate for sub-second 30-day windows on multi-thousand-row collections.
accelerated_fields.by_bucket_ts = {"bucket_ts": 1}
# Cross-bucket aggregation by entity needs id index too.
accelerated_fields.by_id = {"id": 1}

###############################################################################
# Time-bucketed topology edges (session 035 / build 188).
#
# Each row is one edge between two canonical entities during one hourly
# bucket. Includes pre-computed per-type aggregates (HTTP latency percentiles,
# RFC saturation, HANA op duration) AND canonical SPL filter clauses for
# session-036 right-pane drilldown queries.
#
# `id` is SHA1[:16] of "<source_id>:<target_id>:<type>". `_key` composite =
# "<id>:<bucket_ts>".
#
# Populated by the [logserv_topology_aggregate_edges] saved search (cron
# 5 * * * *) — same schedule as nodes, runs in parallel.
###############################################################################

[logserv_topology_edges]
field.id = string
field.source_id = string
field.target_id = string
field.type = string
field.direction = string
field.bucket_ts = number
field.call_count = number
field.error_count = number
# HANA Tenant-only — first-class warning bucket count (build 224 / session 037)
# Counts events where hana_trace_severity="WARNING" OR (hana_op_duration_ms > 1000
# AND severity not in {ERROR, FATAL}). Replaces the build-211 heuristic that
# moved 25% of clean calls to warning when hanaOpMaxMs > 1000.
field.warning_count = number
# HTTP-only aggregates (null for RFC / HANA Audit / HANA Tenant rows)
field.response_time_p50 = number
field.response_time_p95 = number
field.response_time_max = number
field.bytes_out_sum = number
# RFC-only
field.icm_tasks_max = number
field.icm_tasks_avg = number
# HANA Tenant-only (build 187 hana_op_duration_ms field)
field.hana_op_p95_ms = number
field.hana_op_max_ms = number
# HANA Audit-only
field.auth_success_count = number
field.auth_fail_count = number
# Canonical SPL filter parameters for raw-event drilldown
field.spl_sourcetype = string
field.spl_filter_clauses = string

accelerated_fields.by_bucket_ts = {"bucket_ts": 1}
accelerated_fields.by_id = {"id": 1}
accelerated_fields.by_source = {"source_id": 1}
accelerated_fields.by_target = {"target_id": 1}

###############################################################################
# IP/host -> SID inventory (session 035 / build 188).
#
# Flat collection (NO time bucketing) keyed by canonical_value. Tracks the
# unambiguous mapping from a peer endpoint (IP or hostname) to the SAP
# system identifier (SID) that owns it.
#
# Used by the topology view's edge-rendering layer: a raw-IP target on an
# RFC edge gets retargeted to the resolved SID node when the IP appears in
# this collection (e.g. peer_ip 100.127.255.9 -> XCQ when 100.127.255.9 is
# XCQ's local_ip per the gateway / icm self-attribution data).
#
# Populated by the [logserv_topology_aggregate_inventory] saved search
# running hourly with append=true (upsert). One-time backfill via
# [logserv_topology_backfill_inventory]. No retention sweep in v1 — stale
# inventory entries that no longer reference any active node simply don't
# render.
#
# Same `mvcount(sids)=1` filter as the legacy on-demand SEARCH_INVENTORY:
# only entities with unambiguous single-SID attribution are written.
###############################################################################

[logserv_topology_inventory]
field.canonical_value = string
field.canonical_kind = string
field.resolved_sid = string
field.updated_at = number

# Equality lookup by canonical_value is the dominant access pattern (the
# view fetches all rows and builds an in-memory map, so collection-level
# scan is normal — but having an index speeds up the few cases where the
# scheduled search reads back its own state).
accelerated_fields.by_canonical_value = {"canonical_value": 1}

###############################################################################
# AI Assistant admin-managed settings (session 042 / Option D).
#
# Migrated from the conf-file ai_assistant_settings.conf [defaults] stanza
# to KV Store so sc_subadmin users on locked-down Splunk Cloud Victoria
# deployments (where admin_all_objects is not granted to sc_subadmin) can
# save changes. Splunk's /configs/conf-X/ REST endpoint has a hardcoded
# admin_all_objects capability gate that the metadata.meta ACL cannot
# bypass; KV Store endpoints check only the collection-level ACL.
#
# One row, _key = "defaults". On fresh install the conf-file in default/
# still ships the safe baseline (enabled = false, provider = mock, etc.);
# the React app reads the conf as a fallback when this KV Store row is
# absent and migrates conf-file values into KV Store on first load (so
# customers upgrading from a build that wrote to local/ keep their settings).
#
# Boolean fields use number 0/1 since Splunk KV Store coerces booleans
# inconsistently; the React code parses both forms defensively.
###############################################################################

[logserv_ai_assistant_settings]
field.enabled = number
field.templates_only_mode = number
field.provider = string
field.default_model = string
field.tier = number
field.mcp_required = number
field.mcp_server_url = string
field.rate_limit_per_hour = number
field.tool_calls_per_session_cap = number
field.daily_spend_cap_usd = number
field.tier2_pii_redaction = number
field.tier2_redact_hostnames = number
field.audit_index_name = string
field.audit_forwarder_enabled = number
field.audit_forwarder_url = string
field.audit_forwarder_index = string
field.audit_forwarder_source = string
field.power_user_roles = string
field.updated_at = string

###############################################################################
# AI Assistant per-stanza T&C acknowledgements (session 042 / Option D).
#
# Migrated from the conf-file ai_assistant_acks.conf stanzas to KV Store
# for the same admin_all_objects capability-gate reason as
# logserv_ai_assistant_settings above.
#
# One row per stanza, _key = the stanza name (e.g. "logserv-ai-assistant-tc",
# "logserv-ai-assistant-enable-tc"). Follows Splunk's optInVersion pattern
# verbatim: every interaction (yes OR no) bumps opt_in_version_acknowledged
# to the current opt_in_version declared in the conf-file. Bumping the conf-
# file's optInVersion re-prompts everyone.
#
# Note: KV Store field names use snake_case to match Splunk's convention
# for collection field schemas; the React API surface keeps the camelCase
# (optInVersion / optInVersionAcknowledged / optInChoice / optInChoiceAt)
# from the prior conf-file API for stable callers.
###############################################################################

[logserv_ai_assistant_acks]
field.opt_in_version = number
field.opt_in_version_acknowledged = number
field.opt_in_choice = string
field.opt_in_choice_at = string
