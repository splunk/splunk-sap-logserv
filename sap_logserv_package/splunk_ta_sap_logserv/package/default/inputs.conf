# SAP LogServ TA - Scripted Inputs
#
# Filter upgrade check: Runs every 10 minutes to detect TA version changes
# and warn the user if their include filter patterns do not cover newly
# supported log types.  The version check is very lightweight (~2ms) on
# runs where the version has not changed; the full comparison only runs
# once per version change.

[script://./bin/logserv_filter_upgrade_check.py]
interval = 600
sourcetype = splunk_ta_sap_logserv:filter_check
index = _internal
disabled = 0
passAuth = splunk-system-user
python.version = python3
python.required = 3.13

# Time filter cutoff refresh: Runs daily to recompute the epoch regex
# used by the TRANSFORMS-based time filter.  The time filter drops events
# with _time older than N days by matching the epoch in the raw JSON.
# Because the cutoff is a static regex (not a dynamic expression), it
# must be refreshed daily to keep the rolling window accurate.
#
# If this input fails to run for a day (or the forwarders miss the server-class
# reload it triggers on a deployment server), the filter keeps an OLDER cutoff
# and becomes LESS restrictive: each missed day lets one more day of events
# older than N days be indexed instead of dropped.  Nothing that should be
# kept is dropped.

[script://./bin/logserv_filter_time_refresh.py]
interval = 86400
sourcetype = splunk_ta_sap_logserv:filter_time_refresh
index = _internal
disabled = 0
passAuth = splunk-system-user
python.version = python3
python.required = 3.13
