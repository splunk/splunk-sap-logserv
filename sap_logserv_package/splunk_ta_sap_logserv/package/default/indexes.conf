[sap_logserv_logs]
homePath   = $SPLUNK_DB/sap_logserv_logs/db
coldPath   = $SPLUNK_DB/sap_logserv_logs/colddb
thawedPath = $SPLUNK_DB/sap_logserv_logs/thaweddb

# AI Assistant audit index (Phase A — added 2026-04-27)
# Holds every AI Assistant action: canned-prompt executions, free-form
# vendor calls, Tier-2 elevations. ~90-day retention is appropriate for
# security review windows; bump frozenTimePeriodInSecs if a customer
# requires longer.
#
# Renamed from `_ai_assistant_audit` → `logserv_ai_assistant_audit` in
# session 041 (2026-05-14) to clear AppInspect Cloud-mode failures
# `check_lower_cased_index_names` (custom-app indexes cannot start with
# an underscore) and `check_indexes_conf_properties` (`maxTotalDataSizeMB`
# is not in the allowed property list — homePath/coldPath/thawedPath/
# frozenTimePeriodInSecs/disabled/datatype/repFactor only). The `logserv_`
# prefix namespaces the index to this app, avoiding collision with any
# other app that may define a generic `ai_assistant_audit` index.
#
# Customers on the prerelease state with existing audit data under
# `_ai_assistant_audit/db` will see that data become orphaned on disk
# after upgrade — not queryable via the new index name. Audit retention
# horizons are typically short so a clean break is acceptable.
[logserv_ai_assistant_audit]
homePath              = $SPLUNK_DB/logserv_ai_assistant_audit/db
coldPath              = $SPLUNK_DB/logserv_ai_assistant_audit/colddb
thawedPath            = $SPLUNK_DB/logserv_ai_assistant_audit/thaweddb
frozenTimePeriodInSecs = 7776000
