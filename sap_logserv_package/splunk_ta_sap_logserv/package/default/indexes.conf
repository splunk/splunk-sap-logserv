[sap_logserv_logs]
homePath   = $SPLUNK_DB/sap_logserv_logs/db
coldPath   = $SPLUNK_DB/sap_logserv_logs/colddb
thawedPath = $SPLUNK_DB/sap_logserv_logs/thaweddb

# AI Assistant audit index (Phase A — added 2026-04-27)
# Holds every AI Assistant action: canned-prompt executions, free-form
# vendor calls, Tier-2 elevations. 90-day retention is appropriate for
# security review windows; bump frozenTimePeriodInSecs if a customer
# requires longer.
#
# Underscore-prefixed name follows Splunk's convention for internal /
# operational indexes (analogous to _internal, _audit). Granted to roles
# with capability `read_ai_assistant_audit` (defined in the LogServ App
# UI app's authorize.conf — to be added in Phase G).
[_ai_assistant_audit]
homePath              = $SPLUNK_DB/_ai_assistant_audit/db
coldPath              = $SPLUNK_DB/_ai_assistant_audit/colddb
thawedPath            = $SPLUNK_DB/_ai_assistant_audit/thaweddb
frozenTimePeriodInSecs = 7776000
maxTotalDataSizeMB     = 5000
