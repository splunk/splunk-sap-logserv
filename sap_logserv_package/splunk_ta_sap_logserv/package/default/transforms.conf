[extract_host]
REGEX = "host":"([^"]+)"
FORMAT = host::$1
DEST_KEY = MetaData:Host

[extract_source]
REGEX = "source":"([^"]+)"
FORMAT = source::$1
DEST_KEY = MetaData:Source

[extract_clzdir]
REGEX = "clz_dir":"([^"]+)"
FORMAT = clz_dir::$1
WRITE_META = true

[extract_clzsubdir]
REGEX = "clz_subdir":"([^"]+)"
FORMAT = clz_subdir::$1
WRITE_META = true

[set_srctype_hana_audit]
REGEX = "clz_subdir":"hanaaudit"
FORMAT = sourcetype::sap_hana_audit
DEST_KEY = MetaData:Sourcetype

# Extract metadata for analysis (no index routing)
[system_id_metadata]
REGEX = ;([A-Z]{3});
FORMAT = sap_system::$1
DEST_KEY = _meta

# Mark critical events in metadata
[critical_event_metadata]
REGEX = ;CRITICAL;
FORMAT = event_priority::critical
DEST_KEY = _meta

# Mark failed authentication events  
[failed_auth_metadata]
REGEX = ;UNSUCCESSFUL;|authentication failed
FORMAT = event_type::failed_auth
DEST_KEY = _meta

# Filter out non-audit entries
[drop_non_audit]
REGEX = (?!.*HDB_.*\[.*\]:.*;\w+;)
DEST_KEY = queue
FORMAT = nullQueue

# Normalize common user actions
[normalize_user_actions]
REGEX = (alter user|create user|drop user|grant|revoke)
FORMAT = db_action::$1
DEST_KEY = _meta

# Extract change management information
[change_management_extraction]
REGEX = CAM_CHANGE
FORMAT = change_type::CAM_CHANGE
DEST_KEY = _meta

# Host extraction from source path
[host_from_path]
REGEX = host.*?(hec\w+)
FORMAT = extracted_host::$1
DEST_KEY = _meta




[set_srctype_sap_webdisp_access]
REGEX = "source":"[^"]*log/http_access_log
FORMAT = sourcetype::sap_webdispatcher_access
DEST_KEY = MetaData:Sourcetype

[set_srctype_for_linux_messages_syslog]
REGEX = "source":"\/var\/log\/(messages|localmessages)"
FORMAT = sourcetype::linux_messages_syslog
DEST_KEY = MetaData:Sourcetype

[set_srctype_for_syslog]
REGEX = "source":"\/var\/log\/(cron|warn|sudolog|pacemaker\/pacemaker.log)"
FORMAT = sourcetype::syslog
DEST_KEY = MetaData:Sourcetype

[set_srctype_for_linux_secure]
REGEX = "source":"\/var\/log\/(firewall|kernel|sssd\/sssd\.log)"
FORMAT = sourcetype::linux_secure
DEST_KEY = MetaData:Sourcetype

[set_srctype_for_isc_bind_query]
REGEX = "source":"\/var\/lib\/named\/log\/named\/(default\.log|queries\.log)"
FORMAT = sourcetype::isc:bind:query
DEST_KEY = MetaData:Sourcetype

#TO DO is it necessary?
[set_srctype_if_varlognamed_wildcard]
REGEX = "source":"\/var\/log\/named\/ \*\.log"
FORMAT = sourcetype::isc:bind:query
DEST_KEY = MetaData:Sourcetype

[set_srctype_for_squid_access]
REGEX = "source":"\/var\/log\/squid\/(access\.log|cache\.log|store\.log)"
FORMAT = sourcetype::squid:access
DEST_KEY = MetaData:Sourcetype

# NO logs available for sourcetypes below YET
[set_srctype_if_varlognamed_lameservers]
REGEX = "source":"\/var\/log\/named\/lame-servers.log"
FORMAT = sourcetype::isc:bind:lameserver
DEST_KEY = MetaData:Sourcetype

[set_srctype_if_varlognamed_network]
REGEX = "source":"\/var\/log\/named\/network.log"
FORMAT = sourcetype::isc:bind:network
DEST_KEY = MetaData:Sourcetype

[set_srctype_if_varlognamed_notify]
REGEX = "source":"\/var\/log\/named\/notify.log"
FORMAT = sourcetype::isc:bind:transfer
DEST_KEY = MetaData:Sourcetype

[set_srctype_lastlog]
REGEX = "source":"\/lastlog"
FORMAT = sourcetype::lastlog
DEST_KEY = MetaData:Sourcetype

[set_srctype_who]
REGEX = "source":"\/who"
FORMAT = sourcetype::who
DEST_KEY = MetaData:Sourcetype


