[extract_host]
REGEX = "host":"([^"]+)"
FORMAT = host::$1
DEST_KEY = MetaData:Host

[extract_source]
REGEX = "source":"([^"]+)"
FORMAT = source::$1
DEST_KEY = MetaData:Source

[extract_clzdir]
REGEX = "clz_dir":"([^"]+)"
FORMAT = clz_dir::$1
WRITE_META = true

[extract_clzsubdir]
REGEX = "clz_subdir":"([^"]+)"
FORMAT = clz_subdir::$1
WRITE_META = true

[set_srctype_if_varlog_cron]
REGEX = "source":"\/var\/log\/cron"
FORMAT = sourcetype::syslog
DEST_KEY = MetaData:Sourcetype

[set_srctype_if_varlog_msgs]
REGEX = "source":"\/var\/log\/messages"
FORMAT = sourcetype::linux_messages_syslog
DEST_KEY = MetaData:Sourcetype

[set_srctype_if_varlog_localmsgs]
REGEX = "source":"\/var\/log\/localmessages"
FORMAT = sourcetype::linux_messages_syslog
DEST_KEY = MetaData:Sourcetype

[set_srctype_if_varlog_warn]
REGEX = "source":"\/var\/log\/warn"
FORMAT = sourcetype::syslog
DEST_KEY = MetaData:Sourcetype

[set_srctype_if_varlog_sudo]
REGEX = "source":"\/var\/log\/sudolog"
FORMAT = sourcetype::syslog
DEST_KEY = MetaData:Sourcetype

[set_srctype_if_varlog_firewall]
REGEX = "source":"\/var\/log\/firewall"
FORMAT = sourcetype::linux_secure
DEST_KEY = MetaData:Sourcetype

[set_srctype_if_varlog_kernel]
REGEX = "source":"\/var\/log\/kernel"
FORMAT = sourcetype::linux_secure
DEST_KEY = MetaData:Sourcetype

[set_srctype_if_varlog_sssd]
REGEX = "source":"\/var\/log\/sssd"
