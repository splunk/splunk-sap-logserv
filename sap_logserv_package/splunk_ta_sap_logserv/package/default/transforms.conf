[set_srctype_if_varlibnamed_default]
REGEX = "source":"\/var\/lib\/named\/log\/named\/default.log"
FORMAT = sourcetype::isc:bind:query
DEST_KEY = MetaData:Sourcetype

[set_srctype_if_varlibnamed_queries]
REGEX = "source":"\/var\/lib\/named\/log\/named\/queries.log"
FORMAT = sourcetype::isc:bind:query
DEST_KEY = MetaData:Sourcetype

[set_srctype_if_varlogsquid_access]
REGEX = "source":"\/var\/log\/squid\/access.log"
FORMAT = sourcetype::squid:access
DEST_KEY = MetaData:Sourcetype

[set_srctype_if_varlogsquid_cache]
REGEX = "source":"\/var\/log\/squid\/cache.log"
