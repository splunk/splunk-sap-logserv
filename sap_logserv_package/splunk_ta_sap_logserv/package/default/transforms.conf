# =============================================================================
# SAP LogServ TA - transforms.conf
#
# @logserv_filter annotations declare the clz_dir/clz_subdir values that
# each sourcetype routing transform handles.  These annotations are used by
# the filter upgrade check (logserv_filter_upgrade_check.py) to detect when
# a TA upgrade adds support for new log types that the user's include filter
# patterns do not cover.
#
# IMPORTANT: When adding a new sourcetype routing transform, always add a
# @logserv_filter annotation comment on the line immediately above the
# stanza header.  Format:
#     # @logserv_filter: <clz_dir>/<clz_subdir>, <clz_dir>/<clz_subdir>, ...
#
# The one exception is a stanza that routes only events WITHOUT folder fields
# (set_srctype_hana_tracelogs_by_source): it handles no clz_dir/clz_subdir
# value, so it carries no annotation - see the comment above that stanza.
#
# TODO: Verify all clz_dir/clz_subdir values below against your actual
#       SAP LogServ S3 bucket structure.  The values shown are best-guess
#       placeholders derived from the source path patterns in the REGEX.
# =============================================================================


# ---------------------------------------------------------------------------
# Metadata extraction (not sourcetype routing — no @logserv_filter needed)
#
# LOOKAHEAD = 100000 (= TRUNCATE in props.conf) on every metadata and routing
# stanza. The AWS envelope puts "_raw" first (_raw, _time, host, source,
# clzfilename, clz_dir, clz_subdir), so with the default 4096-character window
# an event longer than about 4 KB kept the input's own host and source, got no
# clz_dir / clz_subdir and stayed sap_logserv_logs (every Data TA build up to
# the 0.1.2 build of 2026-10-13). Each REGEX here is one literal key, a linear
# scan at any window; JSON escaping puts a backslash before every quote inside
# "_raw", so the event text cannot match an envelope key.
# ---------------------------------------------------------------------------

[extract_host]
REGEX = "host":"([^"]+)"
FORMAT = host::$1
DEST_KEY = MetaData:Host
LOOKAHEAD = 100000

[extract_source]
REGEX = "source":"([^"]+)"
FORMAT = source::$1
DEST_KEY = MetaData:Source
LOOKAHEAD = 100000

[extract_clz]
REGEX = "(clz_dir|clz_subdir)":"([^"]+)"
REPEAT_MATCH = true
FORMAT = $1::$2
WRITE_META = true
LOOKAHEAD = 100000


# ---------------------------------------------------------------------------
# Sourcetype routing transforms
#
# Each transform below routes events to a specific sourcetype based on
# patterns in the raw NDJSON.  The @logserv_filter annotation above each
# declares which clz_dir/clz_subdir values that transform handles.
# Every stanza sets LOOKAHEAD = 100000 (see Metadata extraction above). A route
# keyed on ONE literal ("clz_subdir":"x" or "source":"...") scans linearly at
# that window. A route that needs BOTH folder fields uses the filter
# generator's shape, byte-equal to the Include Filters REGEX of its folder
# (fnmatch_patterns_to_combined_regex in splunk_ta_sap_logserv_filter_utils.py):
#   (?:^|"_raw"\s*:\s*"(?:[^"\\]++|\\.)*+")  start at the line start or just
#       after the "_raw" value (possessive: no backtracking into the text);
#   (?=(?:(?!"_raw")[^\n])*?"clz_dir"\s*:\s*"X")  one condition per key, in
#       any key order, never crossing a "_raw" key.
# Never pair the older (?s)^(?=.*A)(?=.*B) shape with LOOKAHEAD = 100000: on
# lines near 100,000 characters it exceeds MATCH_LIMIT (developer reference,
# "Why this shape - Splunk PCRE probes"). Builds of 2026-10-13 and earlier
# used that shape with the default 4096 window.
# ---------------------------------------------------------------------------

# @logserv_filter: hana/hanaaudit
[set_srctype_hana_audit]
REGEX = "clz_subdir":"hanaaudit"
FORMAT = sourcetype::sap:hana:audit
DEST_KEY = MetaData:Sourcetype
LOOKAHEAD = 100000

# @logserv_filter: webdispatcher/accesslog
[set_srctype_sap_webdisp_access]
REGEX = "source":"[^"]*log/http_access_log
FORMAT = sourcetype::sap:webdispatcher:access
DEST_KEY = MetaData:Sourcetype
LOOKAHEAD = 100000

# linux/proxy: real GCP LogServ data files the proxy VM's /var/log/messages under it (session 140).
# @logserv_filter: linux/messages, linux/localmessages, linux/proxy
[set_srctype_for_linux_messages_syslog]
REGEX = "source":"\/var\/log\/(messages|localmessages)"
FORMAT = sourcetype::linux_messages_syslog
DEST_KEY = MetaData:Sourcetype
LOOKAHEAD = 100000

# Path B (Splunkbase precert) — split the legacy [set_srctype_for_syslog]
# stanza into per-log-type sourcetypes so we no longer override Splunk's
# pretrained `syslog` sourcetype (was triggering AppInspect's
# pretrained-sourcetype warning + risking field-extraction collisions
# with Splunk_TA_nix's [syslog] stanza in customer environments).

# @logserv_filter: linux/cron
[set_srctype_for_linux_cron]
REGEX = "source":"\/var\/log\/cron"
FORMAT = sourcetype::linux:cron
DEST_KEY = MetaData:Sourcetype
LOOKAHEAD = 100000

# @logserv_filter: linux/warn
[set_srctype_for_linux_warn]
REGEX = "source":"\/var\/log\/warn"
FORMAT = sourcetype::linux:warn
DEST_KEY = MetaData:Sourcetype
LOOKAHEAD = 100000

# @logserv_filter: linux/sudolog
[set_srctype_for_linux_sudolog]
REGEX = "source":"\/var\/log\/sudolog"
FORMAT = sourcetype::linux:sudolog
DEST_KEY = MetaData:Sourcetype
LOOKAHEAD = 100000

# Routes both /var/log/slapd.log (OpenLDAP) and /var/log/pacemaker/pacemaker.log
# (HA cluster manager). Earlier documentation placed both under linux/slapd; in real
# GCP LogServ data pacemaker.log arrives under linux/pacemaker (session 140), so both
# paths are annotated.
# @logserv_filter: linux/slapd, linux/pacemaker
[set_srctype_for_linux_slapd]
REGEX = "source":"\/var\/log\/(pacemaker\/pacemaker\.log|slapd\.log)"
FORMAT = sourcetype::linux:slapd
DEST_KEY = MetaData:Sourcetype
LOOKAHEAD = 100000

# [^"]* keeps the sssd file name inside the source value; with the 100000 window, .* ran on into the
# event text (see the note above the BIND routes).
# @logserv_filter: linux/linux_secure
[set_srctype_for_linux_secure]
REGEX = "source":"\/var\/log\/(firewall|kernel|sssd\/sssd([^"]*))"
FORMAT = sourcetype::linux_secure
DEST_KEY = MetaData:Sourcetype
LOOKAHEAD = 100000

# The four BIND routes (this one and the three set_srctype_if_varlognamed_* below) match a path
# segment with [^\/"]: a segment never crosses the source value's closing quote. With the
# 100000 window, [^\/] let the segment loop run on through the rest of the line - one nested
# PCRE frame per slash (DEPTH_LIMIT 1000) - and could take a path at the end of "_raw" for the
# source. For the same reason xfer*.log is xfer([^"]*)\.log, not xfer(.*)\.log.
# @logserv_filter: dns/binddns
[set_srctype_for_isc_bind_query]
REGEX = "source":"\/var\/(?:[^\/"]+\/)*named\/(default\.log|queries\.log)"
FORMAT = sourcetype::isc:bind:query
DEST_KEY = MetaData:Sourcetype
LOOKAHEAD = 100000

# The three Squid files share the proxy/squid path but hold different records: access.log
# the requests (squid:access), cache.log the daemon's own log (squid:cache) and store.log
# the object-store journal (squid:store). Their own sourcetypes keep the non-request lines
# out of the request data (CIM Web tagging, proxy metrics). The three REGEXes are the
# branches of the former single alternation, so together they match the same events.
# Real LogServ data files Squid under two paths: proxy/squid (the AWS bucket - folder and
# NDJSON clz fields) and linux/proxy (Azure), so all three annotate both (session 140).
# @logserv_filter: proxy/squid, linux/proxy
[set_srctype_for_squid_access]
REGEX = "source":"\/var\/log\/squid\/access\.log"
FORMAT = sourcetype::squid:access
DEST_KEY = MetaData:Sourcetype
LOOKAHEAD = 100000

# @logserv_filter: proxy/squid, linux/proxy
[set_srctype_for_squid_cache]
REGEX = "source":"\/var\/log\/squid\/cache\.log"
FORMAT = sourcetype::squid:cache
DEST_KEY = MetaData:Sourcetype
LOOKAHEAD = 100000

# @logserv_filter: proxy/squid, linux/proxy
[set_srctype_for_squid_store]
REGEX = "source":"\/var\/log\/squid\/store\.log"
FORMAT = sourcetype::squid:store
DEST_KEY = MetaData:Sourcetype
LOOKAHEAD = 100000

# @logserv_filter: dns/binddns
[set_srctype_if_varlognamed_lameservers]
REGEX = "source":"\/var\/(?:[^\/"]+\/)*named\/lame-servers\.log"
FORMAT = sourcetype::isc:bind:lameserver
DEST_KEY = MetaData:Sourcetype
LOOKAHEAD = 100000

# @logserv_filter: dns/binddns
[set_srctype_if_varlognamed_network]
REGEX = "source":"\/var\/(?:[^\/"]+\/)*named\/(network\.log|general\.log|resolver\.log)"
FORMAT = sourcetype::isc:bind:network
DEST_KEY = MetaData:Sourcetype
LOOKAHEAD = 100000

# @logserv_filter: dns/binddns
[set_srctype_if_varlognamed_notify]
REGEX = "source":"\/var\/(?:[^\/"]+\/)*named\/(notify\.log|update\.log|xfer([^"]*)\.log)"
FORMAT = sourcetype::isc:bind:transfer
DEST_KEY = MetaData:Sourcetype
LOOKAHEAD = 100000

# @logserv_filter: linux/linux_secure
[set_srctype_lastlog]
REGEX = "source":"(\/lastlog|lastlog)"
FORMAT = sourcetype::lastlog
DEST_KEY = MetaData:Sourcetype
LOOKAHEAD = 100000

# @logserv_filter: linux/linux_secure
[set_srctype_who]
REGEX = "source":"(\/who|who)"
FORMAT = sourcetype::who
DEST_KEY = MetaData:Sourcetype
LOOKAHEAD = 100000

# [^"]* keeps the channel name inside the source value (see the note above the BIND routes).
# @logserv_filter: windows/WinEventLog:Application, windows/WinEventLog:Powershell, windows/WinEventLog:Security, windows/WinEventLog:System
[set_srctype_xmlwineventlog]
REGEX = "source":"WinEventLog([^"]*)"
FORMAT = sourcetype::XmlWinEventLog
DEST_KEY = MetaData:Sourcetype
LOOKAHEAD = 100000


# ---------------------------------------------------------------------------
# ABAP sourcetype routing transforms
# ---------------------------------------------------------------------------

# @logserv_filter: abap/audit
[set_srctype_abap_audit]
REGEX = (?:^|"_raw"\s*:\s*"(?:[^"\\]++|\\.)*+")(?:(?=(?:(?!"_raw")[^\n])*?"clz_dir"\s*:\s*"abap")(?=(?:(?!"_raw")[^\n])*?"clz_subdir"\s*:\s*"audit"))
FORMAT = sourcetype::sap:abap:audit
DEST_KEY = MetaData:Sourcetype
LOOKAHEAD = 100000

# @logserv_filter: abap/dispatcher
[set_srctype_abap_dispatcher]
REGEX = "clz_subdir":"dispatcher"
FORMAT = sourcetype::sap:abap:dispatcher
DEST_KEY = MetaData:Sourcetype
LOOKAHEAD = 100000

# @logserv_filter: abap/enqueueserver
[set_srctype_abap_enqueueserver]
REGEX = "clz_subdir":"enqueueserver"
FORMAT = sourcetype::sap:abap:enqueueserver
DEST_KEY = MetaData:Sourcetype
LOOKAHEAD = 100000

# @logserv_filter: abap/event
[set_srctype_abap_event]
REGEX = "clz_subdir":"event"
FORMAT = sourcetype::sap:abap:event
DEST_KEY = MetaData:Sourcetype
LOOKAHEAD = 100000

# @logserv_filter: abap/gateway
[set_srctype_abap_gateway]
REGEX = "clz_subdir":"gateway"
FORMAT = sourcetype::sap:abap:gateway
DEST_KEY = MetaData:Sourcetype
LOOKAHEAD = 100000

# Keyed on both folder fields (decision #11 of the App build 378 review): the
# ABAP ICM trace only. Builds of 2026-10-13 and earlier took every folder named
# icm, so the Web Dispatcher's own ICM trace (webdispatcher/icm, a Secondary
# folder of the SAP LogServ service description, not seen in real deliveries)
# became sap:abap:icm; it now keeps sap_logserv_logs like the other Secondary
# folders.
# @logserv_filter: abap/icm
[set_srctype_abap_icm]
REGEX = (?:^|"_raw"\s*:\s*"(?:[^"\\]++|\\.)*+")(?:(?=(?:(?!"_raw")[^\n])*?"clz_dir"\s*:\s*"abap")(?=(?:(?!"_raw")[^\n])*?"clz_subdir"\s*:\s*"icm"))
FORMAT = sourcetype::sap:abap:icm
DEST_KEY = MetaData:Sourcetype
LOOKAHEAD = 100000

# @logserv_filter: abap/messageserver
[set_srctype_abap_messageserver]
REGEX = "clz_subdir":"messageserver"
FORMAT = sourcetype::sap:abap:messageserver
DEST_KEY = MetaData:Sourcetype
LOOKAHEAD = 100000

# @logserv_filter: abap/sapstartsrv
[set_srctype_abap_sapstartsrv]
REGEX = (?:^|"_raw"\s*:\s*"(?:[^"\\]++|\\.)*+")(?:(?=(?:(?!"_raw")[^\n])*?"clz_dir"\s*:\s*"abap")(?=(?:(?!"_raw")[^\n])*?"clz_subdir"\s*:\s*"sapstartsrv"))
FORMAT = sourcetype::sap:abap:sapstartsrv
DEST_KEY = MetaData:Sourcetype
LOOKAHEAD = 100000

# @logserv_filter: abap/workprocess
[set_srctype_abap_workprocess]
REGEX = "clz_subdir":"workprocess"
FORMAT = sourcetype::sap:abap:workprocess
DEST_KEY = MetaData:Sourcetype
LOOKAHEAD = 100000


# ---------------------------------------------------------------------------
# HANA tracelogs sourcetype routing transform
# ---------------------------------------------------------------------------

# @logserv_filter: hana/tracelogs
[set_srctype_hana_tracelogs]
REGEX = (?:^|"_raw"\s*:\s*"(?:[^"\\]++|\\.)*+")(?:(?=(?:(?!"_raw")[^\n])*?"clz_dir"\s*:\s*"hana")(?=(?:(?!"_raw")[^\n])*?"clz_subdir"\s*:\s*"tracelogs"))
FORMAT = sourcetype::sap:hana:tracelogs
DEST_KEY = MetaData:Sourcetype
LOOKAHEAD = 100000

# Real Azure SAP LogServ deliveries send the HANA trace directory WITHOUT folder fields: SAP
# files those blobs under clzlogserv/undefined/undefined/YYYY/MM/DD and the events carry
# no clz_dir / clz_subdir value (session 154: 565,776 events of one HANA system in 16 files -
# the .trc files and backup.log in /usr/sap/<SID>/HDB<nn>/<host>/trace/ and trace/DB_<tenant>/).
# set_srctype_hana_tracelogs above keys on the folder fields, so they stayed sap_logserv_logs.
# This stanza routes them by the envelope's "source" path, and only when the envelope has no
# "clz_subdir" key (the leading negative lookahead): an envelope that carries folder fields is
# left to the folder routes. Other files in a trace directory keep sap_logserv_logs.
# The guard tests for the key, not its value: an envelope written with an empty or null
# clz_subdir is not routed. The index shows only that these events had no non-empty folder
# value; that their envelopes have no clz_subdir key at all is still to be confirmed on one
# raw undefined/undefined blob (open since session 154).
# LOOKAHEAD = 100000, the window [extract_source] reads, so an event is routed here only when
# its indexed source holds the path the App reads the SID, instance, host and tenant from.
# Both conditions walk the line from its start over whole tokens - a run of non-quote
# characters, the "_raw" key with its whole value (skipped possessively, as set_raw_only does),
# or one quote - inside an atomic group, so each looks at every envelope key outside "_raw"
# (either side of it) and never into the event text, and the walk is linear in the line.
# Builds of 2026-10-13 and earlier scanned the line character by character with the default
# 4096 window; at 100,000 characters that form exceeds MATCH_LIMIT, so the shape changed with
# the window and the matches did not. The route also accepts spaces around the colon, which
# [extract_source] does not; no real envelope has them.
# These events have no folder, so Include Filters / Exclude Filters cannot reach them; only
# Include Sources / Exclude Sources can (for example /usr/sap/*/HDB??/*/trace/*).
# No filter annotation on purpose: an annotation declares the folders a stanza handles, and
# this one handles none - the upgrade check, the AWS S3 Direct folder list and the App's
# sourcetype-to-folder map stay as the annotation above declares them.
[set_srctype_hana_tracelogs_by_source]
REGEX = ^(?!(?>[^"]+|"_raw"\s*:\s*"(?:[^"\\]++|\\.)*+"|")*?"clz_subdir"\s*:)(?=(?>[^"]+|"_raw"\s*:\s*"(?:[^"\\]++|\\.)*+"|")*?"source"\s*:\s*"\/usr\/sap\/[A-Z0-9]{3}\/HDB\d{2}\/[^"\/]+\/trace\/(?:DB_[^"\/]+\/)?(?:[^"\/]+\.trc|backup\.log)")
FORMAT = sourcetype::sap:hana:tracelogs
DEST_KEY = MetaData:Sourcetype
LOOKAHEAD = 100000


# ---------------------------------------------------------------------------
# SCC sourcetype routing transforms
# ---------------------------------------------------------------------------

# @logserv_filter: scc/audit
[set_srctype_scc_audit]
REGEX = (?:^|"_raw"\s*:\s*"(?:[^"\\]++|\\.)*+")(?:(?=(?:(?!"_raw")[^\n])*?"clz_dir"\s*:\s*"scc")(?=(?:(?!"_raw")[^\n])*?"clz_subdir"\s*:\s*"audit"))
FORMAT = sourcetype::sap:scc:audit
DEST_KEY = MetaData:Sourcetype
LOOKAHEAD = 100000

# @logserv_filter: scc/tracelogs
[set_srctype_scc_http_access]
REGEX = (?:^|"_raw"\s*:\s*"(?:[^"\\]++|\\.)*+")(?:(?=(?:(?!"_raw")[^\n])*?"clz_dir"\s*:\s*"scc")(?=(?:(?!"_raw")[^\n])*?"clz_subdir"\s*:\s*"tracelogs"))
FORMAT = sourcetype::sap:scc:http_access
DEST_KEY = MetaData:Sourcetype
LOOKAHEAD = 100000


# ---------------------------------------------------------------------------
# SAP service sourcetype routing transforms (sap/*)
# ---------------------------------------------------------------------------

# @logserv_filter: sap/sapstartsrv
[set_srctype_sap_sapstartsrv]
REGEX = (?:^|"_raw"\s*:\s*"(?:[^"\\]++|\\.)*+")(?:(?=(?:(?!"_raw")[^\n])*?"clz_dir"\s*:\s*"sap")(?=(?:(?!"_raw")[^\n])*?"clz_subdir"\s*:\s*"sapstartsrv"))
FORMAT = sourcetype::sap:sapstartsrv
DEST_KEY = MetaData:Sourcetype
LOOKAHEAD = 100000

# @logserv_filter: sap/saphostexec
[set_srctype_sap_saphostexec]
REGEX = "clz_subdir":"saphostexec"
FORMAT = sourcetype::sap:saphostexec
DEST_KEY = MetaData:Sourcetype
LOOKAHEAD = 100000

# @logserv_filter: sap/saprouter
[set_srctype_sap_saprouter]
REGEX = "clz_subdir":"saprouter"
FORMAT = sourcetype::sap:saprouter
DEST_KEY = MetaData:Sourcetype
LOOKAHEAD = 100000


# ---------------------------------------------------------------------------
# sap:hana:audit field extraction transforms (not sourcetype routing)
# ---------------------------------------------------------------------------

[system_id_metadata]
REGEX = ;([A-Z]{3});
FORMAT = sap_system::$1

[critical_event_metadata]
REGEX = ;CRITICAL;
FORMAT = event_priority::critical

[failed_auth_metadata]
REGEX = ;UNSUCCESSFUL;|authentication failed
FORMAT = event_type::failed_auth

[normalize_user_actions]
REGEX = (alter user|create user|drop user|grant|revoke)
FORMAT = db_action::$1

[change_management_extraction]
REGEX = CAM_CHANGE
FORMAT = change_type::CAM_CHANGE

[host_from_path]
REGEX = host.*?(hec\w+)
FORMAT = extracted_host::$1


# ---------------------------------------------------------------------------
# Raw content extraction (final pipeline step)
# ---------------------------------------------------------------------------

[set_raw_only]
# Possessive quantifiers: the plain form "_raw":"((?:[^"\\]|\\.)*)" nests one PCRE
# backtracking frame per character and exceeds DEPTH_LIMIT (1000) on long lines,
# which leaves the whole NDJSON envelope on the event. Same matches, bounded depth.
REGEX = "_raw":"((?:[^"\\]++|\\.)*+)"
FORMAT = $1
DEST_KEY = _raw
# Search the whole line (default 4096): a "_raw" value that closes past character
# 4096 is otherwise never matched. Matches TRUNCATE in props.conf.
LOOKAHEAD = 100000


# ---------------------------------------------------------------------------
# Index-time vendor + cloud-provider attribution (WRITE_META indexed fields)
# ---------------------------------------------------------------------------
# These stamps add indexed metadata fields to every sap_logserv_logs event,
# using the same WRITE_META mechanism as [extract_clz] above.  They are
# referenced from [sap_logserv_logs] in props.conf (TRANSFORMS-50 splunk_solution,
# TRANSFORMS-51 cloud_provider).

# splunk_solution: ALWAYS stamped with the constant solution identifier.
# Static (no UI control) — ships active in default/.  REGEX = . matches any
# non-empty event, so every routed event carries
# splunk_solution=splunk_for_sap_logserv.
#
# Field name is splunk_solution (NOT vendor_product) deliberately: the UI App
# already defines a per-sourcetype search-time EVAL-vendor_product (SAP HANA,
# SAP NetWeaver ABAP, ISC:Bind, etc., ~30 sourcetypes) for dashboards, so an
# indexed vendor_product would be shadowed at search time. splunk_solution is
# a distinct, always-resolvable solution identifier.
[logserv_set_splunk_solution]
REGEX = .
FORMAT = splunk_solution::splunk_for_sap_logserv
WRITE_META = true

# cloud_provider: default is a NO-OP (REGEX never matches) so nothing is
# stamped unless an admin selects AWS or Microsoft Azure in the Data TA's
# Configuration -> Cloud Provider tab.  When a provider is selected, the
# Cloud Provider REST handler writes a local/transforms.conf override of
# this same stanza (REGEX = ., FORMAT = cloud_provider::aws|azure) inside
# its own marker block.  "Not set" removes the override, reverting to this
# no-op.  REGEX = (?!) is an empty negative lookahead — it always fails, so
# this default stamps nothing.
[logserv_set_cloud_provider]
REGEX = (?!)
FORMAT = cloud_provider::unset
WRITE_META = true
