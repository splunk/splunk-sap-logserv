site_name: Splunk for SAP LogServ
site_author: Splunk
site_url: "https://splunk.github.io/splunk-sap-logserv/"
edit_uri: "tree/main/docs/"
remote_branch: gh-pages

repo_name: Splunk for SAP LogServ
repo_url: "https://github.com/splunk/splunk-sap-logserv"

# site_dir: site

markdown_extensions:
  - toc:
      permalink: True
  - smarty
  - fenced_code
  - sane_lists
  - codehilite
  - pymdownx.superfences:
  - pymdownx.snippets
  - admonition
  - pymdownx.details
  - attr_list
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

theme:
  name: "material"
  custom_dir: docs/theme_overrides
  logo: "static/splunk-logo.png"
  favicon: "static/splunk.png"
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: black
      accent: orange
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: orange
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - content.code.copy
    #- navigation.indexes
    - navigation.instant.preview


extra_css:
  - css/extra.css

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            show_if_no_docstring: true
            filters: ["!^_"]
            show_source: true
  - autorefs
  - print-site  # should be at the end

