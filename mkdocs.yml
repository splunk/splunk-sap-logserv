site_name: Splunk for SAP LogServ
site_author: Splunk
site_url: "https://splunk.github.io/splunk-sap-logserv/"
edit_uri: "tree/main/docs/"
remote_branch: gh-pages

repo_name: Splunk for SAP LogServ
repo_url: "https://github.com/splunk/splunk-sap-logserv"

# site_dir: site

# The Connect-to-Filter migration guide stays out of the menu on purpose (user decision 2026-10-23):
# it is still built, searchable and linked from the pages that need it.
not_in_nav: |
  /content/install-setup/aws-remote-s3-connect-to-filter-migration-guide.md

validation:
  nav:
    omitted_files: info
    not_found: warn
    absolute_links: info
  links:
    not_found: warn
    anchors: warn
    absolute_links: info
    unrecognized_links: warn

markdown_extensions:
  - toc:
      permalink: True
  - smarty
  - fenced_code
  - sane_lists
  - codehilite
  - pymdownx.superfences:
  - pymdownx.snippets
  - admonition
  - pymdownx.details
  - attr_list
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

theme:
  name: "material"
  custom_dir: docs/theme_overrides
  logo: "static/splunk-logo.png"
  favicon: "static/splunk.png"
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: black
      accent: blue
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: blue
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - content.code.copy
    - navigation.instant.preview
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.indexes
    - navigation.path
    - navigation.footer
    - navigation.top
    - toc.follow
    - search.suggest
    - search.highlight


extra_css:
  - css/extra.css

extra_javascript:
  - js/limited-preview-qr.js

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            show_if_no_docstring: true
            filters: ["!^_"]
            show_source: true
  - autorefs
  - print-site:  # should be at the end
      exclude:
        - content/overview/demo-video.md  # a video only: the print page could not play it

