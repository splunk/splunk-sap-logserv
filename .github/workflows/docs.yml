name: docs

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: 3.12
      - run: pip install mkdocs==1.6.1 mkdocs-material==9.7.5 mkdocs-print-site-plugin==2.8 'mkdocstrings[python]==1.0.3' mkdocstrings-python==2.0.3 mkdocs-autorefs==1.4.4 pymdown-extensions==10.21
      - run: mkdocs gh-deploy --force
